name: Isolated ICICI and Invesco benchmark discovery
on:
  push:
    branches: ['diag/midcap-two-sources-20260928']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Inspect published scheme-specific PDF text
        run: |
          uv run --frozen python - <<'PY'
          import hashlib,json
          from io import BytesIO
          from unittest.mock import patch
          from pypdf import PdfReader
          from tracker import db,providers
          url='https://www.invescomutualfund.com/docs/default-source/factsheet/invesco-mf-factsheet-august-2026.pdf'
          with patch.object(db,'connect',side_effect=AssertionError('Database forbidden')):
            body,_,typ=providers.fetch(url,archive=False,max_bytes=16*1024*1024)
            r=PdfReader(BytesIO(body))
            print('SOURCE',json.dumps({'source':url,'sha256':hashlib.sha256(body).hexdigest(),'bytes':len(body),'content_type':typ,'pages':len(r.pages)}))
            print('COVER',repr(r.pages[0].extract_text()[:1800]))
            print('MIDCAP_PAGE_11',repr(r.pages[10].extract_text()))
          PY
