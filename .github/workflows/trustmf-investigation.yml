name: TRUSTMF v125 validation

on:
  push:
    branches: [backend/trustmf-complete-portfolio-v125]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile and run complete regression suite
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Validate live TRUSTMF workbook ingestion
        env:
          SMALLCAP_DATA_DIR: /tmp/trustmf-v125-validation
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          uv run --frozen python - <<'PY'
          import json
          from tracker import db,disclosures,amc_discovery
          db.init();disclosures.seed_sources()
          rows=[x for x in amc_discovery.discover('TRUST')
                if x[1].lower().split('?',1)[0].endswith(('.xls','.xlsx'))]
          print('DISCOVERY',json.dumps(rows,ensure_ascii=False))
          assert rows
          family,url,title=rows[0]
          assert family=='Trustmf Small Cap Fund'
          assert title=='TRUSTMF Monthly Portfolio Report as on 31.08.2026'
          assert url=='https://trustmf.com/Content/2026/9/Monthly Port_20260909123835.xlsx'
          count=amc_discovery.store_report('TRUST',family,url,title)
          snap=db.one("""SELECT p.as_of,p.complete,p.hash,p.source,COUNT(h.id) positions,SUM(h.weight) weight
            FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
            WHERE p.family=? GROUP BY p.id ORDER BY p.as_of DESC,p.id DESC LIMIT 1""",(family,))
          aum=db.one("""SELECT as_of,value,unit,source,hash FROM metrics
            WHERE family=? AND metric='aum' ORDER BY as_of DESC,id DESC LIMIT 1""",(family,))
          repo=db.one("""SELECT name,asset_type,weight FROM holdings h JOIN portfolios p ON p.id=h.snapshot_id
            WHERE p.family=? AND p.hash=? AND h.name='TREPS 01-Sep-2026' LIMIT 1""",(family,snap['hash']))
          print('COUNT',count)
          print('SNAPSHOT',json.dumps(snap))
          print('AUM',json.dumps(aum))
          print('TREPS',json.dumps(repo))
          assert count==74
          assert snap['as_of']=='2026-08-31'
          assert snap['complete']==1
          assert snap['positions']==73
          assert abs(float(snap['weight'])-100.0)<0.00001
          assert snap['hash']=='834f1709a30b972b5fb5f6322b3dd5687262daaadf32d38ded33df4c6b5ae102'
          assert abs(float(aum['value'])-3438.9023)<0.0001
          assert aum['as_of']=='2026-08-31'
          assert repo=={'name':'TREPS 01-Sep-2026','asset_type':'Money market','weight':4.5}
          PY
