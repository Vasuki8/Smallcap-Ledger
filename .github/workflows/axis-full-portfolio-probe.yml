name: Axis statutory nested portfolio probe

on:
  push:
    branches: [backend/axis-full-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Call Axis portfolio nested API exactly like browser
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.error

          ROOT="https://www.axismf.com"
          PAGE=ROOT+"/statutory-disclosures"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

          def call(method,path,payload=None,headers=None):
              body=None if payload is None else json.dumps(payload).encode()
              h={"User-Agent":UA,"Accept":"application/json,text/plain,*/*",
                 "Referer":PAGE,"Origin":ROOT}
              if body is not None:h["Content-Type"]="application/json"
              if headers:h.update(headers)
              req=urllib.request.Request(ROOT+path,data=body,method=method,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(1_000_000)
                      print("CALL",method,path,payload,"STATUS",r.status,
                            "TYPE",r.headers.get("content-type"),
                            "AUTH",r.headers.get("authorization"))
                      print(raw.decode("utf-8","replace")[:80000])
                      return r.status,raw,r.headers
              except urllib.error.HTTPError as e:
                  raw=e.read(100000)
                  print("HTTP_ERROR",method,path,payload,e.code,
                        e.headers.get("content-type"),raw.decode("utf-8","replace")[:50000])
                  return e.code,raw,e.headers
              except Exception as e:
                  print("CALL_ERROR",method,path,payload,repr(e))
                  return None,b"",{}

          # Correct browser payload: StatutoryNestedList -> {sdParentID:e.parentID}
          call("POST","/cms/get-nested-list",{"sdParentID":"sdPortfolios"})

          # Trace public CMS token bootstrap if the nested request is forbidden.
          for method,payload in (("GET",None),("POST",{}),("POST",None)):
              call(method,"/cms/token",payload)

          # Inspect implementation around public CMS token/header setup.
          bundle=ROOT+"/_next/static/chunks/2949-d62ba4877ec805c0.js"
          req=urllib.request.Request(bundle,headers={"User-Agent":UA})
          with urllib.request.urlopen(req,timeout=30) as r:js=r.read().decode("utf-8","replace")
          for term in ("/cms/token","GETCMSTOKEN","getApiServiceHeaders","getBearerToken",
                       "checkAndUpdateHeaders","prepareHeaders"):
              print("TERM",term)
              low=js.lower();q=term.lower();p=0;shown=0
              while shown<8:
                  i=low.find(q,p)
                  if i<0:break
                  print(js[max(0,i-2500):min(len(js),i+7000)])
                  p=i+len(q);shown+=1
          PY
