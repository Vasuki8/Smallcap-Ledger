name: Axis authenticated public CMS probe

on:
  push:
    branches: [backend/axis-full-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Replay Axis public CMS token flow
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, http.cookiejar

          ROOT="https://www.axismf.com"
          PAGE=ROOT+"/statutory-disclosures"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def post(path,payload,extra=None):
              raw=json.dumps(payload).encode()
              headers={"User-Agent":UA,"Accept":"application/json,text/plain,*/*",
                       "Content-Type":"application/json","Origin":ROOT,"Referer":PAGE}
              if extra:headers.update(extra)
              req=urllib.request.Request(ROOT+path,data=raw,method="POST",headers=headers)
              try:
                  with opener.open(req,timeout=30) as r:
                      body=r.read(1_000_000)
                      print("POST",path,"STATUS",r.status,"TYPE",r.headers.get("content-type"),
                            "BODY_BYTES",len(body))
                      return r.status,body
              except urllib.error.HTTPError as e:
                  body=e.read(100000)
                  print("POST_ERROR",path,e.code,body.decode("utf-8","replace")[:8000])
                  return e.code,body

          status,raw=post("/cms/token",{})
          assert status==200
          token=json.loads(raw)["data"]["token"]
          print("TOKEN_RECEIVED",bool(token),"TOKEN_LENGTH",len(token),"COOKIES",len(jar))

          candidates=[
              ("bearer",{"Authorization":"Bearer "+token}),
              ("raw_authorization",{"Authorization":token}),
              ("x_access_token",{"x-access-token":token}),
              ("x_auth_token",{"x-auth-token":token}),
              ("cms_token",{"cms-token":token}),
          ]
          for label,headers in candidates:
              print("HEADER_MODE",label)
              status,body=post("/cms/get-nested-list",{"sdParentID":"sdPortfolios"},headers)
              if status==200:
                  print("SUCCESS_MODE",label)
                  print(body.decode("utf-8","replace")[:80000])
                  break
          PY
