name: Axis statutory CMS probe

on:
  push:
    branches: [backend/axis-full-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Axis statutory CMS request contract
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re, urllib.parse, urllib.request

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          PAGE="https://www.axismf.com/statutory-disclosures"
          BUNDLE="https://www.axismf.com/_next/static/chunks/183-0b7c0e7078c2d2b0.js"

          def get(url,limit=4_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=35) as r:
                  raw=r.read(limit+1)
                  if len(raw)>limit:raise RuntimeError("oversize")
                  print("FETCH",r.status,len(raw),r.geturl(),r.headers.get("content-type"))
                  return raw.decode("utf-8","replace")

          page=get(PAGE)
          compact=re.sub(r"\s+"," ",page)
          for term in ("portfolio","monthly","fortnight","scheme documents","statutoryDisclosure","sdID","sdType"):
              print("PAGE_PATTERN",term)
              low=compact.lower();pos=0;shown=0
              while shown<20:
                  i=low.find(term.lower(),pos)
                  if i<0:break
                  print(compact[max(0,i-1200):min(len(compact),i+2800)])
                  pos=i+len(term);shown+=1

          js=get(BUNDLE)
          for term in (
              "placeGetStatutoryDisclosureDocumentList=async",
              "placeGetStatutoryDisclosureSchemeType=async",
              "placeGetStatutoryDisclosureNestedList=async",
              "GET_STATUTORY_SUBCATEGORY_DISCLOSURE_DOCUMENTS",
              "GET_STATUTORY_DISCLOSURE_DOCUMENT",
              "STATUTORY_DISCLOSURES_TYPES",
          ):
              print("JS_PATTERN",term)
              pos=js.find(term)
              if pos>=0:
                  print(js[max(0,pos-5000):min(len(js),pos+16000)])

          # Print likely JSON payloads embedded in page scripts.
          for match in re.finditer(r'\{[^{}]{0,3000}(?:portfolio|monthly|fortnight)[^{}]{0,3000}\}',page,re.I):
              candidate=html.unescape(match.group(0))
              print("PAGE_OBJECT",re.sub(r"\s+"," ",candidate)[:7000])
          PY
