name: Axis complete portfolio validation

on:
  push:
    branches:
      - backend/axis-full-portfolio-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: "1"
      SMALLCAP_ARCHIVE_FORMAT: "2"
      SMALLCAP_DATABASE_ONLY_RESTORE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.33"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Compile
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: Run regression suite
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Restore cumulative production checkpoint
        run: uv run --frozen python scripts/github_state.py restore
      - name: Apply Axis monthly portfolio recovery
        run: uv run --frozen python scripts/refresh_axis_portfolios.py
      - name: Verify production Axis complete portfolio and queue
        run: |
          uv run --frozen python - <<'PY'
          from tracker import db, coverage
          from tracker.portfolio_recovery_queue import report as queue_report
          from tracker.axis_portfolios import FAMILY

          snaps=db.rows("""SELECT p.as_of,p.complete,p.source,p.hash,COUNT(h.id) positions,
                                  SUM(h.weight) weight
                           FROM portfolios p LEFT JOIN holdings h ON h.snapshot_id=p.id
                           WHERE p.family=? GROUP BY p.id
                           ORDER BY p.as_of DESC,p.complete DESC,p.id DESC""",(FAMILY,))
          print("AXIS_SNAPSHOTS",snaps)
          complete=next((x for x in snaps if x["complete"] and x["as_of"]=="2026-08-31"),None)
          assert complete, snaps
          assert complete["positions"]==134,complete
          assert abs(float(complete["weight"])-100)<=0.05,complete
          assert "Monthly_Portfolio_Axis_Small_Cap_Fund_31_August_2026" in complete["source"]
          assert complete["hash"]

          rows=db.rows("""SELECT name,isin,quantity,weight,asset_type
                          FROM holdings h JOIN portfolios p ON p.id=h.snapshot_id
                          WHERE p.family=? AND p.as_of='2026-08-31' AND p.complete=1
                          ORDER BY h.id""",(FAMILY,))
          derivative=next(x for x in rows if x["asset_type"]=="Derivative")
          assert derivative["name"]=="NIFTY September 2026 Future",derivative
          assert derivative["quantity"]==109655,derivative
          repos=[x for x in rows if x["asset_type"]=="Money market"]
          assert len(repos)==3,repos
          assert len({x["name"] for x in repos})==3,repos

          cov=coverage.report()
          axis=next(x for x in cov["funds"] if x["family"]==FAMILY)
          print("AXIS_COVERAGE",axis)
          print("COUNTS",cov["counts"])
          assert axis["portfolio_complete"] is True,axis
          assert axis["portfolio"]["as_of"]=="2026-08-31",axis
          assert axis["portfolio"]["positions"]==134,axis
          assert axis["portfolio_limitation"] is None,axis
          assert cov["counts"]["portfolio_complete"]==29,cov["counts"]
          assert cov["counts"]["portfolio_fresh_complete"]==29,cov["counts"]
          assert cov["counts"]["portfolio_partial"]==6,cov["counts"]
          assert cov["counts"]["ter"]==35 and cov["counts"]["base_expense_ratio"]==35,cov["counts"]

          queue=queue_report()
          print("QUEUE_SUMMARY",queue["summary"])
          print("QUEUE_NEXT",queue["next_recovery_target"])
          assert FAMILY not in {x["family"] for x in queue["items"]},queue["items"]
          assert queue["summary"]["items"]==7,queue["summary"]
          assert queue["summary"]["actionable_now"]==0,queue["summary"]
          assert queue["next_recovery_target"] is None,queue["next_recovery_target"]
          PY
      - name: Generate static site
        run: uv run --frozen python scripts/export_site.py
      - name: Validate generated site
        run: uv run --frozen python scripts/validate_site.py site
