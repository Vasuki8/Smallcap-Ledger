name: Axis statutory API payload probe

on:
  push:
    branches: [backend/axis-full-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Extract Axis statutory API payload builders
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          UA="Mozilla/5.0"
          url="https://www.axismf.com/_next/static/chunks/183-0b7c0e7078c2d2b0.js"
          req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"application/javascript,*/*"})
          with urllib.request.urlopen(req,timeout=30) as r:
              js=r.read().decode("utf-8","replace")
          print("BYTES",len(js))
          terms=[
              "placeGetStatutoryDisclosureDocumentList=async",
              "placeGetStatutoryDisclosureSchemeType=async",
              "placeGetStatutoryDisclosureNestedList=async",
              "placeGetStatutorySubCategoryDisclosureDocuments=async",
              "GET_STATUTORY_DISCLOSURE_DOCUMENT",
              "GET_STATUTORY_DISCLOSURE_NESTED_LIST",
              "GET_STATUTORY_SUBCATEGORY_DISCLOSURE_DOCUMENTS",
          ]
          for term in terms:
              p=js.find(term)
              print("TERM",term,"POS",p)
              if p>=0:print(js[max(0,p-1200):min(len(js),p+6500)])
          for pat in [
              r'placeGetStatutoryDisclosureDocumentList=async[^;]{0,5000}',
              r'placeGetStatutoryDisclosureNestedList=async[^;]{0,5000}',
              r'placeGetStatutorySubCategoryDisclosureDocuments=async[^;]{0,5000}',
          ]:
              m=re.search(pat,js)
              if m:print("REGEX",pat,m.group(0))
          PY
