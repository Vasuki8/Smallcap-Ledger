name: Axis full portfolio source probe

on:
  push:
    branches: [backend/axis-full-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Restore cumulative history
        run: uv run --frozen python scripts/github_state.py restore
      - name: Trace Axis statutory portfolio surface
        run: |
          uv run --frozen python - <<'PY'
          import html, re, urllib.parse, urllib.request
          from tracker import db

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          PAGES=[
              "https://www.axismf.com/statutory-disclosures",
              "https://www.axismf.com/downloads",
          ]

          def get(url,limit=12_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read(limit+1)
                  if len(raw)>limit: raise RuntimeError("oversize")
                  print("FETCH",r.status,len(raw),r.geturl(),r.headers.get("content-type"))
                  return raw.decode("utf-8","replace")

          print("RETAINED_DOCUMENTS")
          for row in db.rows("""SELECT d.title,d.kind,d.url,d.last_seen,v.hash,v.observed_at
              FROM documents d LEFT JOIN document_versions v ON v.document_id=d.id
              WHERE d.family='Axis Small Cap Fund'
                AND (lower(d.url) LIKE '%statutory%'
                     OR lower(d.url) LIKE '%portfolio%'
                     OR lower(d.title) LIKE '%portfolio%')
              ORDER BY COALESCE(v.observed_at,d.last_seen) DESC,d.url"""):
              print(row)

          print("RETAINED_FETCHES")
          for row in db.rows("""SELECT url,fetched_at,status,hash,detail
              FROM fetches
              WHERE lower(url) LIKE '%axismf.com%'
                AND (lower(url) LIKE '%statutory%'
                     OR lower(url) LIKE '%portfolio%'
                     OR lower(url) LIKE '%.xls%'
                     OR lower(url) LIKE '%.zip%')
              ORDER BY fetched_at DESC LIMIT 200"""):
              print(row)

          pages=[]
          for u in PAGES:
              try:
                  t=get(u);pages.append((u,t))
                  print("PAGE_TERMS",u,{k:len(re.findall(k,t,re.I)) for k in (
                      "portfolio","monthly","fortnight","statutory","download","api","xlsx","xls","zip")})
                  for m in re.finditer(r'(?:href|src)=["\']([^"\']+)["\']',t,re.I):
                      v=html.unescape(m.group(1))
                      if re.search(r'portfolio|monthly|fortnight|xls|zip|api|statutory',v,re.I):
                          print("PAGE_LINK",urllib.parse.urljoin(u,v))
              except Exception as e:
                  print("PAGE_ERROR",u,repr(e))

          scripts=[]
          for base,t in pages:
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I):
                  u=urllib.parse.urljoin(base,html.unescape(src))
                  if u not in scripts:scripts.append(u)
          print("SCRIPT_COUNT",len(scripts))
          for s in scripts:print("SCRIPT",s)

          needles=("portfolio","statutory","monthly","fortnight","downloads","api/","api.","graphql","xlsx","xls","zip")
          for s in scripts:
              host=urllib.parse.urlparse(s).hostname or ""
              if not host.endswith("axismf.com"):continue
              try:t=get(s)
              except Exception as e:
                  print("SCRIPT_ERROR",s,repr(e));continue
              low=t.lower()
              matched=[n for n in needles if n in low]
              if not matched:continue
              print("MATCHED_SCRIPT",s,matched)
              for n in matched:
                  p=0;shown=0
                  while shown<20:
                      i=low.find(n,p)
                      if i<0:break
                      print("SNIP",n,re.sub(r"\s+"," ",t[max(0,i-900):min(len(t),i+2200)]))
                      p=i+len(n);shown+=1
          PY
