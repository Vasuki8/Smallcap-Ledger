name: Axis workbook reconciliation probe

on:
  push:
    branches:
      - backend/axis-full-portfolio-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.33"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Inspect Axis non-ISIN rows and totals
        run: |
          uv run --frozen python - <<'PY'
          import io,re,urllib.request
          import openpyxl
          URL="https://www.axismf.com/1/5/464/560/3622/4549/Monthly_Portfolio_Axis_Small_Cap_Fund_31_August_2026_xlsx_4a112f9ef0.xlsx"
          req=urllib.request.Request(URL,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=40) as r:raw=r.read()
          wb=openpyxl.load_workbook(io.BytesIO(raw),read_only=True,data_only=True)
          ws=wb["AXISSCF"]
          cells=list(ws.iter_rows())
          rows=[[c.value for c in row] for row in cells]
          fmts=[[c.number_format or "" for c in row] for row in cells]
          terms=re.compile(r'NIFTY|Clearing Corporation|Grand Total|Total Net Assets|Total|TREPS|Repo|Derivative|Futures|Money Market|Cash|Receivables|Treasury|Tbill',re.I)
          for i,row in enumerate(rows):
              text=" | ".join(str(v or "") for v in row[:12])
              if terms.search(text):
                  print("MATCH_ROW",i+1,row[:12])
                  print("FORMATS",fmts[i][:12])
                  for j in range(max(0,i-2),min(len(rows),i+3)):
                      print("CTX",j+1,rows[j][:12])
          wb.close()
          PY
