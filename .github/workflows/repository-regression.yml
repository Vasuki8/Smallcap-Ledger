name: Repository regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Validate source syntax
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          node --check dist/app.js
          node --check dist/research.js
          node --check dist/analytics.js
          node --check dist/static-data.js
          node --check dist/runtime-config.js
      - name: Run full regression suite
        run: uv run --frozen python -m unittest discover -s tests -v
