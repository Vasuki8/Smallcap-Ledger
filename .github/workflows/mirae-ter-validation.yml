name: Validate Mirae TER integration

on:
  push:
    branches: [feature/mirae-ter-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Compile
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Live Mirae disclosure validation
        run: |
          uv run --frozen python - <<'PY'
          from datetime import date, timedelta
          from tracker import amc_expenses, db
          db.init()
          source, day, plans, content_hash = amc_expenses._mirae_disclosure(date.today())
          assert source.startswith("https://www.miraeassetmf.co.in/DailyUploads/TotalExpenseRatio/")
          assert day >= (date.today() - timedelta(days=7)).isoformat()
          assert content_hash
          for plan in ("Regular", "Direct"):
              values = plans[plan]
              assert values["ter"] >= values["base_expense_ratio"]
              assert abs(
                  values["base_expense_ratio"]
                  + values["brokerage"]
                  + values["transaction_cost"]
                  + values["statutory_levies"]
                  - values["ter"]
              ) <= 0.02
          print("MIRAE_LIVE", source, day, plans, content_hash)
          PY
