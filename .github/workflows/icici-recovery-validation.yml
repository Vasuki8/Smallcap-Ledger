name: Validate ICICI portfolio recovery

on:
  push:
    branches: [backend/icici-blob-portfolio-recovery-20260926]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: Restore cumulative history
        run: uv run --frozen python scripts/github_state.py restore
      - name: Load reviewed retention classifications
        run: uv run --frozen python scripts/prepare_retention_metadata.py --apply
      - name: Run ICICI recovery regression tests
        run: uv run --frozen python -m unittest -v tests.test_icici_portfolios
      - name: Run live ICICI recovery
        run: uv run --frozen python scripts/refresh_icici_portfolios.py
      - name: Verify recovered snapshots
        run: |
          uv run --frozen python - <<'PY'
          from tracker import db
          rows=db.rows("""SELECT p.as_of,p.complete,p.source,p.hash,COUNT(h.id) positions,
                                 SUM(h.weight) weight
                          FROM portfolios p LEFT JOIN holdings h ON h.snapshot_id=p.id
                          WHERE p.family='ICICI Prudential Small Cap Fund'
                          GROUP BY p.id ORDER BY p.as_of DESC,p.id DESC LIMIT 4""")
          for row in rows: print('ICICI_RECOVERED',dict(row))
          assert len(rows)>=2
          assert rows[0]['as_of']=='2026-08-31' and rows[0]['complete']==1
          assert rows[1]['as_of']=='2026-07-31' and rows[1]['complete']==1
          assert rows[0]['positions']>=80 and rows[1]['positions']>=80
          assert '/blob/downloads/Files/Monthly%20Portfolio%20Disclosures/' in rows[0]['source']
          assert '/blob/downloads/Files/Monthly%20Portfolio%20Disclosures/' in rows[1]['source']
          PY
