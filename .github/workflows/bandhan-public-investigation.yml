name: Bandhan public disclosure investigation

on:
  push:
    branches: [backend/bandhan-public-disclosure-v129b]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect latest public Bandhan equity-hybrid workbook
        run: |
          uv run --frozen python - <<'PY'
          import urllib.request,io,hashlib,json,re,openpyxl
          from tracker.portfolio_parser import parse_sheet
          url='https://storage.googleapis.com/nonprod-static-assets-121to59kaawfgfi7bol/2025/06/b100897c-bandhan-equity-hybrid-fund-portfolios-as-on-31-may-2025.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              body=r.read()
              print('SOURCE',r.status,r.headers.get('Content-Type'),len(body),hashlib.sha256(body).hexdigest())
          assert body[:2]==b'PK'
          book=openpyxl.load_workbook(io.BytesIO(body),read_only=True,data_only=True)
          for ws in book.worksheets:
              cells=list(ws.iter_rows())
              data=[[c.value for c in row] for row in cells]
              formats=[[c.number_format or '' for c in row] for row in cells]
              prefix=' '.join(str(v) for row in data[:35] for v in row if v not in (None,''))
              if 'small cap' not in (ws.title+' '+prefix).lower():continue
              parsed=parse_sheet(data,formats,'Bandhan Small Cap Fund')
              print('SHEET',ws.title,'ROWS',len(data))
              print('HEAD',prefix[:5000])
              if parsed:
                  print('PARSED',json.dumps({
                    'day':parsed['day'],'complete':parsed['complete'],
                    'positions':len(parsed['positions']),
                    'weight':sum(x['weight'] for x in parsed['positions']),
                    'aum':parsed['aum'],'unknown_rows':parsed.get('unknown_rows',[])
                  },ensure_ascii=False))
              for i,row in enumerate(data):
                  txt=' | '.join(str(x) for x in row if x not in (None,''))
                  if any(k in txt.lower() for k in ('company','total','net asset','treps','repo','cash','margin','derivative','small cap fund')):
                      print('ROW',i+1,txt[:2200])
          book.close()
          PY
