name: Bandhan monthly portfolio validation

on:
  push:
    branches: [backend/bandhan-public-disclosure-v129b]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile and run complete regression suite
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Validate live Bandhan August and July workbooks
        env:
          SMALLCAP_DATA_DIR: /tmp/bandhan-validation
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          uv run --frozen python - <<'PY'
          import json
          from tracker import db,disclosures,amc_discovery
          from tracker.bandhan_portfolios import FAMILY,MEDIA_BUCKET,PARSER_VERSION
          db.init();disclosures.seed_sources()
          rows=list(amc_discovery.discover('Bandhan'))
          print('DISCOVERY',json.dumps(rows,ensure_ascii=False))
          assert len(rows)==2
          for row in rows:
              count=amc_discovery.store_report('Bandhan',*row)
              print('INGEST',row[1],count)
          snaps=db.rows("""SELECT p.id,p.as_of,p.complete,p.hash,p.source,
            COUNT(h.id) positions,SUM(h.weight) weight
            FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
            WHERE p.family=? GROUP BY p.id ORDER BY p.as_of DESC,p.id DESC""",(FAMILY,))
          print('SNAPSHOTS',json.dumps(snaps,ensure_ascii=False))
          assert len(snaps)==2
          aug,jul=snaps
          assert aug['as_of']=='2026-08-31' and jul['as_of']=='2026-07-31'
          assert aug['complete']==0 and jul['complete']==0
          assert aug['positions']>=250 and jul['positions']>=250
          assert abs(float(aug['weight'])-100)<.02 and abs(float(jul['weight'])-100)<.02
          assert aug['hash']=='f793184232eb89f776bfab87cc6729dd203af3fce6d054ca23332d6667828975'
          assert jul['hash']=='4e5980ac2cbbe4231b73dabce6765003bc8766e68981fe82b213c50f5ec590b0'
          assert '/'+MEDIA_BUCKET+'/' in aug['source']
          aug_censored=db.rows("""SELECT h.name FROM holdings h JOIN portfolios p ON p.id=h.snapshot_id
            WHERE p.family=? AND p.as_of='2026-08-31' AND h.name IN (
              'Happiest Minds Technologies Limited','Kalpataru Projects International Limited',
              '^^GSPL Transmission Limited **','^^INOX Renewable Solutions Ltd **')""",(FAMILY,))
          jul_censored=db.rows("""SELECT h.name FROM holdings h JOIN portfolios p ON p.id=h.snapshot_id
            WHERE p.family=? AND p.as_of='2026-07-31' AND h.name IN (
              '^^GSPL Transmission Limited **','^^INOX Renewable Solutions Ltd **')""",(FAMILY,))
          jul_kalpataru=db.one("""SELECT h.weight FROM holdings h JOIN portfolios p ON p.id=h.snapshot_id
            WHERE p.family=? AND p.as_of='2026-07-31' AND h.name='Kalpataru Projects International Limited'""",(FAMILY,))
          print('CENSORED_STORED',json.dumps({'aug':aug_censored,'jul':jul_censored},ensure_ascii=False))
          print('JUL_KALPATARU',json.dumps(jul_kalpataru))
          assert aug_censored==[] and jul_censored==[]
          assert jul_kalpataru and jul_kalpataru['weight']>0
          for day in ('2026-08-31','2026-07-31'):
              names={r['name']:r for r in db.rows("""SELECT h.name,h.asset_type,h.weight
                FROM holdings h JOIN portfolios p ON p.id=h.snapshot_id
                WHERE p.family=? AND p.as_of=?""",(FAMILY,day))}
              print('KEY_ROWS',day,json.dumps({k:names.get(k) for k in names if
                    k.startswith('Triparty Repo') or k in ('Cash Margin - CCIL','Cash Margin - Derivatives',
                    'Cash / Bank Balance','Net Receivables/Payables','Net Current Assets')},ensure_ascii=False))
              assert any(k.startswith('Triparty Repo TRP_') for k in names)
              assert names['Cash Margin - CCIL']['asset_type']=='Cash and net current assets'
              assert names['Cash Margin - Derivatives']['asset_type']=='Cash and net current assets'
              assert names['Cash / Bank Balance']['asset_type']=='Cash and net current assets'
              assert names['Net Receivables/Payables']['weight']<0
              assert 'Net Current Assets' not in names
          ex=db.rows("SELECT DISTINCT parser_version FROM document_extractions WHERE family=?",(FAMILY,))
          print('EXTRACTIONS',json.dumps(ex))
          assert {r['parser_version'] for r in ex}=={PARSER_VERSION}
          # Cached replay must not create extra snapshots/holdings.
          for row in rows:amc_discovery.store_report('Bandhan',*row)
          assert db.one("SELECT COUNT(*) n FROM portfolios WHERE family=?",(FAMILY,))['n']==2
          PY
