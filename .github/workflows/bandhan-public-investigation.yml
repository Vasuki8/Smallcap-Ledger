name: Bandhan public disclosure investigation

on:
  push:
    branches: [backend/bandhan-public-disclosure-v129b]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Validate current Bandhan Small Cap workbooks
        run: |
          uv run --frozen python - <<'PY'
          import urllib.request,urllib.parse,json,re,io,hashlib,openpyxl
          from tracker.portfolio_parser import parse_sheet
          api='https://cmsnew.bandhanmutual.com/wp-json/finance-api/v1/posts/disclosures'
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for post_id in (158853,155405):
              req=urllib.request.Request(api+'?'+urllib.parse.urlencode({'id':post_id}),headers=headers)
              with urllib.request.urlopen(req,timeout=40) as r:data=json.loads(r.read())
              rows=data.get('data') or []
              assert len(rows)==1 and int(rows[0]['id'])==post_id
              item=rows[0];acf=item.get('acf_fields') or {};files=acf.get('disclosure_files') or []
              print('API_ROW',json.dumps({'id':item['id'],'title':item['title'],'date':item['date'],
                    'fund':(acf.get('funds_mapping') or {}).get('post_title'),
                    'financial_year':acf.get('financial_year'),'disclosures_type':acf.get('disclosures_type'),
                    'files':files},ensure_ascii=False))
              assert len(files)==1
              link=files[0]['document_link'];url=link['url']
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  body=r.read();typ=r.headers.get('Content-Type')
              h=hashlib.sha256(body).hexdigest()
              print('SOURCE',post_id,url,len(body),typ,h,body[:8].hex())
              assert body[:2]==b'PK'
              book=openpyxl.load_workbook(io.BytesIO(body),read_only=True,data_only=True)
              found=0
              for ws in book.worksheets:
                  cells=list(ws.iter_rows())
                  data0=[[c.value for c in row] for row in cells]
                  formats=[[c.number_format or '' for c in row] for row in cells]
                  prefix=' '.join(str(v) for row in data0[:40] for v in row if v not in (None,''))
                  if 'small cap' not in (ws.title+' '+prefix).lower():continue
                  found+=1
                  parsed=parse_sheet(data0,formats,'Bandhan Small Cap Fund')
                  print('SHEET',post_id,ws.title,'ROWS',len(data0),'HEAD',prefix[:2600])
                  if parsed:
                      print('PARSED',post_id,json.dumps({
                        'day':parsed['day'],'complete':parsed['complete'],
                        'positions':len(parsed['positions']),
                        'weight':sum(x['weight'] for x in parsed['positions']),
                        'aum':parsed['aum'],'unknown_rows':parsed.get('unknown_rows',[])
                      },ensure_ascii=False))
                      unknown=set(parsed.get('unknown_rows',[]))
                  else:
                      unknown=set()
                  for i,row in enumerate(data0):
                      txt=' | '.join(str(x) for x in row if x not in (None,''))
                      if (any(k in txt.lower() for k in ('grand total','net asset','treps','repo','cash','margin','derivative','name of the instrument','company'))
                          or any(u and u in txt for u in unknown)):
                          print('ROW',post_id,i+1,txt[:1800])
              book.close()
              print('SMALLCAP_SHEETS',post_id,found)
          PY
