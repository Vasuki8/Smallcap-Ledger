name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Extract Bandhan post variables and plugin asset variants
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.parse,json
          posts=[
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026/',
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026/',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          for post in posts:
              req=urllib.request.Request(post,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:text=r.read().decode('utf-8','replace')
              print('POST',post)
              for needle in ('postId','post_id','ajaxurl','nonce','custom-excel','admin-ajax.php','download_excel','excel_download'):
                  positions=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
                  print('HITS',needle,positions[:30])
                  for pos in positions[:5]:
                      print('SNIP',needle,repr(text[max(0,pos-600):pos+1800]))
          paths=[
            '/wp-content/plugins/custom-excel-download/js/custom-excel-download.js?ver=1.0',
            '/wp-content/plugins/custom-excel-download/js/custom-excel-download.js',
          ]
          for host in ('https://cmsnew.bandhanmutual.com','https://bandhanmutual.com','https://www.bandhanmutual.com'):
              for path in paths:
                  url=host+path
                  req=urllib.request.Request(url,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          body=r.read();print('ASSET',url,r.status,r.headers.get('Content-Type'),len(body),r.geturl(),repr(body[:10000]))
                  except urllib.error.HTTPError as e:
                      print('ASSET_HTTP',url,e.code,e.headers.get('Location'),e.headers.get('Content-Type'))
                  except Exception as e:
                      print('ASSET_ERROR',url,repr(e))
          PY
