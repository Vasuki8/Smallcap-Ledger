name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Decode Bandhan crypto primitive names
        run: |
          python - <<'PY'
          import urllib.request,subprocess
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')
          end=js.find(',((()=>{');prefix=js[:end]
          for suffix in (';',');','));'):
              code=prefix+suffix+"""
              console.log(JSON.stringify({
                p5602:a0_0x2580(0x5602), p0b9c:a0_0x2580(0xb9c),
                p4cd3:a0_0x2580(0x4cd3), p5066:a0_0x2580(0x5066),
                p1a2d:a0_0x2580(0x1a2d), p51b1:a0_0x2580(0x51b1),
                p189e:a0_0x2580(0x189e), p30e8:a0_0x2580(0x30e8),
                p42fa:a0_0x2580(0x42fa), p2ef9:a0_0x2580(0x2ef9),
                p4070:a0_0x2580(0x4070)
              }));
              """
              open('/tmp/decoder.js','w').write(code)
              cp=subprocess.run(['node','/tmp/decoder.js'],capture_output=True,text=True,timeout=20)
              print('DECODE',repr(suffix),cp.returncode,cp.stdout.strip(),cp.stderr[:300])
              if cp.returncode==0:break
          PY
