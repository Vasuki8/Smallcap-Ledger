name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Resolve indexed Bandhan August post slug and attachments
        run: |
          python - <<'PY'
          import urllib.request,re,json,urllib.parse
          base='https://cmsnew.bandhanmutual.com/'
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'}
          roots=[
            'monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026',
            'monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026',
          ]
          for root in roots:
              for suffix in ['']+[f'-{i}' for i in range(2,9)]:
                  url=base+root+suffix+'/'
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=20) as r:
                          body=r.read().decode('utf-8','replace')
                      title=re.search(r'<h1[^>]*>(.*?)</h1>',body,re.I|re.S)
                      clean=re.sub(r'<[^>]+>',' ',title.group(1)).strip() if title else ''
                      if 'Bandhan Small Cap Fund' not in clean:continue
                      print('POST',url,'TITLE',clean,'LEN',len(body))
                      for m in re.finditer(r'https?://[^"\'<>\s]+|(?:href|src|data-[\w-]+)=["\']([^"\']+)["\']',body,re.I):
                          val=m.group(1) or m.group(0)
                          val=urllib.parse.unquote(val.replace('&amp;','&'))
                          if re.search(r'\.xlsx?|\.xls|portfolio|download|media|storage\.googleapis',val,re.I):
                              print('TOKEN',val[:3000])
                  except Exception as e:
                      print('MISS',url,type(e).__name__,getattr(e,'code',''))
          PY
