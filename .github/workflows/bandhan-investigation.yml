name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Trace Bandhan custom Excel download script
        run: |
          uv run --frozen python - <<'PY'
          import re,urllib.request,urllib.parse,json
          from bs4 import BeautifulSoup
          posts=[
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026/',
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026/',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/javascript,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read();print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),r.geturl())
                  return b.decode('utf-8','replace')
          scripts=set()
          for post in posts:
              text=get(post);soup=BeautifulSoup(text,'html.parser')
              article=soup.find('article')
              print('POST_ID',post,article.get('id') if article else None)
              tag=soup.find('script',id='custom-excel-download-js')
              print('SCRIPT_TAG',str(tag)[:12000] if tag else 'NONE')
              if tag and tag.get('src'):
                  scripts.add(urllib.parse.urljoin(post,tag['src']))
              # Inspect element classes/data attrs likely used by the download JS.
              for node in soup.find_all(True):
                  blob=' '.join([node.name,str(node.get('class') or ''),json.dumps(node.attrs,ensure_ascii=False)])
                  if re.search(r'excel|download|portfolio',blob,re.I):
                      print('NODE',str(node)[:12000])
          for url in scripts:
              js=get(url)
              print('SCRIPT_URL',url)
              for needle in ('ajax','post_id','postId','download','excel','nonce','admin-ajax','wp-json','fetch','XMLHttpRequest'):
                  start=0;count=0
                  while count<20:
                      i=js.lower().find(needle.lower(),start)
                      if i<0:break
                      print('JS_CTX',needle,js[max(0,i-2500):i+5500])
                      start=i+len(needle);count+=1
          PY
