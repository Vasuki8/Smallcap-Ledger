name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect exact Bandhan Small Cap disclosure page
        run: |
          python - <<'PY'
          import urllib.request,re,json,html
          base='https://cmsnew.bandhanmutual.com'
          slugs=[
            'monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026',
            'monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026',
            'monthly-and-half-yearly-bandhan-small-cap-fund-30-june-2026',
          ]
          H={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'}
          for slug in slugs:
              u=f'{base}/{slug}/'
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=35) as r:
                      body=r.read().decode('utf-8','replace')
                  print('PAGE',slug,'BYTES',len(body),'FINAL',r.geturl())
                  for pat in (
                    r'postid-(\d+)',r'\?p=(\d+)',r'"postId"\s*:\s*(\d+)',
                    r'"post_id"\s*:\s*(\d+)',r'wp-json[^"\']+',
                    r'https?://[^"\'<> ]+\.(?:xlsx?|xls|pdf)(?:\?[^"\'<> ]*)?'
                  ):
                      vals=[]
                      for m in re.finditer(pat,body,re.I):
                          vals.append(m.group(1) if m.lastindex else html.unescape(m.group(0)))
                      if vals:print('PAGE_MATCH',slug,pat,json.dumps(list(dict.fromkeys(vals))[:80]))
                  # Show short contexts around attachment/media/storage clues.
                  for needle in ('storage.googleapis.com','wp-content/uploads','document_link','attachment','portfolio'):
                      positions=[];start=0
                      while len(positions)<12:
                          i=body.lower().find(needle.lower(),start)
                          if i<0:break
                          positions.append(i);start=i+len(needle)
                      for i in positions[:5]:
                          print('CTX',slug,needle,repr(body[max(0,i-800):i+2200]))
              except Exception as e:print('PAGE_ERROR',slug,repr(e))
          PY
