name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Trace Bandhan public request encryption helpers
        run: |
          python - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',
                                     headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')
          for needle in ('_0x526877=', 'function _0x526877', '_0x3844f1=', 'function _0x3844f1',
                         'REACT_APP_DATA_IN_TRANSIT_PUBLIC_KEY', 'REACT_APP_DATA_IN_TRANSIT',
                         'WtUbdIoA2i54d3q0zdm2ZUGMxrTuh57kzxOSeAoTInObKvAV'):
              pos=[];start=0
              while len(pos)<20:
                  i=js.find(needle,start)
                  if i<0:break
                  pos.append(i);start=i+len(needle)
              print('POSITIONS',needle,pos)
              for i in pos:
                  print('CTX',needle,i,repr(js[max(0,i-7000):i+12000]))
          PY
