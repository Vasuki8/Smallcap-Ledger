name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Decode Bandhan encryption headers and signature helper
        run: |
          python - <<'PY'
          import urllib.request,subprocess
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')

          i=js.find('_0x3844f1=')
          print('SIGNATURE_HELPER',repr(js[i:i+9000]))

          end=js.find(',((()=>{')
          prefix=js[:end]
          for suffix in (';',');','));'):
              code=prefix+suffix+"""
              console.log(JSON.stringify({
                publicKey:a0_0x2580(0x14de),
                cipherAlgorithm:a0_0x2580(0x329d),
                utf8:a0_0x2580(0x4317),
                rsaScheme:a0_0x2580(0x2732),
                clientSignatureHeader:a0_0x2580(0x541b),
                bandhanSignatureHeader:a0_0x2580(0x1bb9),
                internalProxyHeader:a0_0x2580(0x4290),
                internalProxyValue:a0_0x2580(0x27c5),
                platformHeader:a0_0x2580(0x2af2),
                apiKey:a0_0x2580(0x3888),
                signatureEnabled:a0_0x2580(0x17e),
                alphabet:a0_0x2580(0x36a1)
              }));
              """
              open('/tmp/decoder.js','w').write(code)
              cp=subprocess.run(['node','/tmp/decoder.js'],capture_output=True,text=True,timeout=20)
              print('DECODE',repr(suffix),cp.returncode,cp.stdout.strip(),cp.stderr[:300])
              if cp.returncode==0:break
          PY
