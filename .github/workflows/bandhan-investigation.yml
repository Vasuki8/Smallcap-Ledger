name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Resolve Bandhan CMS disclosure path literals
        run: |
          python - <<'PY'
          import re,urllib.request
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:js=r.read().decode('utf-8','replace')
          for pat in (
              r'[^"\']{0,300}wp-json[^"\']{0,500}',
              r'[^"\']{0,300}finance-api[^"\']{0,700}',
              r'[^"\']{0,300}additional[^"\']{0,800}',
              r'[^"\']{0,300}disclosure[^"\']{0,800}',
          ):
              vals=[]
              for m in re.finditer(pat,js,re.I):
                  v=m.group(0)
                  if v not in vals:vals.append(v)
              for v in vals[:250]: print('RAW',re.sub(r'\s+',' ',v)[:3000])
          # Exact contexts where getAdditionalDisc is defined/called.
          for needle in ('getAdditionalDisc',"'data':_0x3ad76b['getAdditionalDisc']",'getAdditionalDisclosureApi','getNewAdditionalDisclosureApi'):
              start=0;count=0
              while count<20:
                  i=js.find(needle,start)
                  if i<0:break
                  print('CTX',needle,re.sub(r'\s+',' ',js[max(0,i-7000):i+11000]))
                  start=i+len(needle);count+=1
          PY
