name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Trace Bandhan public API key header setup
        run: |
          python - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',
                                     headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')
          needles=['x-api-key','api-key','apikey','API_KEY','apiKey','x-custom-timestamp']
          for needle in needles:
              pos=[];start=0
              while len(pos)<30:
                  i=js.lower().find(needle.lower(),start)
                  if i<0:break
                  pos.append(i);start=i+len(needle)
              print('POSITIONS',needle,pos)
              for i in pos:
                  print('CTX',needle,i,repr(js[max(0,i-6500):i+9000]))
          PY
