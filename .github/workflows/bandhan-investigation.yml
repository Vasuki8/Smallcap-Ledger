name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Query Bandhan public finance disclosure API
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,re
          base='https://cmsnew.bandhanmutual.com/wp-json/finance-api/v1/posts/disclosures?'
          queries=[
            'acf_key=download_center_type&acf_value=portfolio&bypass_pagination=true',
            'posts_per_page=2500&acf_key=download_center_type&acf_value=portfolio',
            'posts_per_page=2500',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for q in queries:
              url=base+q
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      body=r.read(); print('FETCH',url,r.status,r.headers.get('Content-Type'),len(body),r.geturl())
                  text=body.decode('utf-8','replace')
                  data=json.loads(text)
                  print('TYPE',type(data).__name__)
                  print('TOP',json.dumps(data,ensure_ascii=False)[:12000])
                  def walk(x,path='root'):
                      if isinstance(x,dict):
                          blob=json.dumps(x,ensure_ascii=False)
                          if re.search(r'Bandhan\s+Small\s+Cap\s+Fund',blob,re.I):
                              print('SMALLCAP',path,blob[:40000])
                          for k,v in x.items():walk(v,path+'.'+str(k))
                      elif isinstance(x,list):
                          for i,v in enumerate(x):walk(v,path+f'[{i}]')
                  walk(data)
              except Exception as e:
                  print('ERROR',url,repr(e))
                  if getattr(e,'read',None):
                      try: print('ERROR_BODY',e.read().decode('utf-8','replace')[:5000])
                      except: pass
          PY
