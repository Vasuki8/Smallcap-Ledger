name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect exact Bandhan Small Cap post attachments
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.parse,json
          from html import unescape
          posts=[
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026/',
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026/',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'}
          for post in posts:
              req=urllib.request.Request(post,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read();text=body.decode('utf-8','replace')
                  print('FETCH',post,r.status,r.headers.get('Content-Type'),len(body),r.geturl())
              print('TITLE_MATCH',re.findall(r'<title>(.*?)</title>',text,re.I|re.S)[:3])
              refs=[]
              pats=[
                  r'(?:href|src|data-file|data-src|data-url|data-download|value)=["\']([^"\']+)["\']',
                  r'https?://[^"\'<>\s]+',
                  r'/wp-content/uploads/[^"\'<>\s]+',
                  r'/[^"\'<>\s]+\.(?:xlsx?|xml|pdf|zip)(?:\?[^"\'<>\s]*)?',
              ]
              for pat in pats:
                  for m in re.finditer(pat,text,re.I):
                      value=unescape(m.group(1) if m.lastindex else m.group(0))
                      value=urllib.parse.urljoin(post,value)
                      if value not in refs:refs.append(value)
              for value in refs:
                  if re.search(r'portfolio|small|cap|upload|\.xlsx?|\.pdf|\.zip|\.xml',value,re.I):
                      print('REF',value[:3000])
              for needle in ('wp-content/uploads','portfolio','attachment','download','Small Cap Fund','iframe','embed'):
                  m=re.search(needle,text,re.I)
                  if m:print('CTX',needle,text[max(0,m.start()-2500):m.start()+6000])
          PY
