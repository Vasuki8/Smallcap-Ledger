name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Trace Bandhan new SCHEME_PORTFOLIOS disclosure path
        run: |
          python - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')
          for needle in ('getNewAdditionalDisclosureApi','SCHEME_PORTFOLIOS','schemePortfolios','scheme-portfolios'):
              pos=[];start=0
              while len(pos)<40:
                  i=js.find(needle,start)
                  if i<0:break
                  pos.append(i);start=i+len(needle)
              print('POSITIONS',needle,pos)
              for i in pos[:20]:
                  print('CTX',needle,i,repr(js[max(0,i-3200):i+7000]))
          PY
