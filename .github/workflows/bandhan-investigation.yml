name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Search Bandhan public HTML for exact Small Cap posts
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.parse
          from html import unescape
          base='https://cmsnew.bandhanmutual.com'
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r:
                  b=r.read();print('FETCH',url,r.status,len(b),r.geturl());return b.decode('utf-8','replace')
          urls=[
            base+'/?s='+urllib.parse.quote_plus('Bandhan Small Cap Fund 31 August 2026'),
            base+'/?s='+urllib.parse.quote_plus('Bandhan Small Cap Fund 31 July 2026'),
            base+'/category/scheme-portfolios/monthly-and-half-yearly/',
          ]
          urls += [base+f'/category/scheme-portfolios/monthly-and-half-yearly/page/{i}/' for i in range(2,18)]
          seen=set()
          for url in urls:
              try:text=get(url)
              except Exception as e:print('ERROR',url,repr(e));continue
              if re.search(r'Bandhan\s+Small\s+Cap\s+Fund',text,re.I):
                  print('PAGE_HIT',url)
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  href=urllib.parse.urljoin(url,unescape(m.group(1)))
                  label=' '.join(unescape(re.sub(r'<[^>]+>',' ',m.group(2))).split())
                  blob=href+' '+label
                  if re.search(r'Bandhan\s+Small\s+Cap\s+Fund',label,re.I) or re.search(r'bandhan[-_/ ]*small[-_/ ]*cap',href,re.I):
                      key=(href,label)
                      if key not in seen:
                          seen.add(key);print('MATCH',href,'|',label[:1200])
              # Print raw context around any textual hit to catch JS/data attrs.
              for m in re.finditer(r'Bandhan\s+Small\s+Cap\s+Fund',text,re.I):
                  print('CONTEXT',url,text[max(0,m.start()-1800):m.start()+3500])
                  break
          PY
