name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Probe Bandhan WordPress portfolio records
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          base='https://cmsnew.bandhanmutual.com'
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),r.geturl())
                  return b
          urls=[
            base+'/wp-json/',
            base+'/wp-json/wp/v2/types',
            base+'/wp-json/wp/v2/search?search='+urllib.parse.quote('Bandhan Small Cap Fund 31 August 2026')+'&per_page=100',
            base+'/wp-json/wp/v2/posts?search='+urllib.parse.quote('Bandhan Small Cap Fund 31 August 2026')+'&per_page=100&_embed=1',
            base+'/wp-json/wp/v2/pages?search='+urllib.parse.quote('Bandhan Small Cap Fund 31 August 2026')+'&per_page=100&_embed=1',
            base+'/wp-json/wp/v2/media?search='+urllib.parse.quote('Bandhan Small Cap Fund')+'&per_page=100',
            base+'/wp-json/wp/v2/media?search='+urllib.parse.quote('Small Cap')+'&after=2026-09-01T00:00:00&before=2026-09-20T23:59:59&per_page=100',
          ]
          for url in urls:
              try:
                  body=get(url); text=body.decode('utf-8','replace')
                  if '/wp-json/'==urllib.parse.urlparse(url).path:
                      data=json.loads(text)
                      routes=[k for k in data.get('routes',{}) if re.search(r'portfolio|scheme|download|media|attachment',k,re.I)]
                      print('ROUTES',json.dumps(routes[:300]))
                  else:
                      try:data=json.loads(text)
                      except: print('TEXT',text[:16000]); continue
                      print('JSON',url,json.dumps(data,ensure_ascii=False)[:50000])
              except Exception as e:
                  print('ERROR',url,repr(e))
          PY
