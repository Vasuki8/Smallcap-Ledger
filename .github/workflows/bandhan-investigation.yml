name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Extract Bandhan download script localization
        run: |
          uv run --frozen python - <<'PY'
          import urllib.request,re,json
          from bs4 import BeautifulSoup
          posts=[
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026/',
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026/',
          ]
          for post in posts:
              req=urllib.request.Request(post,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:text=r.read().decode('utf-8','replace')
              soup=BeautifulSoup(text,'html.parser')
              article=soup.find('article')
              print('POST',post,'ID',article.get('id') if article else None)
              for script in soup.find_all('script'):
                  sid=str(script.get('id') or '')
                  src=str(script.get('src') or '')
                  body=script.string or script.get_text() or ''
                  blob=sid+' '+src+' '+body
                  if re.search(r'excel|download|ajax|postId|post_id|nonce|custom',blob,re.I):
                      print('SCRIPT',json.dumps({'id':sid,'src':src,'body':body[:30000]},ensure_ascii=False))
              # Look for exact JS assignment-like tokens outside script parsing too.
              for pat in (
                  r'(?:var|const|let)\s+[A-Za-z_$][\w$]*\s*=\s*\{[^;]{0,20000}\};',
                  r'wp_localize_script[^<]{0,20000}',
                  r'admin-ajax\.php[^"\'<>\s]{0,1000}',
              ):
                  for m in re.finditer(pat,text,re.I|re.S):
                      value=m.group(0)
                      if re.search(r'excel|download|ajax|post|nonce',value,re.I):
                          print('RAW',value[:30000])
          PY
