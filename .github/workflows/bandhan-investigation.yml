name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Extract Bandhan scheme-portfolio API contract
        run: |
          python - <<'PY'
          import re,urllib.request,json
          url='https://bandhanmutual.com/static/js/main.ce5a3574.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:js=r.read().decode('utf-8','replace')
          needles=[
            'SCHEME_PORTFOLIOS','disclosure_files','disclosures_type',
            'getAdditionalDisclosureApi','getNewAdditionalDisclosureApi',
            'monthly-portfolio','DOWNLOAD_EXCEL','portfolio_link',
            'statutory-disclosures/scheme-portfolios',
          ]
          for needle in needles:
              positions=[m.start() for m in re.finditer(re.escape(needle),js,re.I)]
              print('HITS',needle,positions[:30])
              for pos in positions[:8]:
                  frag=js[max(0,pos-1800):pos+4200]
                  # compact whitespace to make the relevant contract readable
                  frag=re.sub(r'\s+',' ',frag)
                  print('CTX',needle,frag)
          # Surface API-ish string literals globally but only if disclosure related.
          lits=[]
          for m in re.finditer(r'["\']([^"\']{1,350})["\']',js):
              v=m.group(1)
              if (re.search(r'disclos|portfolio|additional',v,re.I)
                  and re.search(r'api|/|v\d|download|disclos|portfolio',v,re.I)):
                  if v not in lits:lits.append(v)
          for v in lits[:500]:print('LIT',v)
          PY
