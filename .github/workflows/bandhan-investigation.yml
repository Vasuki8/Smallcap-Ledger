name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace public Bandhan API key configuration
        run: |
          python - <<'PY'
          import urllib.request,re,json
          base='https://bandhanmutual.com'
          headers={'User-Agent':'Mozilla/5.0'}
          urls=[
            base+'/static/js/main.ce5a3574.js',
            base+'/static/js/main.ce5a3574.js.map',
            base+'/asset-manifest.json',
            base+'/manifest.json',
            base+'/config.json',
            base+'/env.json',
          ]
          bodies={}
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=35) as r:
                      body=r.read()
                      bodies[url]=body
                      print('FETCH',url,r.status,r.headers.get('Content-Type'),len(body),r.geturl())
              except Exception as e:
                  print('FETCH_ERROR',url,repr(e))
          for url,body in bodies.items():
              text=body.decode('utf-8','replace')
              low=text.lower()
              for needle in ('x-api-key','apikey','api_key','api-key','pnservices.bandhanmutual.com','cms-call'):
                  pos=[];start=0
                  while len(pos)<30:
                      i=low.find(needle.lower(),start)
                      if i<0:break
                      pos.append(i);start=i+len(needle)
                  print('POSITIONS',url,needle,pos[:30])
                  for i in pos[:12]:
                      print('CTX',url,needle,i,repr(text[max(0,i-2200):i+4200]))
              # Source maps can preserve readable source files and sourceContent.
              if url.endswith('.map'):
                  try:
                      data=json.loads(text)
                      print('MAP_KEYS',list(data)[:20])
                      print('MAP_SOURCES',len(data.get('sources',[])),len(data.get('sourcesContent',[]) or []))
                      for src,srcbody in zip(data.get('sources',[]),data.get('sourcesContent',[]) or []):
                          if srcbody and any(n in srcbody.lower() for n in ('x-api-key','cms-call','pnservices.bandhanmutual.com')):
                              print('MAP_SOURCE_MATCH',src)
                              print(srcbody[:50000])
                  except Exception as e:print('MAP_ERROR',repr(e))
          PY
