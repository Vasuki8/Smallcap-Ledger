name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Decode Bandhan disclosure constants
        run: |
          python - <<'PY'
          import urllib.request,subprocess,tempfile,os
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')
          start=js.find('function a0_0x1da1')
          end=js.find(',((()=>{',start)
          print('BOUNDS',start,end)
          if start<0 or end<0:raise SystemExit('decoder bounds missing')
          code=js[start:end]
          code += """
          console.log(JSON.stringify({
            additionalApi:a0_0x2580(0x12e0),
            newAdditionalApi:a0_0x2580(0x5959),
            additionalPrefix:a0_0x2580(0x5329),
            additionalSuffix:a0_0x2580(0x1914),
            additionalType:a0_0x2580(0x535d),
            schemePortfolios:a0_0x2580(0x2110),
            k2064:a0_0x2580(0x2064),
            k5595:a0_0x2580(0x5595),
            monthlyHalfYearly:a0_0x2580(0x129d),
            monthlyHalfYearlyEndpt:a0_0x2580(0x2617),
            disclosureFiles:a0_0x2580(0x3bd3),
            fileField:a0_0x2580(0x4fff),
            titleField:a0_0x2580(0x9b0),
            titleValueField:a0_0x2580(0x2e60)
          }));
          """
          path='/tmp/bandhan-decoder.js'
          open(path,'w').write(code)
          cp=subprocess.run(['node',path],capture_output=True,text=True,timeout=20)
          print('NODE_RC',cp.returncode)
          print('NODE_OUT',cp.stdout)
          print('NODE_ERR',cp.stderr[:5000])
          # Also expose the API-base and endpoint-config assignment context.
          for needle in ('_0x10be4a=', '_0x36da67=', 'const _0x10be4a', 'const _0x36da67'):
              p=js.find(needle)
              print('LOC',needle,p)
              if p>=0:print('CTX',repr(js[max(0,p-3000):p+9000]))
          PY
