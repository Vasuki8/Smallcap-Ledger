name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect Bandhan inline download configuration
        run: |
          uv run --frozen python - <<'PY'
          import re,urllib.request
          from bs4 import BeautifulSoup
          posts=[
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026/',
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026/',
          ]
          for post in posts:
              req=urllib.request.Request(post,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:text=r.read().decode('utf-8','replace')
              soup=BeautifulSoup(text,'html.parser')
              article=soup.find('article')
              print('POST',post,'ID',article.get('id') if article else None)
              if article:
                  print('ARTICLE_TEXT',' | '.join(article.stripped_strings)[:20000])
                  print('ARTICLE_HTML',str(article)[:30000])
              for needle in ('custom-excel-download-js','customExcel','excelDownload','ajaxurl','admin-ajax.php','nonce','download_excel','downloadExcel','post_id','postId'):
                  start=0;count=0
                  while count<12:
                      i=text.lower().find(needle.lower(),start)
                      if i<0:break
                      print('CTX',needle,text[max(0,i-4500):i+9000])
                      start=i+len(needle);count+=1
          PY
