name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace current Bandhan site portfolio API
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.parse,json
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/javascript,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read();print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),r.geturl())
                  return b.decode('utf-8','replace')
          home=get('https://bandhanmutual.com/')
          scripts=[urllib.parse.urljoin('https://bandhanmutual.com/',x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',home,re.I)]
          print('SCRIPTS',json.dumps(scripts))
          for url in scripts:
              if not re.search(r'\.js(?:\?|$)',url,re.I):continue
              try:js=get(url)
              except Exception as e:print('ERROR',url,repr(e));continue
              if not re.search(r'portfolio|scheme.?portfolio|download|disclosure|cmsnew',js,re.I):continue
              print('SCRIPT_HIT',url)
              for needle in ('portfolio','schemePortfolio','scheme-portfolio','download','disclosure','cmsnew','api/','baseURL','baseUrl'):
                  start=0;count=0
                  while count<30:
                      i=js.lower().find(needle.lower(),start)
                      if i<0:break
                      print('CTX',needle,js[max(0,i-2200):i+5000])
                      start=i+len(needle);count+=1
              tokens=[]
              for m in re.finditer(r'https?://[^"\'\s)]+|["\'][^"\']{0,220}(?:portfolio|download|disclosure)[^"\']{0,500}["\']',js,re.I):
                  v=m.group(0)
                  if v not in tokens:tokens.append(v)
              for v in tokens[:300]:print('TOKEN',v[:2500])
          PY
