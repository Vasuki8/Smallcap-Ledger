name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Probe exact Bandhan finance API routes
        run: |
          python - <<'PY'
          import urllib.request,json
          base='https://cmsnew.bandhanmutual.com/wp-json/finance-api/v1/posts/disclosures'
          urls=[
            base+'/158853',
            base+'?post=158853',
            base+'?post_id=158853',
            base+'?id=158853',
          ]
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for u in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20) as r:
                      body=r.read()
                  print('FETCH',u,r.status,r.headers.get('Content-Type'),len(body),r.geturl())
                  txt=body.decode('utf-8','replace')
                  print('BODY',u,txt[:12000])
              except Exception as e:
                  print('ERROR',u,repr(e))
                  if getattr(e,'read',None):
                      try:print('ERROR_BODY',e.read().decode('utf-8','replace')[:3000])
                      except:pass
          PY
