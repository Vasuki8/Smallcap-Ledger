name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect Bandhan August tail and footnotes
        run: |
          uv run --frozen python - <<'PY'
          import urllib.request,urllib.parse,json,io,re
          import openpyxl
          api='https://cmsnew.bandhanmutual.com/wp-json/finance-api/v1/posts/disclosures?id=158853'
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(api,headers=H),timeout=30) as r:meta=json.loads(r.read())
          target=meta['data'][0]['acf_fields']['disclosure_files'][0]['document_link']['url']
          with urllib.request.urlopen(urllib.request.Request(target,headers={'User-Agent':'Mozilla/5.0','Referer':'https://bandhanmutual.com/'}),timeout=35) as r:body=r.read()
          wb=openpyxl.load_workbook(io.BytesIO(body),read_only=True,data_only=True)
          ws=next(x for x in wb.worksheets if x.title=='IDF271')
          rows=[[c.value for c in rr] for rr in ws.iter_rows()]
          for ri in range(250,min(len(rows),330)):
              flat=' | '.join(str(x) for x in rows[ri] if x not in (None,''))
              if flat:print('ROW',ri+1,flat[:3000])
          wb.close()
          PY
