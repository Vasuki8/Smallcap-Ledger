name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Decode Bandhan disclosure constants
        run: |
          python - <<'PY'
          import urllib.request,subprocess
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')
          marker=',((()=>{'
          end=js.find(marker)
          print('END_CONTEXT',repr(js[end-180:end+80]))
          # The bundle starts with the decoder + rotation IIFE as the left side
          # of a comma expression. Close the surrounding paren before evaluating.
          prefix=js[:end]
          for suffix in (';',');','));'):
              code=prefix+suffix+"""
              console.log(JSON.stringify({
                additionalApi:a0_0x2580(0x12e0),
                newAdditionalApi:a0_0x2580(0x5959),
                additionalPrefix:a0_0x2580(0x5329),
                additionalSuffix:a0_0x2580(0x1914),
                additionalType:a0_0x2580(0x535d),
                schemePortfolios:a0_0x2580(0x2110),
                apiBase:a0_0x2580(0x1bd4),
                k2064:a0_0x2580(0x2064),
                k5595:a0_0x2580(0x5595),
                monthlyHalfYearly:a0_0x2580(0x129d),
                monthlyHalfYearlyEndpt:a0_0x2580(0x2617),
                cmsCallPrefix:a0_0x2580(0xa6f)
              }));
              """
              open('/tmp/decoder.js','w').write(code)
              cp=subprocess.run(['node','/tmp/decoder.js'],capture_output=True,text=True,timeout=20)
              print('TRY',repr(suffix),'RC',cp.returncode,'OUT',cp.stdout.strip(),'ERR',cp.stderr[:500])
              if cp.returncode==0:break
          PY
