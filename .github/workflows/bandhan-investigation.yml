name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Locate Bandhan bundle string decoder
        run: |
          python - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://bandhanmutual.com/static/js/main.ce5a3574.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')
          for needle in ('function a0_0x2580','a0_0x2580=function','_0x480966=a0_0x2580','const _0x480966','let _0x480966','var _0x480966'):
              pos=js.find(needle)
              print('LOC',needle,pos)
              if pos>=0:print('CTX',repr(js[max(0,pos-5000):pos+12000]))
          # Locate the function name used by calls at the disclosure component.
          pos=js.find("'getAdditionalDisc':")
          print('GETAD_POS',pos)
          print('GETAD_CTX',repr(js[max(0,pos-20000):pos+3000]))
          PY
