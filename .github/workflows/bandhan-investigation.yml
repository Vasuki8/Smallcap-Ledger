name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Bounded scan for Bandhan disclosure API path
        run: |
          python - <<'PY'
          import urllib.request
          url='https://bandhanmutual.com/static/js/main.ce5a3574.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as r:js=r.read().decode('utf-8','replace')
          for needle in ('finance-api','wp-json','getAdditionalDisc','ADDITIONAL_DISCLOSOURES','SCHEME_PORTFOLIOS'):
              positions=[];start=0
              while len(positions)<100:
                  i=js.find(needle,start)
                  if i<0:break
                  positions.append(i);start=i+len(needle)
              print('POSITIONS',needle,positions)
              for i in positions[:25]:
                  print('SLICE',needle,i,repr(js[max(0,i-900):i+1800]))
          PY
