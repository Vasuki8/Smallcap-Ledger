name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace Bandhan public archive and sitemap links
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.parse,json
          from html import unescape
          base='https://cmsnew.bandhanmutual.com'
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xml,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),r.geturl())
                  return b.decode('utf-8','replace')
          urls=[
              base+'/page/152/',
              base+'/category/scheme-portfolios/',
              base+'/category/scheme-portfolios/page/12/',
              base+'/category/scheme-portfolios/page/13/',
              base+'/wp-sitemap.xml',
              base+'/sitemap_index.xml',
          ]
          found=set()
          for url in urls:
              try:text=get(url)
              except Exception as e:
                  print('ERROR',url,repr(e));continue
              for m in re.finditer(r'href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  href=urllib.parse.urljoin(url,unescape(m.group(1)))
                  label=re.sub(r'<[^>]+>',' ',m.group(2))
                  label=' '.join(unescape(label).split())
                  blob=href+' '+label
                  if re.search(r'small.?cap|portfolio|sitemap',blob,re.I):
                      print('LINK',href,'|',label[:800])
                      if re.search(r'bandhan.*small.*cap|small.*cap',blob,re.I):found.add(href)
              if 'sitemap' in url:
                  for loc in re.findall(r'<loc>(.*?)</loc>',text,re.I|re.S):
                      loc=unescape(loc.strip())
                      if re.search(r'post|page|portfolio|scheme',loc,re.I):
                          print('SITEMAP',loc)
          print('FOUND',json.dumps(sorted(found),ensure_ascii=False))
          PY
