name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Query exact Bandhan public WordPress posts
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,re
          base='https://cmsnew.bandhanmutual.com'
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          queries=[
            '/wp-json/wp/v2/search?'+urllib.parse.urlencode({'search':'Bandhan Small Cap Fund 31 August 2026','per_page':100}),
            '/wp-json/wp/v2/posts?'+urllib.parse.urlencode({'search':'Bandhan Small Cap Fund 31 August 2026','per_page':100,'_embed':'1'}),
            '/wp-json/wp/v2/search?'+urllib.parse.urlencode({'search':'Bandhan Small Cap Fund 31 July 2026','per_page':100}),
            '/wp-json/wp/v2/posts?'+urllib.parse.urlencode({'search':'Bandhan Small Cap Fund 31 July 2026','per_page':100,'_embed':'1'}),
            '/wp-json/wp/v2/categories?'+urllib.parse.urlencode({'slug':'scheme-portfolios','per_page':100}),
          ]
          for path in queries:
              url=base+path
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read(); print('FETCH',url,r.status,r.headers.get('Content-Type'),len(body))
                  data=json.loads(body)
                  print('DATA',path,json.dumps(data,ensure_ascii=False)[:60000])
              except Exception as e:
                  print('ERROR',url,repr(e))
          PY
