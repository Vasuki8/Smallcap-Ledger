name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Filter Bandhan public disclosure records
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,re
          base='https://cmsnew.bandhanmutual.com/wp-json/finance-api/v1/posts/disclosures'
          queries=[
            {'posts_per_page':'2500','acf_key':'download_center_type','acf_value':'portfolio','bypass_pagination':'true'},
            {'posts_per_page':'2500','acf_key':'download_center_type','acf_value':'Portfolio','bypass_pagination':'true'},
            {'posts_per_page':'2500','financial_year':'2026','bypass_pagination':'true'},
            {'posts_per_page':'2500','year':'2026','bypass_pagination':'true'},
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          for params in queries:
              url=base+'?'+urllib.parse.urlencode(params)
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=35) as r:
                      data=json.loads(r.read())
                  rows=data.get('data') if isinstance(data,dict) else data
                  rows=rows if isinstance(rows,list) else []
                  print('QUERY',params,'STATUS',data.get('status') if isinstance(data,dict) else None,'COUNT',len(rows))
                  for item in rows:
                      if not isinstance(item,dict): continue
                      acf=item.get('acf_fields') or {}
                      mapping=acf.get('funds_mapping')
                      fund=(mapping.get('post_title') or mapping.get('title') or mapping.get('post_name')) if isinstance(mapping,dict) else mapping
                      files=[]
                      for entry in acf.get('disclosure_files') or []:
                          link=(entry or {}).get('document_link') or {}
                          files.append({
                            'name':(entry or {}).get('document_name'),
                            'filename':link.get('filename'),'url':link.get('url'),
                            'mime':link.get('mime_type'),'date':link.get('date')
                          })
                      blob=json.dumps({
                        'id':item.get('id'),'title':item.get('title'),'date':item.get('date'),
                        'download_center_type':acf.get('download_center_type'),
                        'financial_year':acf.get('financial_year'),
                        'disclosures_type':acf.get('disclosures_type'),
                        'fund':fund,'files':files},ensure_ascii=False)
                      if (re.search(r'Bandhan\s+Small\s+Cap',blob,re.I)
                          or (re.search(r'portfolio',blob,re.I) and re.search(r'2026|Aug|July|Jul|June|Jun',blob,re.I))):
                          print('MATCH',blob)
              except Exception as e:
                  print('ERROR',params,repr(e))
          PY
