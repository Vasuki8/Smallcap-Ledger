name: Bandhan portfolio investigation

on:
  push:
    branches: [backend/bandhan-portfolio-recovery-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Bandhan Small Cap article body and metadata
        run: |
          python - <<'PY'
          import re,urllib.request,json
          from bs4 import BeautifulSoup
          posts=[
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026/',
            'https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026/',
          ]
          for post in posts:
              req=urllib.request.Request(post,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:text=r.read().decode('utf-8','replace')
              soup=BeautifulSoup(text,'html.parser')
              article=soup.find('article')
              entry=soup.select_one('.entry-content')
              print('POST',post)
              print('ARTICLE',str(article)[:50000] if article else 'NONE')
              print('ENTRY',str(entry)[:50000] if entry else 'NONE')
              for meta in soup.find_all('meta'):
                  key=' '.join(str(meta.get(x) or '') for x in ('name','property','itemprop'))
                  val=str(meta.get('content') or '')
                  if re.search(r'id|post|article|url|media|attachment|portfolio|small',key+' '+val,re.I):
                      print('META',json.dumps({'key':key,'content':val},ensure_ascii=False))
              for tag in soup.find_all(True):
                  attrs={k:v for k,v in tag.attrs.items()
                         if re.search(r'id|file|url|download|media|attachment|post',k,re.I)}
                  if attrs:
                      blob=json.dumps(attrs,ensure_ascii=False)
                      if re.search(r'portfolio|small|cap|download|file|attachment|post',blob,re.I):
                          print('ATTR',tag.name,blob[:6000])
          PY
