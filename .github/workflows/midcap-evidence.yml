name: Mid Cap evidence regression

on:
  push:
    branches: ['fix/midcap-evidence-*', 'fix/midcap-samco-*', 'fix/midcap-benchmark-*', 'fix/midcap-kotak-*', 'fix/midcap-iti-*']
  pull_request:
    paths:
      - 'tracker/midcap*'
      - 'tests/test_midcap*'
      - 'scripts/check_midcap_batch5_evidence.py'
      - 'scripts/check_midcap_samco_portfolio.py'
      - 'scripts/check_midcap_motilal_portfolio.py'
      - 'scripts/check_midcap_bandhan_portfolio.py'
      - 'scripts/check_midcap_kotak_portfolio.py'
      - 'scripts/check_midcap_iti_portfolio.py'
      - 'scripts/check_midcap_samco_ter.py'
      - 'scripts/check_midcap_benchmark_labels.py'
      - '.github/workflows/midcap-evidence.yml'

permissions:
  contents: read

concurrency:
  group: midcap-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Syntax checks
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: All regression tests
        run: |
          if uv run --frozen python -m unittest discover -s tests > /tmp/midcap-tests.log 2>&1; then
            tail -n 5 /tmp/midcap-tests.log
          else
            tail -n 100 /tmp/midcap-tests.log
            exit 1
          fi
      - name: Read-only public evidence preflight
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'fix/midcap-samco-') && !startsWith(github.ref_name, 'fix/midcap-benchmark-') && !startsWith(github.ref_name, 'fix/midcap-evidence-samco-portfolio-') && !startsWith(github.ref_name, 'fix/midcap-evidence-motilal-portfolio-') && !startsWith(github.ref_name, 'fix/midcap-evidence-bandhan-portfolio-') && !startsWith(github.ref_name, 'fix/midcap-kotak-') && !startsWith(github.ref_name, 'fix/midcap-iti-')
        run: uv run --frozen python scripts/check_midcap_batch5_evidence.py
      - name: Read-only exact Samco portfolio preflight
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fix/midcap-evidence-samco-portfolio-')
        run: uv run --frozen python scripts/check_midcap_samco_portfolio.py
      - name: Read-only exact Motilal portfolio preflight
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fix/midcap-evidence-motilal-portfolio-')
        run: uv run --frozen python scripts/check_midcap_motilal_portfolio.py
      - name: Read-only exact Bandhan portfolio preflight
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fix/midcap-evidence-bandhan-portfolio-')
        run: uv run --frozen python scripts/check_midcap_bandhan_portfolio.py
      - name: Read-only exact Kotak portfolio preflight
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fix/midcap-kotak-')
        run: uv run --frozen python scripts/check_midcap_kotak_portfolio.py
      - name: Read-only exact ITI portfolio preflight
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fix/midcap-iti-')
        run: uv run --frozen python scripts/check_midcap_iti_portfolio.py
      - name: Read-only exact Samco TER preflight
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fix/midcap-samco-')
        run: uv run --frozen python scripts/check_midcap_samco_ter.py
      - name: Read-only primary benchmark label preflight
        if: github.event_name == 'push' && startsWith(github.ref_name, 'fix/midcap-benchmark-')
        run: uv run --frozen python scripts/check_midcap_benchmark_labels.py
