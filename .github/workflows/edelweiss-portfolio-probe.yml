name: Edelweiss archived statutory route probe

on:
  push:
    branches: [backend/edelweiss-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Restore cumulative history
        run: uv run --frozen python scripts/github_state.py restore
      - name: Inspect archived portfolio-of-schemes HTML
        run: |
          uv run --frozen python - <<'PY'
          import re, html
          from tracker import db
          from scripts import github_state

          row=db.one("""SELECT f.hash,a.path,a.bytes,a.media_type,f.fetched_at
              FROM fetches f JOIN archives a ON a.hash=f.hash
              WHERE f.url='https://www.edelweissmf.com/statutory/portfolio-of-schemes'
                AND f.status='ok' AND f.hash IS NOT NULL
              ORDER BY f.fetched_at DESC LIMIT 1""")
          assert row
          github_state.materialize_hashes([row['hash']])
          raw=(db.DATA/row['path']).read_bytes()
          text=raw.decode('utf-8','replace')
          print('HASH',row['hash'],'BYTES',len(raw),'FETCHED',row['fetched_at'],row['media_type'])
          print('TERM_COUNTS', {k:len(re.findall(k,text,re.I)) for k in ['portfolio','monthly','xls','xlsx','api','ajax','scheme']})
          print('LINKS')
          for m in re.finditer(r'(?:href|src)=["\']([^"\']+)["\']',text,re.I):
              u=html.unescape(m.group(1))
              if re.search(r'portfolio|xls|api|ajax|scheme',u,re.I): print(u)
          print('SNIPPETS')
          for pat in ['portfolio of scheme','monthly portfolio','xlsx','xls','api/','ajax','portfolio']:
              low=text.lower(); p=0; shown=0
              while shown<15:
                  i=low.find(pat.lower(),p)
                  if i<0: break
                  print('SNIP',pat,re.sub(r'\s+',' ',text[max(0,i-1000):min(len(text),i+2400)]))
                  p=i+len(pat); shown+=1
          PY
