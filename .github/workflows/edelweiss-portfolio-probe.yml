name: Edelweiss portfolio source probe

on:
  push:
    branches: [backend/edelweiss-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Trace Edelweiss statutory portfolio source
        shell: bash
        run: |
          python - <<'PY'
          import html, re, urllib.parse, urllib.request

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          PAGES=[
            "https://www.edelweissmf.com/statutory",
            "https://www.edelweissmf.com/downloads/notice-cum-addendum",
          ]
          def get(url,limit=10_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=40) as r:
                  raw=r.read(limit+1)
                  if len(raw)>limit: raise RuntimeError("oversize")
                  print("FETCH",r.status,len(raw),r.geturl(),r.headers.get("content-type"))
                  return raw.decode("utf-8","replace")

          pages=[]
          for u in PAGES:
              try:
                  t=get(u); pages.append((u,t))
                  print("PAGE_TERMS",u,
                        "portfolio",len(re.findall("portfolio",t,re.I)),
                        "statutory",len(re.findall("statutory",t,re.I)),
                        "api",len(re.findall("api",t,re.I)))
                  for m in re.finditer(r'href=["\']([^"\']+)["\']',t,re.I):
                      href=html.unescape(m.group(1))
                      if re.search(r'portfolio|august|31.?08.?2026|monthly',href,re.I):
                          print("PAGE_LINK",urllib.parse.urljoin(u,href))
              except Exception as e:
                  print("PAGE_ERROR",u,repr(e))

          scripts=[]
          for base,t in pages:
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I):
                  u=urllib.parse.urljoin(base,html.unescape(src))
                  if u not in scripts: scripts.append(u)
          print("SCRIPTS",len(scripts))
          for s in scripts: print("SCRIPT",s)

          needles=("portfolio of scheme","monthly portfolio","portfolio","statutory","api/","ajax","download","financial")
          for s in scripts:
              host=urllib.parse.urlparse(s).hostname or ""
              if not host.endswith("edelweissmf.com"): continue
              try: t=get(s)
              except Exception as e:
                  print("SCRIPT_ERROR",s,repr(e)); continue
              low=t.lower()
              matched=[n for n in needles if n in low]
              if not matched: continue
              print("MATCHED_SCRIPT",s,matched)
              for n in matched:
                  pos=0; shown=0
                  while shown<12:
                      i=low.find(n,pos)
                      if i<0: break
                      print("SNIP",n,re.sub(r"\s+"," ",t[max(0,i-750):min(len(t),i+1800)]))
                      pos=i+len(n); shown+=1
          PY
