name: Edelweiss retained source audit

on:
  push:
    branches: [backend/edelweiss-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Restore cumulative history
        run: uv run --frozen python scripts/github_state.py restore
      - name: Audit retained Edelweiss portfolio source evidence
        run: |
          uv run --frozen python - <<'PY'
          from tracker import db

          print('DOCUMENTS')
          for r in db.rows("""SELECT d.title,d.kind,d.url,d.last_seen,dv.hash,a.bytes,a.media_type
              FROM documents d
              LEFT JOIN document_versions dv ON dv.document_id=d.id
              LEFT JOIN archives a ON a.hash=dv.hash
              WHERE d.family='Edelweiss Small Cap Fund'
                AND (lower(d.title) LIKE '%portfolio%' OR lower(d.url) LIKE '%portfolio%'
                     OR lower(d.url) LIKE '%.xls%' OR lower(d.url) LIKE '%.csv%')
              ORDER BY d.last_seen DESC,d.url,dv.observed_at DESC"""):
              print(r)

          print('SOURCE_PAGES')
          for r in db.rows("""SELECT amc_match,url,label,kind,last_checked,status,detail
              FROM source_pages WHERE lower(amc_match) LIKE '%edelweiss%'
              ORDER BY last_checked DESC,url"""):
              print(r)

          print('FETCHES')
          for r in db.rows("""SELECT url,fetched_at,status,hash,detail
              FROM fetches
              WHERE lower(url) LIKE '%edelweissmf.com%'
                AND (lower(url) LIKE '%portfolio%' OR lower(url) LIKE '%.xls%')
              ORDER BY fetched_at DESC LIMIT 100"""):
              print(r)
          PY
