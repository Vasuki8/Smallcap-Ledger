name: Edelweiss embedded portfolio-link probe

on:
  push:
    branches: [backend/edelweiss-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Restore cumulative history
        run: uv run --frozen python scripts/github_state.py restore
      - name: Extract embedded Edelweiss portfolio hyperlinks
        run: |
          uv run --frozen python - <<'PY'
          import io
          from pypdf import PdfReader
          from tracker import db
          from scripts import github_state

          row=db.one("""SELECT d.url,dv.hash,a.path
              FROM documents d JOIN document_versions dv ON dv.document_id=d.id
              JOIN archives a ON a.hash=dv.hash
              WHERE d.family='Edelweiss Small Cap Fund'
                AND d.url LIKE '%Edelweiss_Factsheet_September_2026%'
              ORDER BY dv.observed_at DESC LIMIT 1""")
          assert row
          github_state.materialize_hashes([row['hash']])
          raw=(db.DATA/row['path']).read_bytes()
          reader=PdfReader(io.BytesIO(raw))
          page=reader.pages[14]
          print('SOURCE',row['url'])
          print('HASH',row['hash'])
          annots_obj=page.get('/Annots')
          annots=annots_obj.get_object() if hasattr(annots_obj,'get_object') else (annots_obj or [])
          print('ANNOT_COUNT',len(annots))
          urls=[]
          for idx,ref in enumerate(annots):
              obj=ref.get_object()
              action=obj.get('/A')
              uri=action.get('/URI') if action else None
              dest=obj.get('/Dest')
              rect=obj.get('/Rect')
              if uri:
                  uri=str(uri)
                  urls.append(uri)
                  print('ANNOT_URI',idx,rect,uri)
              elif dest:
                  print('ANNOT_DEST',idx,rect,dest)
          print('UNIQUE_URLS')
          for u in dict.fromkeys(urls):
              print(u)
          PY
