name: Edelweiss portfolio parser probe

on:
  push:
    branches: [backend/edelweiss-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Inspect real Edelweiss September factsheet extraction
        shell: bash
        run: |
          uv run --frozen python - <<'PY'
          import io, urllib.request
          from pypdf import PdfReader
          from tracker.report_parser import edelweiss_top30_portfolio, edelweiss_top10_portfolio

          URL="https://www.edelweissmf.com/Files/MF/Downloads/FACTSHEETS/FACTSHEETS/Edelweiss_Factsheet_September_2026_15092026193426.pdf"
          req=urllib.request.Request(URL,headers={"User-Agent":"Mozilla/5.0","Accept":"application/pdf,*/*"})
          with urllib.request.urlopen(req,timeout=45) as r:
              raw=r.read(25_000_000)
              print("FETCH",r.status,len(raw),r.geturl(),r.headers.get("content-type"))
          reader=PdfReader(io.BytesIO(raw))
          print("PAGES",len(reader.pages))
          for i,p in enumerate(reader.pages):
              text=p.extract_text() or ""
              if "Edelweiss Small Cap Fund" not in text:
                  continue
              layout=p.extract_text(extraction_mode="layout") or ""
              print("SMALLCAP_PAGE",i,"STD_LEN",len(text),"LAYOUT_LEN",len(layout))
              print("STD_PARSE",edelweiss_top30_portfolio(text))
              print("LAYOUT_PARSE",edelweiss_top30_portfolio(layout))
              next_two="\n".join((reader.pages[i+1].extract_text() or "" if i+1<len(reader.pages) else "",
                                   reader.pages[i+2].extract_text() or "" if i+2<len(reader.pages) else ""))
              print("TOP10_PARSE",edelweiss_top10_portfolio(text,next_two))
              print("STD_TEXT_START")
              print(text[:12000])
              print("STD_TEXT_END")
              print("LAYOUT_TEXT_START")
              print(layout[:15000])
              print("LAYOUT_TEXT_END")
          PY
