name: Edelweiss bundle API probe

on:
  push:
    branches: [backend/edelweiss-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Edelweiss production bundle
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          base='https://www.edelweissmf.com/'
          url=base+'main.0411e4933dfdb2cb.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*','Referer':base+'statutory/portfolio-of-schemes'})
          with urllib.request.urlopen(req,timeout=45) as r:
              raw=r.read(20_000_000)
              print('FETCH',r.status,len(raw),r.geturl(),r.headers.get('content-type'))
          text=raw.decode('utf-8','replace')
          for pat in ['portfolio-of-schemes','portfolioOf','PortfolioOf','portfolio of schemes','financials-portfolios','Portfolio','getPortfolio','portfolio']:
              print('PATTERN',pat)
              low=text.lower(); p=0; shown=0
              while shown<30:
                  i=low.find(pat.lower(),p)
                  if i<0: break
                  print(re.sub(r'\s+',' ',text[max(0,i-1000):min(len(text),i+2200)]))
                  p=i+len(pat); shown+=1
          print('API_LITERALS')
          for x in sorted(set(re.findall(r'["\']([^"\']*(?:portfolio|financial)[^"\']*)["\']',text,re.I))):
              if len(x)<500: print(x)
          PY
