name: Recovery queue recorder fix validation

on:
  push:
    branches: [fix/recovery-queue-record-build-import-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Compile and test
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Verify recorder script-context tracker import
        run: |
          cd scripts
          ../.venv/bin/python - <<'PY'
          import sys
          from pathlib import Path
          ROOT=Path("record_build.py").resolve().parents[1]
          sys.path.insert(0,str(ROOT))
          from tracker.portfolio_recovery_queue import report, markdown
          print("IMPORT_OK",report.__module__,markdown.__module__)
          PY
