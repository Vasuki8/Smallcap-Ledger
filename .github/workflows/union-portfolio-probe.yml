name: Portfolio source probe

on:
  push:
    branches: [backend/union-bajaj-portfolio-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Probe Union and Bajaj public portfolio routes
        shell: bash
        run: |
          python - <<'PY'
          import html, re, urllib.parse, urllib.request

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          def get(url,limit=8_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=35) as r:
                  raw=r.read(limit+1)
                  if len(raw)>limit: raise RuntimeError("oversize")
                  print("FETCH",r.status,len(raw),r.geturl(),r.headers.get("content-type"))
                  return raw.decode("utf-8","replace")

          for url in (
              "https://www.unionmf.com/about-us/downloads",
              "https://www.unionmf.com/about-us/downloads/monthly-portfolio",
          ):
              try: get(url)
              except Exception as e: print("UNION_ERROR",url,repr(e))

          page_url="https://www.bajajamc.com/downloads"
          page=get(page_url)
          print("BAJAJ_PAGE",len(page))
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I):
              u=urllib.parse.urljoin(page_url,html.unescape(src))
              if u not in scripts: scripts.append(u)
          print("BAJAJ_SCRIPTS",len(scripts))
          for s in scripts: print("SCRIPT",s)

          needles=("monthly portfolio","monthlyportfolio","portfolio","downloads","api/","ajax","graphql","json")
          for s in scripts:
              host=urllib.parse.urlparse(s).hostname or ""
              if not (host.endswith("bajajamc.com") or host.endswith("bajajfinserv.in")):
                  continue
              try: text=get(s)
              except Exception as e:
                  print("SCRIPT_ERROR",s,repr(e)); continue
              low=text.lower()
              matched=[n for n in needles if n in low]
              if not matched: continue
              print("MATCHED_SCRIPT",s,matched)
              for n in matched:
                  pos=0; shown=0
                  while shown<12:
                      i=low.find(n,pos)
                      if i<0: break
                      print("SNIP",n,re.sub(r"\s+"," ",text[max(0,i-650):min(len(text),i+1400)]))
                      pos=i+len(n); shown+=1
          PY
