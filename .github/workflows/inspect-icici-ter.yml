name: Inspect ICICI TER route chunk

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Locate ICICI financials page lazy chunk
        run: |
          python - <<'PY'
          import re, urllib.request
          u='https://www.icicipruamc.com/static/js/index.1t6HhxO5.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:s=r.read().decode('utf-8','ignore')
          needle='/about-us/financials-&-disclosures'
          for p in [m.start() for m in re.finditer(re.escape(needle),s)]:
              block=s[max(0,p-8000):p+8000]
              print('POS',p)
              print('JSFILES',sorted(set(re.findall(r'["\']([^"\']+\.js)["\']',block))))
              print('IMPORTS',sorted(set(re.findall(r'import\(["\']([^"\']+)["\']\)',block))))
              print('PRELOADS',sorted(set(re.findall(r'__vitePreload\(\(\)=>import\(["\']([^"\']+)["\']\)',block))))
              print('CTX',re.sub(r'\s+',' ',block))
          PY
