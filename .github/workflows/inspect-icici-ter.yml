name: Validate ICICI TER collector

on:
  push:
    branches: [backend/icici-ter-v132]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python -m compileall -q tracker scripts tests
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Verify live ICICI TER source chain
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          from datetime import date
          from tracker import amc_expenses
          from tracker.providers import fetch

          today=date.today()
          cats=amc_expenses._icici_api(amc_expenses.ICICI_CATEGORIES_API+'?userType=Investor')
          parent,child,fy=amc_expenses._icici_category_ids(cats,today)
          data=amc_expenses._icici_api(
              amc_expenses.ICICI_FILES_API,
              body={
                  'categoryId':child,'userType':'Investor','fileType':'All',
                  'page':'1','size':'20',
                  'filter':[
                      {'SHOW':[amc_expenses.ICICI_TER_SHOW]},
                      {'FINANCIAL_YEAR':[fy]},
                  ],
                  'search':'',
              },
          )
          source=amc_expenses._icici_select_file(data.get('files'),parent,child,fy,today)
          body,_,_=fetch(source,archive=False,max_bytes=5*1024*1024)
          day,plans=amc_expenses.parse_icici_workbook(body,today)
          assert set(plans)=={'Regular','Direct'}
          assert 0 <= plans['Direct']['base_expense_ratio'] <= plans['Direct']['ter'] <= 5
          assert 0 <= plans['Regular']['base_expense_ratio'] <= plans['Regular']['ter'] <= 5
          print('ICICI_SOURCE',source)
          print('ICICI_VERIFIED',day,plans)
          print('ICICI_WORKBOOK_BYTES',len(body))
          print('ICICI_WORKBOOK_SHA256',hashlib.sha256(body).hexdigest())
          PY
