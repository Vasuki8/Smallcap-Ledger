name: Inspect ICICI API config

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Extract getApiEndpoint and generateConfig
        run: |
          python - <<'PY'
          import re,urllib.request
          u='https://www.icicipruamc.com/static/js/index.1t6HhxO5.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:s=r.read().decode('utf-8','ignore')
          for needle in ['getApiEndpoint=', 'function getApiEndpoint', 'generateConfig=', 'function generateConfig',
                         'REACT_APP_ENV:', 'REACT_APP_DISABLE_ENCRYPTION:', 'publicEndPoints', 'isPublicEndPoint']:
              print('\nNEEDLE',needle)
              positions=[m.start() for m in re.finditer(re.escape(needle),s)]
              print('COUNT',len(positions))
              for p in positions[:20]:
                  print('POS',p,'CTX',re.sub(r'\s+',' ',s[max(0,p-5000):p+8500])[:13800])
          PY
