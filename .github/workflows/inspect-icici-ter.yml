name: Inspect ICICI TER XLSX internals

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect XLSX package internals
        run: |
          python - <<'PY'
          import io,re,urllib.parse,urllib.request,zipfile
          path='/financials-disclosures-files/Files/Total Expense Ratio/2026-2027/TotalExpenseRatioSep2026.xlsx'
          url='https://app.beta.icicipruamc.com/blob'+urllib.parse.quote(path,safe='/')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Referer':'https://www.icicipruamc.com/'})
          with urllib.request.urlopen(req,timeout=60) as r: body=r.read()
          z=zipfile.ZipFile(io.BytesIO(body))
          print('ENTRIES',len(z.namelist()))
          for name in z.namelist():
              info=z.getinfo(name)
              print('ENTRY',name,info.file_size)
          for name in z.namelist():
              if not (name.endswith('.xml') or name.endswith('.rels') or name.endswith('.bin') or name.endswith('.csv')):
                  continue
              raw=z.read(name)
              low=raw.lower()
              if b'small cap' in low or b'prudential small' in low or b'total ter' in low or b'expense ratio' in low or name in ('xl/workbook.xml','xl/worksheets/sheet1.xml','xl/sharedStrings.xml'):
                  print('\nCONTENT',name,'LEN',len(raw))
                  try:
                      text=raw.decode('utf-8','ignore')
                      for needle in ['Small Cap','small cap','Total TER','Expense Ratio','ICICI Prudential']:
                          p=text.lower().find(needle.lower())
                          if p>=0:
                              print('CTX',needle,text[max(0,p-2500):p+6000])
                      if len(text)<15000: print(text)
                  except Exception as e: print('DECODE_ERROR',e)
          z.close()
          PY
