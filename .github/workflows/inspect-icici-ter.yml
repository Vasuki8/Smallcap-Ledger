name: Inspect ICICI financial constants

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Resolve FILE_TYPE and category constants
        run: |
          python - <<'PY'
          import re,urllib.request
          files=[
            'https://www.icicipruamc.com/static/js/index.1t6HhxO5.js',
            'https://www.icicipruamc.com/static/js/downloadsFormsTypes.9ulBNFmg.js',
            'https://www.icicipruamc.com/static/js/index.BicS6zQ2.js',
          ]
          for url in files:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=60) as r:s=r.read().decode('utf-8','ignore')
              print('\nFILE',url,'LEN',len(s))
              for needle in ['FILE_TYPE', 'PAGE_NUMBER', 'PAGE_SIZE', 'TOTAL_EXPENSE_RATIO', 'FINANCIAL_YEAR', 'FUND_SCHEME']:
                  pos=[m.start() for m in re.finditer(re.escape(needle),s)]
                  print('NEEDLE',needle,'COUNT',len(pos))
                  for p in pos[:20]:
                      print('CTX',re.sub(r'\s+',' ',s[max(0,p-1200):p+2200])[:3500])
          PY
