name: Inspect ICICI September TER workbook

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect exact current ICICI TER workbook
        run: |
          uv run --frozen python - <<'PY'
          import hashlib,io,json,re,urllib.request
          import openpyxl

          path='/financials-disclosures-files/Files/Total Expense Ratio/2026-2027/TotalExpenseRatioSep2026.xlsx'
          urls=[
            'https://app.beta.icicipruamc.com/blob'+path,
            'https://www.icicipruamc.com/blob'+path,
          ]
          body=None
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Referer':'https://www.icicipruamc.com/'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      b=r.read();print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl(),'MAGIC',b[:8])
                  if b.startswith(b'PK'):
                      body=b;print('SELECTED_URL',url);break
              except Exception as e: print('FETCH_ERROR',url,type(e).__name__,e)
          if body is None: raise SystemExit('No XLSX source returned')
          print('SHA256',hashlib.sha256(body).hexdigest())
          wb=openpyxl.load_workbook(io.BytesIO(body),data_only=True,read_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
              print('SHEET',ws.title,ws.max_row,ws.max_column)
              for i,row in enumerate(ws.iter_rows(values_only=True),1):
                  vals=[None if v is None else str(v) for v in row]
                  joined=' | '.join(x or '' for x in vals)
                  if i<=18 or re.search(r'ICICI\s+Prudential\s+Small\s+Cap|Small\s+Cap\s+Fund',joined,re.I):
                      print('ROW',i,json.dumps(vals,ensure_ascii=False))
          wb.close()
          PY
