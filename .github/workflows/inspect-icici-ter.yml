name: Inspect ICICI category config

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Resolve getConstants categoryConst
        run: |
          python - <<'PY'
          import re,urllib.request
          urls=[
            'https://www.icicipruamc.com/static/js/index.1t6HhxO5.js',
            'https://www.icicipruamc.com/static/js/index.BicS6zQ2.js',
          ]
          for u in urls:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=60) as r:s=r.read().decode('utf-8','ignore')
              print('\nFILE',u)
              for needle in ['function getConstants', 'getConstants=', '"categoryConst"', "'categoryConst'", 'categoryConst:', 'FILE_TYPE:"', 'PAGE_SIZE:', 'PAGE_NUMBER:']:
                  ps=[m.start() for m in re.finditer(re.escape(needle),s)]
                  print('NEEDLE',needle,'COUNT',len(ps))
                  for p in ps[:30]:
                      print('POS',p,'CTX',re.sub(r'\s+',' ',s[max(0,p-2500):p+4500])[:7200])
          PY
