name: Inspect ICICI TER disclosure API

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Probe ICICI financial disclosure POST schema
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          base='https://apimf.icicipruamc.com'
          headers={
            'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0',
            'Accept':'application/json, text/plain, */*',
            'Content-Type':'application/json',
            'Origin':'https://www.icicipruamc.com',
            'Referer':'https://www.icicipruamc.com/about-us/financials-&-disclosures?currentTabFilter=Total+Expense+Ratio',
          }
          payloads=[{}, {'category':'Total Expense Ratio'}, {'categoryName':'Total Expense Ratio'}, {'currentTabFilter':'Total Expense Ratio'}]
          for path in ['/fds/v1/categories','/fds/v1/files']:
              for payload in payloads:
                  print('\nURL',path,'PAYLOAD',payload)
                  req=urllib.request.Request(base+path,data=json.dumps(payload).encode(),method='POST',headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=45) as r:
                          body=r.read();print('FETCH',r.status,len(body),r.headers.get('content-type'));print('BODY',body[:12000].decode('utf-8','ignore'))
                  except urllib.error.HTTPError as e:
                      body=e.read();print('HTTP_ERROR',e.code,len(body),e.headers.get('content-type'));print('BODY',body[:8000].decode('utf-8','ignore'))
                  except Exception as e: print('ERROR',type(e).__name__,e)
          PY
