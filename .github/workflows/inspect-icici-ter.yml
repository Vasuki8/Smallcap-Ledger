name: Inspect ICICI TER disclosure API

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Probe public ICICI financial disclosure endpoints
        run: |
          python - <<'PY'
          import urllib.request
          base='https://apimf.icicipruamc.com'
          UA={
            'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0',
            'Accept':'application/json, text/plain, */*',
            'Origin':'https://www.icicipruamc.com',
            'Referer':'https://www.icicipruamc.com/about-us/financials-&-disclosures?currentTabFilter=Total+Expense+Ratio',
          }
          for path in ['/fds/v1/categories','/fds/v1/files']:
              url=base+path
              print('\nURL',url)
              req=urllib.request.Request(url,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=r.read()
                      print('FETCH',r.status,len(body),r.headers.get('content-type'),r.geturl())
                      print('BODY',body[:12000].decode('utf-8','ignore'))
              except Exception as e:
                  print('ERROR',type(e).__name__,e)
                  if hasattr(e,'read'):
                      print('ERRBODY',e.read()[:5000].decode('utf-8','ignore'))
          PY
