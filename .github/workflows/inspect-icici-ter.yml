name: Inspect ICICI TER public API

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Reproduce ICICI public financial disclosure calls
        run: |
          python - <<'PY'
          import json,uuid,urllib.error,urllib.request
          API='https://apimf.icicipruamc.com'
          headers={
            'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0',
            'Accept':'application/json, text/plain, */*',
            'Content-Type':'application/json',
            'Origin':'https://www.icicipruamc.com',
            'Referer':'https://www.icicipruamc.com/about-us/financials-&-disclosures?currentTabFilter=Total%20Expense%20Ratio',
            'env':'api',
            'baggage':'',
            'requestAPIId':str(uuid.uuid4()),
          }
          def request(path,body=None):
              h=dict(headers);h['requestAPIId']=str(uuid.uuid4())
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(API+path,data=data,method='GET' if data is None else 'POST',headers=h)
              print('\nREQUEST',req.method,req.full_url,'BODY',body)
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      b=r.read();print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl());print('BODY_TEXT',b[:30000].decode('utf-8','ignore'));return b
              except urllib.error.HTTPError as e:
                  b=e.read();print('HTTP_ERROR',e.code,len(b),e.headers.get('content-type'));print('ERRBODY',b[:12000].decode('utf-8','ignore'));return None
          raw=request('/fds/v1/categories?userType=investor')
          if raw:
              try:
                  data=json.loads(raw)
                  print('JSON_KEYS',data.keys() if isinstance(data,dict) else type(data).__name__)
                  print('JSON',json.dumps(data,ensure_ascii=False)[:50000])
                  cats=((data.get('success') or {}).get('data') or []) if isinstance(data,dict) else []
                  for cat in cats:
                      title=cat.get('title') or {}
                      text=title.get('text') if isinstance(title,dict) else title
                      print('CATEGORY',cat.get('id'),cat.get('categoryCode'),text,cat.get('subCategory'))
              except Exception as e: print('JSON_ERROR',type(e).__name__,e)
          PY
