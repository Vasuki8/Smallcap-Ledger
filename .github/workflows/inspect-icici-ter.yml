name: Inspect ICICI TER route and metrics

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect FinancialsDisclosure references and fund metrics API
        run: |
          python - <<'PY'
          import json,re,urllib.error,urllib.parse,urllib.request
          JS='https://www.icicipruamc.com/static/js/index.1t6HhxO5.js'
          API='https://apimf.icicipruamc.com'
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Accept':'application/json, text/plain, */*','Origin':'https://www.icicipruamc.com','Referer':'https://www.icicipruamc.com/'}
          req=urllib.request.Request(JS,headers=UA)
          with urllib.request.urlopen(req,timeout=60) as r:s=r.read().decode('utf-8','ignore')
          for needle in ['FinancialsDisclosure','financialsDisclosure']:
              print('\nREFS',needle)
              for p in [m.start() for m in re.finditer(re.escape(needle),s,re.I)]:
                  block=s[max(0,p-2200):p+3500]
                  print('POS',p)
                  print('FILES',sorted(set(re.findall(r'["\'](\./[^"\']+\.js)["\']',block))))
                  print('CTX',re.sub(r'\s+',' ',block))
          def fetch(path):
              url=API+path
              print('\nAPI',url)
              req=urllib.request.Request(url,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      b=r.read();print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl());print('BODY',b[:18000].decode('utf-8','ignore'))
              except urllib.error.HTTPError as e:
                  b=e.read();print('HTTP_ERROR',e.code,len(b),e.headers.get('content-type'));print('BODY',b[:8000].decode('utf-8','ignore'))
              except Exception as e: print('ERROR',type(e).__name__,e)
          fetch('/fs/v1/funds')
          fetch('/fs/v1/funds?search=small%20cap')
          fetch('/fs/v1/funds?schemeName=ICICI%20Prudential%20Small%20Cap%20Fund')
          PY
