name: Inspect ICICI TER disclosure app

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect ICICI financial disclosure API usage
        run: |
          python - <<'PY'
          import re, urllib.request
          u='https://www.icicipruamc.com/static/js/index.1t6HhxO5.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:s=r.read().decode('utf-8','ignore')
          for needle in ['financialsCategoryData','financialsData','/fds/v1/categories','/fds/v1/files']:
              print('\nNEEDLE',needle)
              pos=[m.start() for m in re.finditer(re.escape(needle),s)]
              print('COUNT',len(pos))
              for p in pos[:12]:
                  print('POS',p)
                  print(re.sub(r'\s+',' ',s[max(0,p-6500):p+9500])[:16500])
          PY
