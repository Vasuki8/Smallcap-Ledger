name: Inspect ICICI financials calls

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Extract exact financial page calls and API-base helper
        run: |
          python - <<'PY'
          import re,urllib.request
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:return r.read().decode('utf-8','ignore')
          page=get('https://www.icicipruamc.com/static/js/index.BicS6zQ2.js')
          print('PAGE_LEN',len(page))
          for needle in ['na(', 'da(', 'K=', 'const K', 'function K', 'PAGE_NUMBER','PAGE_SIZE','FILE_TYPE','TOTAL_EXPENSE_RATIO','currentTabFilter']:
              print('\nNEEDLE',needle)
              for p in [m.start() for m in re.finditer(re.escape(needle),page)][:30]:
                  print('POS',p,'CTX',re.sub(r'\s+',' ',page[max(0,p-1600):p+3200]))
          main=get('https://www.icicipruamc.com/static/js/index.1t6HhxO5.js')
          for needle in ['REACT_APP_API_ENDPOINT:"https://apimf.icicipruamc.com"', 'function getApi', 'API_ENDPOINT']:
              print('\nMAIN_NEEDLE',needle)
              for p in [m.start() for m in re.finditer(re.escape(needle),main)][:15]:
                  print('POS',p,'CTX',re.sub(r'\s+',' ',main[max(0,p-3000):p+5000]))
          # Find short functions returning API endpoint near env declaration.
          env=main.find('REACT_APP_API_ENDPOINT:"https://apimf.icicipruamc.com"')
          if env>=0:
              block=main[env:env+25000]
              print('ENV_BLOCK',re.sub(r'\s+',' ',block))
          PY
