name: Inspect ICICI TER disclosure API

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Extract ICICI financial-disclosure identifiers
        run: |
          python - <<'PY'
          import re, urllib.request
          u='https://www.icicipruamc.com/static/js/index.1t6HhxO5.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:s=r.read().decode('utf-8','ignore')
          ids=sorted(set(re.findall(r'\b[A-Za-z_$][A-Za-z0-9_$]*(?:Financial|financial)[A-Za-z0-9_$]*\b',s)))
          print('IDS',ids)
          for ident in ids:
              if any(k in ident.lower() for k in ['financials','financialdisclosure','financialdata','financialcategory']):
                  pos=[m.start() for m in re.finditer(re.escape(ident),s)]
                  print('\nIDENT',ident,'COUNT',len(pos))
                  for p in pos[:20]:
                      print('CTX',re.sub(r'\s+',' ',s[max(0,p-2500):p+4500])[:7200])
          for needle in ['financialsCategoryData', 'financialsData']:
              # Search for object property access patterns referencing the endpoint key.
              for pat in [rf'\.{needle}\b', rf'\[{needle}\]', rf'["\']{needle}["\']']:
                  ms=list(re.finditer(pat,s))
                  print('PATTERN',pat,'COUNT',len(ms))
                  for m in ms[:10]:
                      print(re.sub(r'\s+',' ',s[max(0,m.start()-3500):m.start()+6500])[:10200])
          PY
