name: Inspect ICICI financials service

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect exact financial disclosures chunks
        run: |
          python - <<'PY'
          import re, urllib.request
          base='https://www.icicipruamc.com/static/js/'
          files=['financialsDisclosuresService.DfjThF0F.js','index.BicS6zQ2.js']
          for name in files:
              url=base+name
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  s=r.read().decode('utf-8','ignore')
                  print('\nFILE',name,'STATUS',r.status,'LEN',len(s),r.headers.get('content-type'))
              print('FULL',s)
              for needle in ['/fds/v1/categories','/fds/v1/files','Total Expense Ratio','TOTAL_EXPENSE_RATIO',
                             'financialsCategoryData','financialsData','axios','fetch','category','fileType','page']:
                  pos=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
                  if pos:
                      print('NEEDLE',needle,'COUNT',len(pos))
                      for p in pos[:20]:
                          print('CTX',re.sub(r'\s+',' ',s[max(0,p-1200):p+2500])[:3800])
          PY
