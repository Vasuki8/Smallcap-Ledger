name: Inspect ICICI TER disclosure app

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect ICICI disclosure request wiring
        run: |
          python - <<'PY'
          import re, urllib.request
          u='https://www.icicipruamc.com/static/js/index.1t6HhxO5.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:s=r.read().decode('utf-8','ignore')
          for needle in [
              '/nms/v1/downloads/categories',
              '/nms/v1/downloads/files',
              'TOTAL_EXPENSE_RATIO',
              'currentTabFilter',
              'financialsDisclosures',
              'Total Expense Ratio',
          ]:
              print('\nNEEDLE',needle)
              pos=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              print('COUNT',len(pos))
              for p in pos[:20]:
                  block=re.sub(r'\s+',' ',s[max(0,p-5000):p+6500])
                  print('POS',p,'CTX',block[:11800])
          print('\nNMS_STRINGS')
          vals=sorted(set(v for _,v in re.findall(r'(["\'])(.{1,250}?)\1',s) if v.startswith('/nms/')))
          for v in vals: print(v)
          PY
