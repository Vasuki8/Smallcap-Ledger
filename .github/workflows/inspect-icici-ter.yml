name: Inspect ICICI TER XML rows

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Parse exact ICICI TER XML rows
        run: |
          python - <<'PY'
          import io,hashlib,re,urllib.parse,urllib.request,zipfile
          import xml.etree.ElementTree as ET
          path='/financials-disclosures-files/Files/Total Expense Ratio/2026-2027/TotalExpenseRatioSep2026.xlsx'
          url='https://app.beta.icicipruamc.com/blob'+urllib.parse.quote(path,safe='/')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Referer':'https://www.icicipruamc.com/'})
          with urllib.request.urlopen(req,timeout=60) as r: body=r.read()
          print('URL',url)
          print('BYTES',len(body),'SHA256',hashlib.sha256(body).hexdigest())
          z=zipfile.ZipFile(io.BytesIO(body))
          raw=z.read('xl/worksheets/sheet1.xml')
          root=ET.fromstring(raw)
          ns={'x':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          def value(cell):
              parts=[t.text or '' for t in cell.findall('.//x:t',ns)]
              if parts:return ''.join(parts)
              v=cell.find('x:v',ns)
              return '' if v is None else (v.text or '')
          def row_values(row):
              vals={}
              for cell in row.findall('x:c',ns):
                  ref=cell.attrib.get('r','')
                  col=re.match(r'[A-Z]+',ref)
                  if col: vals[col.group(0)]=value(cell)
              return vals
          rows=root.findall('.//x:sheetData/x:row',ns)
          for row in rows[:5]:
              print('HEADER_ROW',row.attrib.get('r'),row_values(row))
          matches=[]
          for row in rows:
              vals=row_values(row)
              if vals.get('A','').strip()=='ICICI Prudential Small Cap Fund':
                  matches.append((int(row.attrib.get('r')),vals))
          print('SMALLCAP_COUNT',len(matches))
          for r,vals in matches:
              print('SMALLCAP_ROW',r,vals)
          z.close()
          PY
