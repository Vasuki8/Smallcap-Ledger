name: Inspect ICICI TER disclosure app

on:
  push:
    branches: [backend/icici-ter-v132]
    paths: [.github/workflows/inspect-icici-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Extract ICICI TER app strings and endpoints
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.icicipruamc.com/static/js/index.1t6HhxO5.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              s=r.read().decode('utf-8','ignore')
              print('FETCH',r.status,len(s),r.headers.get('content-type'),r.geturl())
          strings=[]
          for m in re.finditer(r'(["\'])(.{1,300}?)\1',s):
              v=m.group(2)
              if re.search(r'Expense Ratio|expense.?ratio|financial|disclosure|TER|api/|endpoint|scheme',v,re.I):
                  strings.append(v)
          print('MATCHED_STRINGS',len(strings))
          for v in sorted(set(strings)):
              if len(v)<=280:
                  print('STR',repr(v))
          for needle in ['Total Expense Ratio','financials-&-disclosures','currentTabFilter','expenseRatio','ExpenseRatio','TER','axios.create','baseURL','fetch(']:
              print('NEEDLE',needle)
              p=0;n=0
              while True:
                  p=s.lower().find(needle.lower(),p)
                  if p<0 or n>=20:break
                  print('CTX',re.sub(r'\s+',' ',s[max(0,p-1500):p+3000])[:4700])
                  p+=len(needle);n+=1
          PY
