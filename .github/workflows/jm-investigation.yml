name: JM portfolio investigation

on:
  push:
    branches: [backend/jm-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Extract exact JM download API calls
        run: |
          python - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://www.jmfinancialmf.com/static/js/main.d8e32c01.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r: js=r.read().decode('utf-8','replace')
          for needle in ('GetDownloadNewSub','GetDownloadNew','GetDownloadDrop'):
              start=0;count=0
              while count<12:
                  i=js.find(needle,start)
                  if i<0:break
                  frag=js[max(0,i-1800):i+3500]
                  print('CALL',needle,frag)
                  start=i+len(needle);count+=1
          PY
