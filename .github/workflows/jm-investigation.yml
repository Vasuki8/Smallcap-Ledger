name: JM portfolio investigation

on:
  push:
    branches: [backend/jm-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace JM Portfolio Disclosure source
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.parse,json
          from html import unescape
          page='https://www.jmfinancialmf.com/downloads/Forms'
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,*/*'}
          def get(url,timeout=15):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  body=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(body),r.geturl())
                  return body.decode('utf-8','replace')
          html=get(page)
          print('HTML_SNIP',html[:12000])
          scripts=[urllib.parse.urljoin(page,unescape(x)) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          print('SCRIPTS',json.dumps(scripts))
          for line in html.splitlines():
              if re.search(r'Portfolio Disclosure|downloads|api|ajax|fetch|CMS',line,re.I):
                  print('HTML_HIT',line[:4000])
          checked=0
          for url in reversed(scripts):
              if checked>=20:break
              if not re.search(r'\.js(?:\?|$)',url,re.I):continue
              checked+=1
              try:js=get(url,8)
              except Exception as e:
                  print('SCRIPT_ERROR',url,repr(e));continue
              if not re.search(r'portfolio|download|forms|api|ajax',js,re.I):continue
              print('SCRIPT_HIT',url)
              vals=[]
              for pat in [r'https?://[^"\'\s)]+',
                          r'["\'][^"\']{0,250}(?:portfolio|download|forms|api|ajax)[^"\']{0,650}["\']']:
                  for m in re.finditer(pat,js,re.I):
                      v=m.group(0)
                      if v not in vals:vals.append(v)
              for v in vals[:250]:print('JS_TOKEN',v[:2500])
          PY
