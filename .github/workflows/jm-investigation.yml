name: JM portfolio investigation

on:
  push:
    branches: [backend/jm-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Query JM Portfolio Disclosure API
        run: |
          python - <<'PY'
          import urllib.request,json
          base='https://jmmfapi.jmfinancialmf.com/api/'
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
                   'Content-Type':'application/json','Origin':'https://www.jmfinancialmf.com',
                   'Referer':'https://www.jmfinancialmf.com/downloads/Portfolio-Disclosure'}
          def call(path,payload):
              req=urllib.request.Request(base+path,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read()
                      print('RESP',path,r.status,r.headers.get('Content-Type'),len(b),b.decode('utf-8','replace')[:50000])
                      return b
              except Exception as e:
                  print('ERROR',path,repr(e))
                  if getattr(e,'read',None):
                      try:print('ERROR_BODY',e.read().decode('utf-8','replace')[:20000])
                      except:pass
          call('GetDownloadDrop',{'IICategoryID':'2'})
          call('GetDownloadNew',{'IICategoryID':'2','IISubCategoryID':'0','IVsearch':''})
          call('GetDownloadNew',{'IICategoryID':'2','IISubCategoryID':'37','IVsearch':''})
          call('GetDownloadNewSub',{'IVSubCategoryName':'Monthly Portfolio'})
          PY
