name: JM v128 validation

on:
  push:
    branches: [backend/jm-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_DATA_DIR: /tmp/jm-v128-validation
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile and run complete regression suite
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Validate live JM API and workbook ingestion
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          uv run --frozen python - <<'PY'
          import json
          from tracker import db,disclosures,amc_discovery
          db.init();disclosures.seed_sources()
          rows=list(amc_discovery.discover('JM Financial'))
          print('DISCOVERY',json.dumps(rows))
          assert rows==[
            ('Jm Small Cap Fund',
             'https://www.jmfinancialmf.com/CMS/downloads/Portfolio%20Disclosure/Monthly%20Portfolio%20of%20Schemes/Monthly%20Portfolio%20-%20JM%20Small%20Cap%20Fund%20-%20Aug%2031,%202026.xlsx',
             'Monthly Portfolio - JM Small Cap Fund - Aug 31, 2026'),
            ('Jm Small Cap Fund',
             'https://www.jmfinancialmf.com/CMS/downloads/Portfolio%20Disclosure/Monthly%20Portfolio%20of%20Schemes/Monthly%20Portfolio%20-%20JM%20Small%20Cap%20Fund%20-%20July%2031,%202026.xlsx',
             'Monthly Portfolio - JM Small Cap Fund - July 31, 2026')]
          counts=[amc_discovery.store_report('JM Financial',*row) for row in rows]
          snaps=db.rows("""SELECT p.as_of,p.complete,p.hash,p.source,COUNT(h.id) positions,
            SUM(h.weight) weight,SUM(CASE WHEN h.quantity IS NOT NULL THEN 1 ELSE 0 END) quantities
            FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
            WHERE p.family='Jm Small Cap Fund'
            GROUP BY p.id ORDER BY p.as_of DESC,p.id DESC""")
          aums=db.rows("""SELECT as_of,value,unit,hash FROM metrics
            WHERE family='Jm Small Cap Fund' AND metric='aum'
            ORDER BY as_of DESC""")
          repo=db.rows("""SELECT p.as_of,h.name,h.asset_type,h.weight FROM holdings h
            JOIN portfolios p ON p.id=h.snapshot_id
            WHERE p.family='Jm Small Cap Fund' AND h.name='CCIL'
            ORDER BY p.as_of DESC""")
          print('COUNTS',counts)
          print('SNAPSHOTS',json.dumps(snaps))
          print('AUMS',json.dumps(aums))
          print('CCIL',json.dumps(repo))
          assert counts==[86,84]
          assert len(snaps)==2
          assert snaps[0]['as_of']=='2026-08-31' and snaps[0]['complete']==1
          assert snaps[0]['positions']==85 and snaps[0]['quantities']==83
          assert abs(float(snaps[0]['weight'])-100)<1e-8
          assert snaps[0]['hash']=='a1060a5d303c8d94e96428afb67aff66e0d00291e184edbbd9341d76149ece24'
          assert snaps[1]['as_of']=='2026-07-31' and snaps[1]['complete']==1
          assert snaps[1]['positions']==83 and snaps[1]['quantities']==81
          assert abs(float(snaps[1]['weight'])-100)<1e-8
          assert snaps[1]['hash']=='17e9e333b30ebbe2b435d574ad0ed0be184945c94325fca089f1f43d14c2dfb5'
          assert [(x['as_of'],round(float(x['value']),6)) for x in aums]==[
            ('2026-08-31',929.496506),('2026-07-31',868.317695)]
          assert [(x['as_of'],x['asset_type']) for x in repo]==[
            ('2026-08-31','Money market'),('2026-07-31','Money market')]
          for row in rows:
              amc_discovery.store_report('JM Financial',*row)
          snaps2=db.rows("""SELECT p.as_of,COUNT(h.id) positions FROM portfolios p
            JOIN holdings h ON h.snapshot_id=p.id
            WHERE p.family='Jm Small Cap Fund'
            GROUP BY p.id ORDER BY p.as_of DESC""")
          assert snaps2==[
            {'as_of':'2026-08-31','positions':85},
            {'as_of':'2026-07-31','positions':83}]
          # Discovery API responses are intentionally transient; only workbook
          # fetches are archived in this isolated database.
          api_fetches=db.rows("""SELECT url,hash FROM fetches
            WHERE url LIKE 'https://jmmfapi.jmfinancialmf.com/%'""")
          assert not api_fetches
          PY
