name: JM portfolio investigation

on:
  push:
    branches: [backend/jm-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect JM download API contract
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://www.jmfinancialmf.com/static/js/main.d8e32c01.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r: js=r.read().decode('utf-8','replace')
          for needle in (
              'jmmfapi.jmfinancialmf.com/api/',
              'Portfolio Disclosure',
              'portfolio-disclosure',
              'downloads/Forms',
              'downloadFile',
              'GetDownload',
              'GetDownloads',
              'DownloadCategory',
              'Factsheet',
          ):
              start=0;count=0
              while count<25:
                  i=js.lower().find(needle.lower(),start)
                  if i<0:break
                  print('CTX',needle,js[max(0,i-5000):i+9000])
                  start=i+len(needle);count+=1
          PY
