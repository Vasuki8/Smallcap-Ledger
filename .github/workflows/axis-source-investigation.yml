name: Axis source investigation (read-only)

on:
  push:
    branches: [work/axis-portfolio-20260924]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Probe bounded official Axis monthly workbook convention
        run: |
          mkdir -p audit
          uv run --frozen python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from urllib.parse import quote
          import httpx
          out=Path('audit')
          base='https://www.axismf.com/cms/sites/default/files/Statutory/'
          stems=[]
          for day,month in [('31','08'),('31','07')]:
            for year in ('26','2026'):
              stems += [
                f'Monthly Portfolio-{day} {month} {year}.xlsx',
                f'Monthly Portfolio - {day} {month} {year}.xlsx',
                f'Monthly Portfolio {day} {month} {year}.xlsx',
                f'Monthly Portfolio-{day}-{month}-{year}.xlsx',
              ]
          c=httpx.Client(headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.axismf.com/statutory-disclosures'},timeout=20,follow_redirects=True)
          rows=[]
          for stem in stems:
            url=base+quote(stem)
            try:
              r=c.get(url)
              sig=r.content[:4]
              ok=r.status_code==200 and sig==b'PK\x03\x04'
              row={'stem':stem,'url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'xlsx':ok}
              if ok:
                digest=hashlib.sha256(r.content).hexdigest(); row['sha256']=digest
                (out/stem.replace(' ','_').replace('/','_')).write_bytes(r.content)
              rows.append(row); print(json.dumps(row))
            except Exception as e:
              rows.append({'stem':stem,'error':repr(e)})
          (out/'results.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axis-workbook-probe
          path: audit/
          retention-days: 3
