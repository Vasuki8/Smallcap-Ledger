name: Axis source investigation (read-only)

on:
  push:
    branches: [work/axis-portfolio-20260924]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Query verified Axis statutory APIs
        run: |
          mkdir -p audit
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          import httpx
          out=Path('audit')
          c=httpx.Client(headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Accept':'application/json,text/plain,text/html,*/*',
            'Content-Type':'application/json',
            'Referer':'https://www.axismf.com/statutory-disclosures'
          },timeout=20,follow_redirects=True)
          tests=[
            ('route','GET','https://www.axismf.com/statutory-disclosures/portfolios',None),
            ('nested','POST','https://www.axismf.com/cms/get-nested-list',{'sdParentID':'sdPortfolios'}),
            ('documents','POST','https://www.axismf.com/cms/get-scheme-documents',{'sdType':'nestedList','sdID':'sdPortfolios'}),
            ('top','POST','https://www.axismf.com/cms/get-all-statutory-disclosure',{}),
            ('subcategory','POST','https://www.axismf.com/cms/get-all-statutory-subcategory-disclosure',{'sdParentID':'sdPortfolios'})
          ]
          summary=[]
          for name,method,url,body in tests:
            try:
              r=c.request(method,url,json=body if method=='POST' else None)
              item={'name':name,'status':r.status_code,'url':str(r.url),'content_type':r.headers.get('content-type'),'bytes':len(r.content),'prefix':r.text[:500]}
              summary.append(item)
              (out/f'{name}.bin').write_bytes(r.content)
              print(json.dumps(item,ensure_ascii=False))
            except Exception as e:
              print(name,repr(e)); summary.append({'name':name,'error':repr(e)})
          (out/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axis-api-query
          path: audit/
          retention-days: 3
