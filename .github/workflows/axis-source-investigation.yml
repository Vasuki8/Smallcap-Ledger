name: Axis source investigation (read-only)

on:
  push:
    branches: [work/axis-portfolio-20260924]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect public Axis statutory routes
        run: |
          mkdir -p audit
          uv run --frozen python - <<'PY'
          import json,re
          from pathlib import Path
          import httpx
          out=Path('audit')
          c=httpx.Client(headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'},timeout=20,follow_redirects=True)
          slugs=['sdPortfolios','portfolio','portfolios','portfolio-disclosures','monthly-portfolio','monthly-portfolios']
          summary=[]
          for slug in slugs:
            url='https://www.axismf.com/statutory-disclosures/'+slug
            try:
              r=c.get(url)
              text=r.text
              m=re.search(r'statutoryDisclosureSubCategoryResponse.{0,12000}',text,re.I|re.S)
              excerpt=m.group(0)[:12000] if m else ''
              item={'slug':slug,'status':r.status_code,'bytes':len(r.content),'has_pdList':'pdList' in excerpt,'has_nested':'sdNestedList' in excerpt,'has_data_not_available':'Data not available' in excerpt,'excerpt':excerpt[:2500]}
              summary.append(item)
              (out/f'{slug}.html').write_bytes(r.content)
              print(json.dumps(item,ensure_ascii=False))
            except Exception as e:
              print(slug,repr(e))
          (out/'summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axis-route-probe
          path: audit/
          retention-days: 3
