name: Axis source investigation (read-only)

on:
  push:
    branches: [work/axis-portfolio-20260924]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect first-party Axis disclosure frontend
        run: |
          mkdir -p audit
          uv run --frozen python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import httpx
          from bs4 import BeautifulSoup

          out=Path('audit')
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/json,text/plain,*/*',
            'Referer':'https://www.axismf.com/'
          }
          client=httpx.Client(headers=headers,timeout=20,follow_redirects=True)
          pages=[
            'https://www.axismf.com/statutory-disclosures',
            'https://www.axismf.com/downloads',
            'https://www.axismf.com/mutual-funds/equity-funds/axis-small-cap-fund/sc-dg/direct'
          ]
          records=[]
          scripts=[]
          def first_party(url):
            h=(urlparse(url).hostname or '').lower()
            return h=='axismf.com' or h.endswith('.axismf.com')
          for idx,page in enumerate(pages):
            try:
              r=client.get(page)
              records.append({'type':'page','url':page,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type')})
              (out/f'page-{idx}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              for tag in soup.select('script[src]'):
                u=urljoin(str(r.url),tag.get('src',''))
                if first_party(u) and u not in scripts:scripts.append(u)
            except Exception as e:
              records.append({'type':'page','url':page,'error':repr(e)})
          terms=re.compile(r'portfolio|disclosure|statutory|download|document|cms|api|ajax|graphql|scheme',re.I)
          urls=re.compile(r'''(?:"|')((?:https?:)?//[^"' ]+|/[^"' ]{3,220})(?:"|')''')
          matches=[]
          for i,u in enumerate(scripts[:45]):
            try:
              r=client.get(u)
              if r.status_code!=200: continue
              text=r.text
              local=[]
              for m in terms.finditer(text):
                a=max(0,m.start()-260);b=min(len(text),m.end()+500)
                s=text[a:b].replace('\n',' ')
                if s not in local:local.append(s)
                if len(local)>=80:break
              found_urls=[]
              for m in urls.finditer(text):
                candidate=m.group(1)
                if terms.search(candidate):
                  absu=urljoin(u,candidate)
                  if first_party(absu) and absu not in found_urls:found_urls.append(absu)
              if local or found_urls:
                name=f'script-{i}.js'
                (out/name).write_text(text,errors='replace')
                matches.append({'url':u,'file':name,'snippets':local[:80],'candidate_urls':found_urls[:100]})
            except Exception as e:
              records.append({'type':'script','url':u,'error':repr(e)})
          (out/'records.json').write_text(json.dumps(records,indent=2))
          (out/'scripts.json').write_text(json.dumps(scripts,indent=2))
          (out/'matches.json').write_text(json.dumps(matches,indent=2))
          print('pages',json.dumps(records,indent=2))
          print('scripts',len(scripts),'matching bundles',len(matches))
          for item in matches:
            print('\nBUNDLE',item['url'])
            for u in item['candidate_urls'][:40]:print('URL',u)
            for s in item['snippets'][:8]:print('SNIP',s[:900])
          PY
      - name: Retain investigation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axis-source-investigation
          path: audit/
          retention-days: 3
