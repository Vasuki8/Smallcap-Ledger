name: Axis source investigation (read-only)

on:
  push:
    branches: [work/axis-portfolio-20260924]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Trace Axis statutory portfolio API
        run: |
          mkdir -p audit
          uv run --frozen python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import httpx
          from bs4 import BeautifulSoup
          out=Path('audit')
          client=httpx.Client(headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/json,text/plain,*/*',
            'Referer':'https://www.axismf.com/statutory-disclosures'
          },timeout=20,follow_redirects=True)
          page='https://www.axismf.com/statutory-disclosures'
          r=client.get(page); r.raise_for_status()
          (out/'page.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=[urljoin(page,x.get('src','')) for x in soup.select('script[src]')]
          scripts=[u for u in scripts if (urlparse(u).hostname or '').lower().endswith('axismf.com')]
          targets=[u for u in scripts if ('statutory-disclosures' in u or u in scripts[45:])]
          rows=[]
          q=re.compile(r'(?:https?:)?//[^"\\'\\\\\\s]+|/[A-Za-z0-9_?=&.%:,@+~/-]{3,260}')
          for i,u in enumerate(targets):
            try:
              s=client.get(u).text
              (out/f'target-{i}.js').write_text(s,errors='replace')
              found=[]
              for m in q.finditer(s):
                x=m.group(0)
                if re.search(r'api|portfolio|disclosure|statutory|document|download|nested',x,re.I) and x not in found: found.append(x)
              rows.append({'index':i,'url':u,'urls':found[:200]})
              print('\\nTARGET',i,u)
              for x in found[:100]: print('URL',x)
              for term in ('sdPortfolios','nestedList','statutoryDisclosure','portfolio','disclosure'):
                for m in list(re.finditer(term,s,re.I))[:8]:
                  print('SNIP',term,s[max(0,m.start()-500):m.start()+1200].replace('\\n',' ')[:1700])
            except Exception as e:
              rows.append({'index':i,'url':u,'error':repr(e)})
          (out/'targets.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axis-source-trace
          path: audit/
          retention-days: 3
