name: Tata portfolio investigation (read-only)

on:
  push:
    branches: [work/axis-portfolio-20260924]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Trace live Tata portfolio page API
        run: |
          mkdir -p audit
          uv run --frozen python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import httpx
          from bs4 import BeautifulSoup
          out=Path('audit')
          page='https://www.tatamutualfund.com/schemes-related/portfolio'
          c=httpx.Client(headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json,*/*','Referer':page},timeout=20,follow_redirects=True)
          r=c.get(page);r.raise_for_status()
          (out/'page.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=[urljoin(str(r.url),s.get('src','')) for s in soup.select('script[src]')]
          scripts=[u for u in scripts if u.startswith('http')]
          print('SCRIPTS',len(scripts))
          rows=[]
          terms=re.compile(r'portfolio|monthly|fortnight|weekly|download|scheme|document|api|ajax|year',re.I)
          for i,u in enumerate(scripts[:80]):
            try:
              rr=c.get(u)
              if rr.status_code!=200:continue
              text=rr.text
              if not terms.search(text):continue
              name=f'script-{i}.js';(out/name).write_text(text,errors='replace')
              snippets=[]
              for m in list(terms.finditer(text))[:120]:
                s=text[max(0,m.start()-350):m.start()+900].replace('\n',' ')
                if s not in snippets:snippets.append(s)
              urls=[]
              for m in re.finditer(r'["\x27]([^"\x27]{3,300})["\x27]',text):
                x=m.group(1)
                if terms.search(x) and ('/' in x or 'api' in x.lower()) and x not in urls:urls.append(x)
              row={'url':u,'file':name,'urls':urls[:150],'snippets':snippets[:80]}
              rows.append(row)
              print('BUNDLE',u)
              for x in urls[:70]:print('URL',x)
              for s in snippets[:12]:print('SNIP',s[:1200])
            except Exception as e:
              print('ERR',u,repr(e))
          (out/'trace.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tata-api-trace
          path: audit/
          retention-days: 3
