name: Portfolio limitation validation

on:
  push:
    branches: [backend/portfolio-limitations-20260925]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Compile
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: Run regression suite
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Restore production database
        run: uv run --frozen python scripts/github_state.py restore
      - name: Verify production portfolio limitation coverage
        run: |
          uv run --frozen python - <<'PY'
          from tracker import coverage

          payload=coverage.report()
          expected={
              "Axis Small Cap Fund":"undisclosed_constituents",
              "Bajaj Finserv Small Cap Fund":"named_subset_only",
              "Bandhan Small Cap Fund":"non_numeric_source_weight",
              "Edelweiss Small Cap Fund":"named_subset_only",
              "ICICI Prudential Small Cap Fund":"undisclosed_constituents",
              "Sundaram Small Cap Fund":"non_numeric_source_weight",
              "UTI Small Cap Fund":"non_numeric_source_weight",
              "Union Small Cap Fund":"upstream_source_unavailable",
          }
          funds={row["family"]:row for row in payload["funds"]}
          for family,code in expected.items():
              got=(funds[family].get("portfolio_limitation") or {}).get("code")
              assert got==code,(family,got,code)
              print("LIMITATION",family,got)
          counts=payload["counts"]
          assert counts["portfolio"]==35,counts
          assert counts["portfolio_complete"]==28,counts
          assert counts["portfolio_fresh"]==34,counts
          assert counts["portfolio_partial"]==7,counts
          assert payload["portfolio_limitation_reasons"]=={
              "undisclosed_constituents":2,
              "named_subset_only":2,
              "non_numeric_source_weight":3,
              "upstream_source_unavailable":1,
          },payload["portfolio_limitation_reasons"]
          print("COUNTS",counts)
          print("LIMITATION_COUNTS",payload["portfolio_limitation_reasons"])
          PY
