name: Update and publish small-cap tracker

on:
  push:
    branches: [main]
    paths-ignore: ['deployment/**']
  schedule:
    # UTC 18:30 = 00:00 the following day in Asia/Kolkata (IST).
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch new public data before publishing
        type: boolean
        default: true
      import_archive_asset:
        description: Optional manually uploaded cumulative ZIP asset in tracker-history
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: smallcap-daily-and-deploy
  cancel-in-progress: false

jobs:
  build:
    outputs:
      build_sha: ${{ steps.revision.outputs.sha }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Capture tested revision
        id: revision
        run: |
          echo "SMALLCAP_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preflight Python syntax
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: Restore cumulative history
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/github_state.py restore
      - name: Load reviewed retention classifications
        run: uv run --frozen python scripts/prepare_retention_metadata.py --apply
      - name: Establish staged audit generation boundary
        run: echo "MIDCAP_AUDIT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Preview staged Mid Cap universe
        timeout-minutes: 3
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/preview_category_expansion.py
          --fetch-amfi
          --output deployment/category-expansion-preview.json
      - name: Audit staged Mid Cap identities
        timeout-minutes: 3
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_identity.py
          --preview deployment/category-expansion-preview.json
          --output deployment/midcap-identity-audit.json
      - name: Store audited Mid Cap staging data
        timeout-minutes: 3
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/stage_midcap_import.py
          --audit deployment/midcap-identity-audit.json
          --preview deployment/category-expansion-preview.json
          --report deployment/midcap-staging-status.json
      - name: Backfill staged Mid Cap NAV history
        timeout-minutes: 12
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/backfill_midcap_history.py
          --report deployment/midcap-history-status.json
      - name: Audit staged Mid Cap source coverage
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_source_coverage.py
          --json docs/MIDCAP-SOURCE-COVERAGE-AUDIT.json
          --markdown docs/MIDCAP-SOURCE-COVERAGE-AUDIT.md
      - name: Classify staged Mid Cap TER gaps
        timeout-minutes: 2
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/classify_midcap_ter_gaps.py
          --source-audit docs/MIDCAP-SOURCE-COVERAGE-AUDIT.json
          --json docs/MIDCAP-TER-GAP-AUDIT.json
          --markdown docs/MIDCAP-TER-GAP-AUDIT.md
      - name: Audit staged Mid Cap first-party TER batch
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_ter_first_party.py
          --json docs/MIDCAP-TER-FIRST-PARTY-BATCH1.json
          --markdown docs/MIDCAP-TER-FIRST-PARTY-BATCH1.md
      - name: Audit staged Mid Cap first-party TER batch 2
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_ter_first_party_batch2.py
          --json docs/MIDCAP-TER-FIRST-PARTY-BATCH2.json
          --markdown docs/MIDCAP-TER-FIRST-PARTY-BATCH2.md
      - name: Reconcile staged Mid Cap TER readiness
        timeout-minutes: 2
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/reconcile_midcap_ter_readiness.py
          --source-audit docs/MIDCAP-SOURCE-COVERAGE-AUDIT.json
          --first-party docs/MIDCAP-TER-FIRST-PARTY-BATCH1.json
          --first-party-extra docs/MIDCAP-TER-FIRST-PARTY-BATCH2.json
          --json docs/MIDCAP-TER-READINESS.json
          --markdown docs/MIDCAP-TER-READINESS.md
      - name: Audit staged Mid Cap benchmark identities
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_benchmarks.py
          --json docs/MIDCAP-BENCHMARK-BATCH1.json
          --markdown docs/MIDCAP-BENCHMARK-BATCH1.md
      - name: Audit staged Mid Cap benchmark identities batch 2
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_benchmarks_batch2.py
          --json docs/MIDCAP-BENCHMARK-BATCH2.json
          --markdown docs/MIDCAP-BENCHMARK-BATCH2.md
      - name: Reconcile staged Mid Cap benchmark readiness
        timeout-minutes: 2
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/reconcile_midcap_benchmark_readiness.py
          --batch1 docs/MIDCAP-BENCHMARK-BATCH1.json
          --batch2 docs/MIDCAP-BENCHMARK-BATCH2.json
          --json docs/MIDCAP-BENCHMARK-READINESS.json
          --markdown docs/MIDCAP-BENCHMARK-READINESS.md
      - name: Audit staged Mid Cap current portfolio evidence
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_portfolios.py
          --json docs/MIDCAP-PORTFOLIO-BATCH1.json
          --markdown docs/MIDCAP-PORTFOLIO-BATCH1.md
      - name: Audit staged Mid Cap structured portfolio evidence batch 2
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_portfolios_batch2.py
          --json docs/MIDCAP-PORTFOLIO-BATCH2.json
          --markdown docs/MIDCAP-PORTFOLIO-BATCH2.md
      - name: Audit staged Mid Cap structured portfolio evidence batch 3
        timeout-minutes: 12
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_portfolios_batch3.py
          --json docs/MIDCAP-PORTFOLIO-BATCH3.json
          --markdown docs/MIDCAP-PORTFOLIO-BATCH3.md
      - name: Audit staged Mid Cap structured portfolio evidence batch 4
        timeout-minutes: 12
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_portfolios_batch4.py
          --json docs/MIDCAP-PORTFOLIO-BATCH4.json
          --markdown docs/MIDCAP-PORTFOLIO-BATCH4.md
      - name: Audit staged Mid Cap current portfolio evidence batch 5
        timeout-minutes: 12
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/audit_midcap_portfolios_batch5.py
          --json docs/MIDCAP-PORTFOLIO-BATCH5.json
          --markdown docs/MIDCAP-PORTFOLIO-BATCH5.md
      - name: Reconcile staged Mid Cap portfolio readiness
        timeout-minutes: 2
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/reconcile_midcap_portfolio_readiness.py
          --batch1 docs/MIDCAP-PORTFOLIO-BATCH1.json
          --batch2 docs/MIDCAP-PORTFOLIO-BATCH2.json
          --batch3 docs/MIDCAP-PORTFOLIO-BATCH3.json
          --batch4 docs/MIDCAP-PORTFOLIO-BATCH4.json
          --batch5 docs/MIDCAP-PORTFOLIO-BATCH5.json
          --json docs/MIDCAP-PORTFOLIO-READINESS.json
          --markdown docs/MIDCAP-PORTFOLIO-READINESS.md
      - name: Audit staged Mid Cap launch readiness
        timeout-minutes: 2
        run: >-
          uv run --frozen python scripts/audit_midcap_launch_readiness.py
          --source-audit docs/MIDCAP-SOURCE-COVERAGE-AUDIT.json
          --ter docs/MIDCAP-TER-READINESS.json
          --benchmark docs/MIDCAP-BENCHMARK-READINESS.json
          --portfolio docs/MIDCAP-PORTFOLIO-READINESS.json
          --history deployment/midcap-history-status.json
          --json docs/MIDCAP-LAUNCH-READINESS.json
          --markdown docs/MIDCAP-LAUNCH-READINESS.md
      - name: Diagnose final six Mid Cap TER sources
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/diagnose_midcap_ter_final6.py
          --output deployment/midcap-ter-final6-source-diagnostic.json
      - name: Inspect four concrete Mid Cap TER files
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 6
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/diagnose_midcap_ter_final4_files.py
          --output deployment/midcap-ter-final4-file-diagnostic.json
      - name: Diagnose final three Mid Cap TER sources precisely
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/diagnose_midcap_ter_final3_targeted.py
          --output deployment/midcap-ter-final3-targeted.json
      - name: Diagnose staged Mid Cap portfolio batch 1
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/diagnose_midcap_portfolio_batch1.py
          --output deployment/midcap-portfolio-batch1-diagnostic.json
      - name: Diagnose staged Mid Cap portfolio batch 3 contracts
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        run: >-
          uv run --frozen python scripts/diagnose_midcap_portfolio_batch3_contracts.py
          --output docs/MIDCAP-PORTFOLIO-BATCH3-CONTRACTS.json
      - name: Import owner-supplied additions
        if: github.event_name == 'workflow_dispatch' && inputs.import_archive_asset != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_ARCHIVE_ASSET: ${{ inputs.import_archive_asset }}
        run: uv run --frozen python scripts/import_archive.py
      - name: Establish collection health boundary
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: echo "SMALLCAP_COLLECTION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Collect daily data
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        timeout-minutes: 40
        continue-on-error: true
        run: uv run --frozen python scripts/daily_update.py
      - name: Repair retained unarchived AMC communications
        timeout-minutes: 15
        continue-on-error: true
        run: uv run --frozen python scripts/repair_unarchived_communications.py
      - name: Recover any interrupted collection status
        run: uv run --frozen python -c "from tracker import db; db.init(recover=True)"
      - name: Gate publication on collection health
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: >-
          uv run --frozen python scripts/check_publication_health.py
          --started-at "$SMALLCAP_COLLECTION_STARTED_AT"
          --output deployment/publication-health.json
      - name: Prepare retention metadata without deleting binaries
        run: >-
          uv run --frozen python scripts/prepare_retention_metadata.py --apply
          --report deployment/retention-readiness.json
          --delta-report docs/SOURCE-RETENTION-DELTA.json
          --delta-markdown docs/SOURCE-RETENTION-DELTA.md
          --candidate-delta docs/SOURCE-RETENTION-NEW-CANDIDATES.json
      - name: Compact redundant database indexing
        run: uv run --frozen python scripts/compact_database.py --apply --report deployment/storage-layout-v1.json
      - name: Check archive and financial calculations
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Generate GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/export_site.py
      - name: Validate generated data and downloads
        run: uv run --frozen python scripts/validate_site.py site
      - name: Verify publication base is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$CURRENT_MAIN" != "$SMALLCAP_BUILD_SHA" ]; then
            echo "::error::main moved from tested revision $SMALLCAP_BUILD_SHA to $CURRENT_MAIN; refusing stale publication"
            exit 1
          fi
      - name: Save cumulative historical archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/github_state.py publish
      - name: Record collection status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH_HEADER"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          uv run --frozen python scripts/record_build.py
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Record successful Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SMALLCAP_BUILD_SHA: ${{ needs.build.outputs.build_sha }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH_HEADER"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          python scripts/record_deployment.py --page-url "$PAGES_URL" --run-id "$GITHUB_RUN_ID"
