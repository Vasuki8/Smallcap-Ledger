name: Inspect Union portfolio source

on:
  push:
    branches: [backend/uti-portfolio-audit-v130]
    paths: [.github/workflows/inspect-axis.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Union downloads application
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.scripts=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='script' and d.get('src'): self.scripts.append(d['src'])
                  if tag=='a' and d.get('href'): self.links.append(d['href'])
          def fetch(url):
              try:
                  req=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(); print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl()); return b,r.geturl()
              except Exception as e:
                  print('ERROR',url,type(e).__name__,str(e)); return b'',url
          page='https://www.unionmf.com/about-us/downloads'
          body,final=fetch(page)
          if not body: raise SystemExit(0)
          html=body.decode('utf-8','ignore')
          print('HTML_API_PATTERNS')
          for pat in [r'https?://[^"\'<> ]+',r'/api/[^"\'<> ]+',r'[A-Za-z0-9_/.-]*(?:portfolio|download)[A-Za-z0-9_/?&=.-]*']:
              vals=[]
              for m in re.finditer(pat,html,re.I):
                  v=m.group(0)
                  if v not in vals: vals.append(v)
              for v in vals[:80]: print(v)
          p=P();p.feed(html)
          print('SCRIPTS',len(p.scripts))
          for src in p.scripts:
              full=urllib.parse.urljoin(final,src); print('SCRIPT',full)
              if not re.search(r'(jquery|bootstrap|gtm|google|captcha|analytics)',full,re.I):
                  b,_=fetch(full)
                  if not b: continue
                  s=b.decode('utf-8','ignore')
                  if re.search(r'portfolio|Monthly Portfolios|downloads|api',s,re.I):
                      print('SCRIPT_MATCH',full)
                      for m in re.finditer(r'.{0,220}(?:portfolio|monthlyportfolio|download|api).{0,350}',s,re.I|re.S):
                          t=re.sub(r'\s+',' ',m.group(0))
                          print(t[:700])
                          if m.start()>1000000: break
          PY
