name: Inspect Axis August portfolio source

on:
  push:
    branches: [backend/uti-portfolio-audit-v130]
    paths: [.github/workflows/inspect-axis.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect official Axis August full factsheet PDF
        run: |
          uv run --frozen python - <<'PY'
          import io, re, urllib.request
          from pypdf import PdfReader

          url='https://www.axismf.com/efactsheet/Aug-2026/Innerpage/Axis%20Fund%20Factsheet%20August%202026%20Final.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=r.read(); print('PDF',r.status,len(body),r.headers.get('content-type'),r.geturl())
          reader=PdfReader(io.BytesIO(body))
          print('PAGES',len(reader.pages),'ENCRYPTED',reader.is_encrypted)
          for i,page in enumerate(reader.pages):
              text=page.extract_text() or ''
              if re.search(r'AXIS\s+SMALL\s+CAP\s+FUND|SMALL\s+CAP\s+FUND',text,re.I):
                  print('PAGE',i+1,'DEFAULT_LEN',len(text))
                  print(text[:14000])
                  layout=page.extract_text(extraction_mode='layout') or ''
                  print('LAYOUT_LEN',len(layout))
                  print(layout[:18000])
          PY
