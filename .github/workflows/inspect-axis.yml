name: Inspect Axis August portfolio source

on:
  push:
    branches: [backend/uti-portfolio-audit-v130]
    paths: [.github/workflows/inspect-axis.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect exact Axis Small Cap e-factsheet
        run: |
          uv run --frozen python - <<'PY'
          import re, urllib.parse, urllib.request
          from bs4 import BeautifulSoup

          url='https://www.axismf.com/efactsheet/Aug-2026/Innerpage/SMALL-CAP.html'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=35) as r:
              body=r.read(); final=r.geturl()
          print('HTML_BYTES',len(body),final)
          html=body.decode('utf-8','ignore')
          soup=BeautifulSoup(html,'html.parser')
          text='\n'.join(x.strip() for x in soup.stripped_strings)
          for key in [
              'Axis Small Cap Fund','PORTFOLIO','Domestic Equities',
              'Instrument Type/Issuer Name','Grand Total',
              'Krishna Institute','Torrent Pharmaceuticals','CCL Products'
          ]:
              print('KEY',key,'HTML',html.lower().find(key.lower()),'TEXT',text.lower().find(key.lower()))
              pos=text.lower().find(key.lower())
              if pos>=0: print('TEXT_CTX',text[max(0,pos-800):pos+4000])
          print('TABLES',len(soup.find_all('table')))
          for idx,table in enumerate(soup.find_all('table')):
              t=' '.join(table.stripped_strings)
              if re.search(r'portfolio|domestic equities|instrument type|krishna institute|grand total',t,re.I):
                  print('TABLE',idx,'LEN',len(t))
                  print(t[:8000])
          print('URLS')
          seen=set()
          for tag in soup.find_all(['a','img','iframe','embed','object','script','link']):
              raw=tag.get('href') or tag.get('src') or tag.get('data') or ''
              if not raw: continue
              full=urllib.parse.urljoin(final,raw)
              if full in seen: continue
              seen.add(full)
              if re.search(r'portfolio|small|\.pdf(?:\?|$)|\.xlsx?(?:\?|$)|\.csv(?:\?|$)|\.png(?:\?|$)|\.jpe?g(?:\?|$)',full,re.I):
                  print(tag.name,full)
          print('PERCENT_LINES')
          for line in text.splitlines():
              if '%' in line and re.search(r'Equit|TREPS|Cash|Repo|Grand|Domestic|Foreign|Debt|Krishna|Torrent|CCL',line,re.I):
                  print(line[:1000])
          PY
