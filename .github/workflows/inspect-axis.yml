name: Inspect Axis August portfolio source

on:
  push:
    branches: [backend/uti-portfolio-audit-v130]
    paths: [.github/workflows/inspect-axis.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect Axis Small Cap factsheet candidate pages
        run: |
          uv run --frozen python - <<'PY'
          import io, re, urllib.request
          from pypdf import PdfReader
          url='https://www.axismf.com/efactsheet/Aug-2026/Innerpage/Axis%20Fund%20Factsheet%20August%202026%20Final.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r: body=r.read()
          reader=PdfReader(io.BytesIO(body))
          for idx in range(14,21):
              text=reader.pages[idx].extract_text() or ''
              print('CANDIDATE',idx+1,'LEN',len(text),
                    'smallcap',bool(re.search(r'AXIS\s+SMALL\s+CAP\s+FUND',text,re.I)),
                    'allot',bool(re.search(r'29\w*\s+November\s+2013',text,re.I)),
                    'aum',('31,448.32' in text))
              if (re.search(r'AXIS\s+SMALL\s+CAP\s+FUND',text,re.I)
                  or re.search(r'29\w*\s+November\s+2013',text,re.I)
                  or '31,448.32' in text):
                  print('---DEFAULT---')
                  print(text[:16000])
                  layout=reader.pages[idx].extract_text(extraction_mode='layout') or ''
                  print('---LAYOUT---')
                  print(layout[:20000])
          PY
