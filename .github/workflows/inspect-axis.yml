name: Inspect Axis August portfolio source

on:
  push:
    branches: [backend/uti-portfolio-audit-v130]
    paths: [.github/workflows/inspect-axis.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Locate Axis Small Cap page number
        run: |
          uv run --frozen python - <<'PY'
          import io, re, urllib.request
          from pypdf import PdfReader
          url='https://www.axismf.com/efactsheet/Aug-2026/Innerpage/Axis%20Fund%20Factsheet%20August%202026%20Final.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r: body=r.read()
          reader=PdfReader(io.BytesIO(body))
          for pageno in (1,2,3):
              text=reader.pages[pageno-1].extract_text() or ''
              if 'Axis Small Cap Fund' in text:
                  pos=text.index('Axis Small Cap Fund')
                  print('TOC_PAGE',pageno)
                  print(text[max(0,pos-1000):pos+1600])
          PY
