name: Inspect Axis August portfolio source

on:
  push:
    branches: [backend/uti-portfolio-audit-v130]
    paths: [.github/workflows/inspect-axis.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect Axis Small Cap page in official full factsheet PDF
        run: |
          uv run --frozen python - <<'PY'
          import io, re, urllib.request
          from pypdf import PdfReader

          url='https://www.axismf.com/efactsheet/Aug-2026/Innerpage/Axis%20Fund%20Factsheet%20August%202026%20Final.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=r.read(); print('PDF',r.status,len(body),r.headers.get('content-type'))
          reader=PdfReader(io.BytesIO(body))
          for i,page in enumerate(reader.pages):
              text=page.extract_text() or ''
              if ('31,448.32' in text and
                  re.search(r'29th\s+November\s+2013',text,re.I) and
                  re.search(r'Nifty\s+Smallcap\s+250\s+TRI',text,re.I)):
                  print('TARGET_PAGE',i+1,'DEFAULT_LEN',len(text))
                  print(text)
                  layout=page.extract_text(extraction_mode='layout') or ''
                  print('TARGET_LAYOUT_LEN',len(layout))
                  print(layout)
                  break
          else:
              print('TARGET_PAGE_NOT_FOUND')
          PY
