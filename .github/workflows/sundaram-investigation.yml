name: Sundaram v126 validation

on:
  push:
    branches: [backend/sundaram-complete-portfolio-v126]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile and run complete regression suite
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Validate live Sundaram workbook ingestion
        env:
          SMALLCAP_DATA_DIR: /tmp/sundaram-v126-validation
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          uv run --frozen python - <<'PY'
          import json
          from tracker import db,disclosures,amc_discovery
          db.init();disclosures.seed_sources()
          rows=list(amc_discovery.discover('Sundaram'))
          print('DISCOVERY',json.dumps(rows,ensure_ascii=False))
          assert rows==[(
            'Sundaram Small Cap Fund',
            'https://www.sundarammutual.com/Downloads_Pdf/Portfolio_Archives/2026/Aug/Equity/SMILE.xlsx',
            'Monthly portfolio')]
          family,url,title=rows[0]
          count=amc_discovery.store_report('Sundaram',family,url,title)
          snap=db.one("""SELECT p.as_of,p.complete,p.hash,p.source,COUNT(h.id) positions,SUM(h.weight) weight
            FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
            WHERE p.family=? GROUP BY p.id ORDER BY p.as_of DESC,p.id DESC LIMIT 1""",(family,))
          aum=db.one("""SELECT as_of,value,unit,source,hash FROM metrics
            WHERE family=? AND metric='aum' AND hash=?
            ORDER BY id DESC LIMIT 1""",(family,snap['hash']))
          censored=db.one("""SELECT h.id FROM holdings h JOIN portfolios p ON p.id=h.snapshot_id
            WHERE p.family=? AND p.hash=? AND h.name='Hindustan Dorr Oliver Ltd @' LIMIT 1""",(family,snap['hash']))
          types=db.rows("""SELECT name,asset_type,weight FROM holdings h JOIN portfolios p ON p.id=h.snapshot_id
            WHERE p.family=? AND p.hash=? AND h.name IN ('TREPS','Margin Money For Derivatives','Cash and Other Net Current Assets')
            ORDER BY h.name""",(family,snap['hash']))
          print('COUNT',count)
          print('SNAPSHOT',json.dumps(snap))
          print('AUM',json.dumps(aum))
          print('CENSORED_STORED',json.dumps(censored))
          print('NON_EQUITY',json.dumps(types))
          assert count==78
          assert snap['as_of']=='2026-08-31'
          assert snap['complete']==0
          assert snap['positions']==77
          assert abs(float(snap['weight'])-100.000005)<0.00002
          assert snap['hash']=='663e7170e2810e7f8e89cef9422cb6c4b653b098591eb6530ff61b4d582cb031'
          assert abs(float(aum['value'])-4155.352174)<0.0001
          assert aum['as_of']=='2026-08-31'
          assert censored is None
          assert {x['name'] for x in types}=={'TREPS','Margin Money For Derivatives','Cash and Other Net Current Assets'}
          PY
