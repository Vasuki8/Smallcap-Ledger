name: Invesco portfolio investigation

on:
  push:
    branches: [backend/invesco-complete-portfolio-v127]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_DATA_DIR: /tmp/invesco-investigation
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Query official Invesco holdings API
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          mkdir -p audit
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          from tracker import providers,db,disclosures,amc_reports
          db.init();disclosures.seed_sources()
          root='https://www.invescomutualfund.com'
          endpoints=[
            root+'/api/ClassificationCompleteMonthlyHoldings',
            root+'/api/CompleteMonthlyHoldings?year=0',
            root+'/api/CompleteMonthlyHoldings?year=2026&classification=equity',
            root+'/api/CompleteMonthlyHoldings?year=2026&classification=Equity',
          ]
          out=Path('audit')
          for i,url in enumerate(endpoints):
              try:
                  body,h,typ=providers.fetch(url,max_bytes=12*1024*1024)
                  print('API',url,len(body),typ,h)
                  txt=body.decode('utf-8','ignore')
                  print('BODY',txt[:30000])
                  (out/f'api-{i}.json').write_bytes(body)
              except Exception as e:
                  print('API_ERROR',url,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invesco-portfolio-investigation
          path: audit/
          retention-days: 3
