name: Invesco monthly holdings investigation

on:
  push:
    branches: [backend/invesco-monthly-holdings-v127]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Query Invesco monthly holdings API
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,hashlib
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r:
                  body=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(body),r.geturl(),hashlib.sha256(body).hexdigest())
                  return body,r.headers.get('Content-Type')

          for year in ('0','2026'):
              url=f'https://www.invescomutualfund.com/api/CompleteMonthlyHoldings?year={year}'
              try:
                  body,typ=get(url)
                  text=body.decode('utf-8','replace')
                  print('API',year,text[:20000])
                  try:
                      data=json.loads(text)
                  except Exception:
                      continue
                  def walk(x,path='root'):
                      if isinstance(x,dict):
                          label=' '.join(str(v) for k,v in x.items() if isinstance(v,(str,int,float)) and k.lower() in ('documentname','title','name','documentdate','year','category'))
                          if re.search(r'small\s*cap',label,re.I):
                              print('SMALLCAP_ITEM',path,json.dumps(x,ensure_ascii=False)[:10000])
                          for k,v in x.items():walk(v,path+'.'+str(k))
                      elif isinstance(x,list):
                          for i,v in enumerate(x):walk(v,path+f'[{i}]')
                  walk(data)
              except Exception as e:
                  print('API_ERROR',year,repr(e))

          # Fetch any exact download URLs exposed for Small Cap in 2026.
          body,_=get('https://www.invescomutualfund.com/api/CompleteMonthlyHoldings?year=2026')
          data=json.loads(body)
          urls=[]
          def collect(x):
              if isinstance(x,dict):
                  blob=json.dumps(x,ensure_ascii=False)
                  if re.search(r'Invesco\s+India\s+Small\s+Cap\s+Fund',blob,re.I):
                      for k,v in x.items():
                          if isinstance(v,str) and ('url' in k.lower() or re.search(r'\.xlsx?(?:\?|$)',v,re.I)):
                              if v.startswith('/'):v='https://www.invescomutualfund.com'+v
                              if v.startswith('http'):urls.append(v)
                  for v in x.values():collect(v)
              elif isinstance(x,list):
                  for v in x:collect(v)
          collect(data)
          for url in dict.fromkeys(urls):
              try:
                  b,t=get(url)
                  print('DOWNLOAD',url,len(b),t,hashlib.sha256(b).hexdigest(),b[:8].hex())
              except Exception as e:
                  print('DOWNLOAD_ERROR',url,repr(e))
          PY
