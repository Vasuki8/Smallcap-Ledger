name: Invesco monthly holdings investigation

on:
  push:
    branches: [backend/invesco-monthly-holdings-v127]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_DATA_DIR: /tmp/invesco-investigation
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect exact Invesco Small Cap workbooks
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          uv run --frozen python - <<'PY'
          import io,json,hashlib,urllib.request
          import openpyxl
          from tracker import db,disclosures,amc_reports
          from tracker.portfolio_parser import parse_sheet

          db.init();disclosures.seed_sources()
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),hashlib.sha256(b).hexdigest())
                  return b

          api='https://www.invescomutualfund.com/api/CompleteMonthlyHoldings?year=2026&classification=equity'
          data=json.loads(get(api))
          row=next(x for x in data if str(x.get('Name','')).strip()=='Invesco India Small Cap Fund')
          print('SMALLCAP',json.dumps(row,ensure_ascii=False))
          for mon in ('Aug','Jul'):
              url=row[mon+'Url']; label=row.get(mon+'Name')
              body=get(url);h=hashlib.sha256(body).hexdigest()
              count=amc_reports.extract(body,'Invesco India Small Cap Fund',url,h)
              snaps=db.rows("""SELECT p.id,p.as_of,p.complete,p.hash,p.source,
                COUNT(h.id) positions,SUM(h.weight) weight
                FROM portfolios p LEFT JOIN holdings h ON h.snapshot_id=p.id
                WHERE p.family='Invesco India Small Cap Fund'
                GROUP BY p.id ORDER BY p.as_of DESC,p.id DESC""")
              print('EXTRACT',mon,label,count,json.dumps(snaps))
              book=openpyxl.load_workbook(io.BytesIO(body),read_only=True,data_only=True)
              for ws in book.worksheets:
                  cells=list(ws.iter_rows())
                  rows0=[[c.value for c in rr] for rr in cells]
                  formats=[[c.number_format or '' for c in rr] for rr in cells]
                  prefix=' '.join(str(v) for rr in rows0[:35] for v in rr if v not in (None,''))
                  if 'small cap' not in (ws.title+' '+prefix).lower():continue
                  parsed=parse_sheet(rows0,formats,'Invesco India Small Cap Fund')
                  info={'sheet':ws.title,'rows':len(rows0),'prefix':prefix[:1600]}
                  if parsed:
                      info['parsed']={'day':parsed['day'],'complete':parsed['complete'],
                          'positions':len(parsed['positions']),
                          'weight':sum(x['weight'] for x in parsed['positions']),
                          'aum':parsed['aum'],'unknown_rows':parsed.get('unknown_rows',[])[:100]}
                  excerpts=[]
                  unknown=(parsed or {}).get('unknown_rows',[])
                  for ri,rr in enumerate(rows0):
                      txt=' | '.join(str(x) for x in rr if x not in (None,''))
                      low=txt.lower()
                      if any(k in low for k in ('invesco india small cap','name of','grand total','net asset','net current','treps','repo','cash','margin','derivative','total')) or any(str(u) in txt for u in unknown):
                          excerpts.append([ri+1,txt[:2200]])
                      if len(excerpts)>=160:break
                  info['excerpts']=excerpts
                  print('SHEET',mon,json.dumps(info,ensure_ascii=False))
              book.close()
          PY
