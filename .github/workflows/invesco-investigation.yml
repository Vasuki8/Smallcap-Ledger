name: Invesco monthly holdings investigation

on:
  push:
    branches: [backend/invesco-monthly-holdings-v127]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Trace Invesco monthly holdings source
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from html import unescape

          page='https://www.invescomutualfund.com/literature-forms/monthly-holdings/equity'
          headers={'User-Agent':'Mozilla/5.0'}
          def get(url,timeout=10):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  body=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(body),r.geturl())
                  return body.decode('utf-8','replace')

          html=get(page)
          for pat in [r'__NEXT_DATA__[^<]*',r'/_next/static/[^"\']+',r'https?://[^"\'\s<>]+',
                      r'[^"\']*(?:monthly|holding|literature|download|api)[^"\']*']:
              vals=[]
              for m in re.finditer(pat,html,re.I):
                  v=unescape(m.group(0))
                  if v not in vals: vals.append(v)
              for v in vals[:120]: print('HTML_TOKEN',v[:2500])

          scripts=[urllib.parse.urljoin(page,unescape(x)) for x in
                   re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          print('SCRIPT_COUNT',len(scripts))
          # Search only application bundles, bounded to prevent a slow asset crawl.
          checked=0
          for url in reversed(scripts):
              if checked>=18:break
              if not re.search(r'\.js(?:\?|$)',url,re.I):continue
              checked+=1
              try: js=get(url,6)
              except Exception as e:
                  print('SCRIPT_ERROR',url,repr(e));continue
              if not re.search(r'monthly|holding|literature|download',js,re.I):continue
              print('SCRIPT_HIT',url)
              matches=[]
              for pat in [r'https?://[^"\'\s)]+',
                          r'["\'][^"\']{0,240}(?:monthly|holding|literature|download|api)[^"\']{0,500}["\']']:
                  for m in re.finditer(pat,js,re.I):
                      v=m.group(0)
                      if v not in matches:matches.append(v)
              for v in matches[:200]:print('JS_TOKEN',v[:2500])
          PY
