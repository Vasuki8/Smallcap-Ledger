name: Invesco v127 validation

on:
  push:
    branches: [backend/invesco-monthly-holdings-v127]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_DATA_DIR: /tmp/invesco-v127-validation
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile and run complete regression suite
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Validate live Invesco API and workbook ingestion
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          uv run --frozen python - <<'PY'
          import json
          from datetime import date
          from tracker import db,disclosures,amc_discovery
          db.init();disclosures.seed_sources()
          rows=list(amc_discovery.discover('Invesco',today=date(2026,9,24)))
          print('DISCOVERY',json.dumps(rows))
          assert len(rows)==2
          assert rows[0][1]=='https://www.invescomutualfund.com/docs/default-source/completes-monthly-holding/small-cap.xlsx?sfvrsn=7d249fc2_0'
          assert rows[1][1]=='https://www.invescomutualfund.com/docs/default-source/completes-monthly-holding/smallcap1d1dfe07eee8616aaa28ff00007d74af.xlsx?sfvrsn=6f59fc2_0'
          counts=[]
          for family,url,title in rows:
              counts.append(amc_discovery.store_report('Invesco',family,url,title))
          snaps=db.rows("""SELECT p.as_of,p.complete,p.hash,p.source,COUNT(h.id) positions,SUM(h.weight) weight
            FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
            WHERE p.family='Invesco India Small Cap Fund'
            GROUP BY p.id ORDER BY p.as_of DESC,p.id DESC""")
          aums=db.rows("""SELECT as_of,value,unit,hash FROM metrics
            WHERE family='Invesco India Small Cap Fund' AND metric='aum'
            ORDER BY as_of DESC""")
          print('COUNTS',counts)
          print('SNAPSHOTS',json.dumps(snaps))
          print('AUMS',json.dumps(aums))
          assert counts==[73,68]
          assert len(snaps)==2
          assert snaps[0]['as_of']=='2026-08-31' and snaps[0]['complete']==1 and snaps[0]['positions']==72
          assert abs(float(snaps[0]['weight'])-100)<1e-8
          assert snaps[0]['hash']=='f8c3405c0c83ed24502bb4b2f95bff7a0e1022d4dceaf7df3b414029716df83d'
          assert snaps[1]['as_of']=='2026-07-31' and snaps[1]['complete']==1 and snaps[1]['positions']==67
          assert abs(float(snaps[1]['weight'])-100)<1e-8
          assert snaps[1]['hash']=='7d4924d152355a89a3359176857e5cb7d20d9df1071d3fd3387b5e2e6277fb00'
          assert [(x['as_of'],round(float(x['value']),4)) for x in aums]==[
              ('2026-08-31',15744.4025),('2026-07-31',14474.7868)]
          for family,url,title in rows:
              amc_discovery.store_report('Invesco',family,url,title)
          snaps2=db.rows("""SELECT p.as_of,COUNT(h.id) positions
            FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
            WHERE p.family='Invesco India Small Cap Fund'
            GROUP BY p.id ORDER BY p.as_of DESC""")
          assert snaps2==[
              {'as_of':'2026-08-31','positions':72},
              {'as_of':'2026-07-31','positions':67}]
          PY
