name: Invesco monthly holdings investigation

on:
  push:
    branches: [backend/invesco-monthly-holdings-v127]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Trace Invesco monthly holdings source
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from html import unescape

          pages=[
            'https://www.invescomutualfund.com/literature-forms/monthly-holdings/equity',
            'https://www.invescomutualfund.com/literature-and-form?tab=Complete',
          ]
          headers={'User-Agent':'Mozilla/5.0'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(body),r.geturl())
                  return body.decode('utf-8','replace')

          for page in pages:
              try: html=get(page)
              except Exception as e:
                  print('PAGE_ERROR',page,repr(e));continue
              print('PAGE_MATCHES')
              for line in html.splitlines():
                  if re.search(r'monthly|holding|literature|download|api|graphql|small.cap',line,re.I):
                      print(line[:4000])
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
              print('SCRIPTS',json.dumps(scripts))
              for src in scripts:
                  url=urllib.parse.urljoin(page,unescape(src))
                  if not re.search(r'\.js(?:\?|$)',url,re.I):continue
                  try: js=get(url)
                  except Exception as e:
                      print('SCRIPT_ERROR',url,repr(e));continue
                  if not re.search(r'monthly|holding|literature|api',js,re.I):continue
                  print('SCRIPT_HIT',url)
                  for pat in [
                      r'https?://[^"\'\s)]+',
                      r'["\'][^"\']*(?:monthly|holding|literature|download|api)[^"\']*["\']',
                  ]:
                      for m in re.finditer(pat,js,re.I):
                          val=m.group(0)
                          if 'google' in val.lower() or 'facebook' in val.lower():continue
                          print('JS_TOKEN',val[:1200])
          PY
