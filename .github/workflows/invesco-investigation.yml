name: Invesco monthly holdings investigation

on:
  push:
    branches: [backend/invesco-monthly-holdings-v127]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect exact Invesco API contract
        run: |
          python - <<'PY'
          import urllib.request,re,json,hashlib
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  b=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),hashlib.sha256(b).hexdigest())
                  return b
          js=get('https://www.invescomutualfund.com/_next/static/chunks/9240-6f2168c4a7a555d2.js').decode('utf-8','replace')
          for needle in ('ClassificationCompleteMonthlyHoldings','CompleteMonthlyHoldings?year='):
              start=0
              while True:
                  i=js.find(needle,start)
                  if i<0:break
                  print('CONTEXT',needle,js[max(0,i-3500):i+6000])
                  start=i+len(needle)

          for path in (
              '/api/ClassificationCompleteMonthlyHoldings',
              '/api/CompleteMonthlyHoldings?year=2026&classification=Equity',
              '/api/CompleteMonthlyHoldings?year=2026&classification=equity',
              '/api/CompleteMonthlyHoldings?year=2026&temp=Equity',
              '/api/CompleteMonthlyHoldings?year=2026&category=Equity',
          ):
              url='https://www.invescomutualfund.com'+path
              try:
                  b=get(url);print('RESPONSE',path,b.decode('utf-8','replace')[:30000])
              except Exception as e:print('ERROR',path,repr(e))
          PY
