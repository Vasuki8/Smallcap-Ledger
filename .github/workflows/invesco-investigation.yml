name: Invesco portfolio investigation

on:
  push:
    branches: [backend/invesco-complete-portfolio-v127]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_DATA_DIR: /tmp/invesco-investigation
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect official Invesco current and prior workbooks
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          uv run --frozen python - <<'PY'
          import json
          from tracker import providers,db,disclosures,amc_reports
          db.init();disclosures.seed_sources()
          root='https://www.invescomutualfund.com'
          raw,api_hash,_=providers.fetch(root+'/api/CompleteMonthlyHoldings?year=2026&classification=equity',max_bytes=12*1024*1024)
          row=next(x for x in json.loads(raw) if str(x.get('Name') or '').strip()=='Invesco India Small Cap Fund')
          print('API_HASH',api_hash)
          for label,key in [('AUG','AugUrl'),('JUL','JulUrl')]:
              url=row[key]
              body,h,typ=providers.fetch(url,max_bytes=25*1024*1024)
              count=amc_reports.extract(body,'Invesco India Small Cap Fund',url,h)
              snap=db.one("""SELECT p.as_of,p.complete,p.hash,p.source,COUNT(h.id) positions,SUM(h.weight) weight
                FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
                WHERE p.family='Invesco India Small Cap Fund' AND p.hash=?
                GROUP BY p.id ORDER BY p.id DESC LIMIT 1""",(h,))
              aum=db.one("""SELECT as_of,value,unit FROM metrics
                WHERE family='Invesco India Small Cap Fund' AND metric='aum' AND hash=?
                ORDER BY id DESC LIMIT 1""",(h,))
              print(label,json.dumps({'url':url,'hash':h,'bytes':len(body),'type':typ,'records':count,'snapshot':snap,'aum':aum}))
          PY
