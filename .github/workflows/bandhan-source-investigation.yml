name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace Bandhan portfolio request builder
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://bandhanmutual.com/static/js/main.ce5a3574.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:text=r.read().decode('utf-8','ignore')
          for needle in ['_0x5559e2','_0x304086','monthlyHalfYearly','apiTabParamVal']:
              pos=[m.start() for m in re.finditer(re.escape(needle),text)]
              print('NEEDLE',needle,'COUNT',len(pos))
              for p in pos[-20:]:
                  print('CTX',needle,text[max(0,p-9000):p+18000].replace('\n',' ')[:27000])
          PY
