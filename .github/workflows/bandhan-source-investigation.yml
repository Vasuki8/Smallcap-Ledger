name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Trace Bandhan first-party portfolio routes
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,ssl
          from html import unescape

          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger source audit'}
          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as r:
                  return r.geturl(),r.headers.get('content-type',''),r.read()

          root='https://cmsnew.bandhanmutual.com'
          slugs=[
            'monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026',
            'monthly-and-half-yearly-bandhan-small-cap-fund-31-july-2026',
          ]
          for slug in slugs:
              url=root+'/wp-json/wp/v2/posts?slug='+urllib.parse.quote(slug)+'&_embed=1'
              try:
                  final,typ,raw=get(url)
                  rows=json.loads(raw)
                  print('POST_QUERY',slug,final,typ,'count',len(rows))
                  for p in rows:
                      print('POST_META',json.dumps({
                        'id':p.get('id'),'date':p.get('date'),'modified':p.get('modified'),
                        'slug':p.get('slug'),'link':p.get('link'),'featured_media':p.get('featured_media'),
                        'template':p.get('template'),'format':p.get('format'),
                        'meta':p.get('meta'),'acf':p.get('acf'),
                        'keys':sorted(p.keys()),
                      },ensure_ascii=False,default=str))
                      content=((p.get('content') or {}).get('rendered') or '')
                      excerpt=((p.get('excerpt') or {}).get('rendered') or '')
                      print('POST_CONTENT',content[:12000].replace('\n',' '))
                      print('POST_EXCERPT',excerpt[:3000].replace('\n',' '))
                      print('POST_LINKS',json.dumps(p.get('_links'),ensure_ascii=False,default=str)[:15000])
                      emb=p.get('_embedded')
                      print('POST_EMBED',json.dumps(emb,ensure_ascii=False,default=str)[:20000])
                      urls=sorted(set(unescape(x) for x in re.findall(r'https?://[^"\'<>\s]+|/[^"\'<>\s]+\.(?:xlsx?|xls|xml|pdf)(?:\?[^"\'<>\s]*)?',content,re.I)))
                      print('CONTENT_URLS',json.dumps(urls,ensure_ascii=False))
                      pid=p.get('id')
                      for endpoint in [
                        f'{root}/wp-json/wp/v2/media?parent={pid}&per_page=100',
                        f'{root}/wp-json/wp/v2/posts/{pid}?_embed=1',
                      ]:
                          try:
                              ff,tt,rr=get(endpoint)
                              obj=json.loads(rr)
                              print('RELATED',endpoint,json.dumps(obj,ensure_ascii=False,default=str)[:30000])
                          except Exception as e:
                              print('RELATED_ERROR',endpoint,repr(e))
              except Exception as e:
                  print('POST_ERROR',slug,repr(e))

          searches=['Bandhan Small Cap','Small Cap Fund','31 August 2026','31 July 2026']
          for q in searches:
              endpoint=(root+'/wp-json/wp/v2/media?search='+urllib.parse.quote(q)+
                        '&after=2026-08-01T00:00:00&before=2026-09-15T23:59:59&per_page=100')
              try:
                  ff,tt,rr=get(endpoint);rows=json.loads(rr)
                  print('MEDIA_SEARCH',q,'count',len(rows))
                  for m in rows:
                      print('MEDIA',json.dumps({
                        'id':m.get('id'),'date':m.get('date'),'modified':m.get('modified'),
                        'slug':m.get('slug'),'parent':m.get('post'),'mime_type':m.get('mime_type'),
                        'source_url':m.get('source_url'),
                        'title':(m.get('title') or {}).get('rendered'),
                        'caption':(m.get('caption') or {}).get('rendered'),
                        'description':(m.get('description') or {}).get('rendered'),
                      },ensure_ascii=False,default=str))
              except Exception as e:
                  print('MEDIA_SEARCH_ERROR',q,repr(e))

          try:
              ff,tt,rr=get(root+'/wp-json/')
              obj=json.loads(rr)
              routes=[k for k in (obj.get('routes') or {}) if re.search(r'portfolio|download|media|document|attachment|scheme',k,re.I)]
              print('WP_ROUTES',json.dumps(routes[:500],ensure_ascii=False))
          except Exception as e:
              print('WP_ROOT_ERROR',repr(e))

          for page in [
              'https://bandhanmutual.com/mutual-funds',
              'https://bandhanmutual.com/mutual-funds/equity-funds',
              'https://bandhanmutual.com/mutual-funds/equity-funds/bandhan-small-cap-fund/regular',
              'https://bandhanmutual.com/mutual-funds/equity-funds/bandhan-small-cap-fund/direct',
          ]:
              try:
                  ff,tt,rr=get(page);text=rr.decode('utf-8','ignore')
                  print('FUND_PAGE',page,'FINAL',ff,'TYPE',tt,'BYTES',len(rr))
                  matches=sorted(set(unescape(x) for x in re.findall(r'https?://[^"\'<>\s]+|/[^"\'<>\s]+',text)
                                     if re.search(r'portfolio|small-cap|smallcap|download',x,re.I)))
                  print('FUND_PAGE_MATCHES',json.dumps(matches[:500],ensure_ascii=False))
                  for needle in ['Latest Portfolio','latestPortfolio','portfolio','small-cap-fund']:
                      pos=text.lower().find(needle.lower())
                      if pos>=0:
                          print('FUND_PAGE_CONTEXT',needle,text[max(0,pos-1800):pos+5000].replace('\n',' ')[:7000])
              except Exception as e:
                  print('FUND_PAGE_ERROR',page,repr(e))
          PY
