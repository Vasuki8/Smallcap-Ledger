name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect exact Bandhan August post HTML
        run: |
          python - <<'PY'
          import urllib.request,re,json
          from urllib.parse import urljoin
          url='https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
          try:
              with urllib.request.urlopen(req,timeout=40) as r:
                  raw=r.read();final=r.geturl();typ=r.headers.get('content-type','')
              print('PAGE',final,typ,len(raw))
              text=raw.decode('utf-8','ignore')
              print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:3])
              attrs=[]
              for tag in re.findall(r'<(?:a|button|iframe|embed|object|input|form)[^>]*>',text,re.I):
                  if re.search(r'href|src|data-|action|download|file|url',tag,re.I):
                      attrs.append(tag[:2500])
              print('ATTR_COUNT',len(attrs))
              for x in attrs:print('ATTR',x)
              urls=sorted(set(re.findall(r'https?://[^"\'<>\s]+|/[^"\'<>\s]+',text)))
              for x in urls:
                  if re.search(r'xlsx?|xls|xml|pdf|portfolio|download|media|storage|wp-json|api',x,re.I):
                      print('URL',x)
              for needle in ['portfolio','attachment','download','file','document','acf','wp-json','storage.googleapis']:
                  for m in list(re.finditer(needle,text,re.I))[:20]:
                      print('CTX',needle,text[max(0,m.start()-1000):m.end()+2500].replace('\n',' ')[:3600])
          except Exception as e:
              print('ERROR',repr(e))
          PY
