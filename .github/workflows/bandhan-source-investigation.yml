name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Bandhan post inline download configuration
        run: |
          python - <<'PY'
          import urllib.request,re,json,html
          url='https://cmsnew.bandhanmutual.com/monthly-and-half-yearly-bandhan-small-cap-fund-31-august-2026/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
          with urllib.request.urlopen(req,timeout=35) as r:text=r.read().decode('utf-8','ignore')
          print('POST_ID',re.findall(r'postid-(\d+)',text)[:5])
          scripts=re.findall(r'<script([^>]*)>([\s\S]*?)</script>',text,re.I)
          for attrs,body in scripts:
              blob=attrs+' '+body
              if re.search(r'excel|download|ajax|nonce|post[_-]?id|attachment|file',blob,re.I):
                  print('SCRIPT_BLOCK',attrs[:2000],body[:16000].replace('\n',' '))
          for pat in [
              r'ajaxurl[^;\n<]{0,1000}',r'admin-ajax\.php[^"\'\s<]{0,1000}',
              r'nonce[^;\n<]{0,1000}',r'excel[^;\n<]{0,1500}',
              r'download[^;\n<]{0,1500}',r'post[_-]?id[^;\n<]{0,1000}'
          ]:
              for m in re.finditer(pat,text,re.I):
                  print('MATCH',pat,html.unescape(text[max(0,m.start()-700):m.end()+1800]).replace('\n',' ')[:3000])
          PY
