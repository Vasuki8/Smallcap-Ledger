name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Trace Bandhan live-site portfolio API
        run: |
          python - <<'PY'
          import json,re,urllib.request,ssl
          from html import unescape
          from urllib.parse import urljoin

          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger source audit'}
          def get(url,max_bytes=12_000_000):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=35,context=ssl.create_default_context()) as r:
                  return r.geturl(),r.headers.get('content-type',''),r.read(max_bytes)

          pages=[
              'https://bandhanmutual.com/mutual-funds',
              'https://bandhanmutual.com/mutual-funds/equity-funds',
              'https://bandhanmutual.com/mutual-funds/equity-funds/bandhan-small-cap-fund/regular',
          ]
          scripts={}
          for page in pages:
              try:
                  final,typ,raw=get(page)
                  text=raw.decode('utf-8','ignore')
                  print('PAGE',page,'FINAL',final,'TYPE',typ,'BYTES',len(raw))
                  srcs=[urljoin(final,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I)]
                  links=[urljoin(final,x) for x in re.findall(r'<link[^>]+href=["\']([^"\']+)["\']',text,re.I)]
                  print('SCRIPTS',json.dumps(srcs,ensure_ascii=False))
                  print('LINKS',json.dumps([x for x in links if re.search(r'\.js(?:\?|$)|manifest|chunk|asset',x,re.I)],ensure_ascii=False))
                  for src in srcs:scripts[src]=True
              except Exception as e:
                  print('PAGE_ERROR',page,repr(e))

          for src in list(scripts)[:80]:
              try:
                  final,typ,raw=get(src)
                  text=raw.decode('utf-8','ignore')
                  print('SCRIPT',src,'FINAL',final,'TYPE',typ,'BYTES',len(raw))
                  for pat in [
                      r'Latest Portfolio',r'latest.?portfolio',r'portfolio',r'cmsnew',
                      r'wp-json',r'download',r'api/',r'fund.?details?',r'holding'
                  ]:
                      found=[]
                      for m in re.finditer(pat,text,re.I):
                          ctx=text[max(0,m.start()-900):m.end()+2200]
                          if ctx not in found:found.append(ctx)
                          if len(found)>=12:break
                      for ctx in found:
                          print('SCRIPT_CONTEXT',pat,ctx.replace('\n',' ')[:3200])
                  urls=sorted(set(unescape(x) for x in re.findall(r'https?://[^"\'<>\s]+',text)
                                  if re.search(r'api|portfolio|download|cmsnew|bandhan',x,re.I)))
                  if urls:print('SCRIPT_URLS',json.dumps(urls[:500],ensure_ascii=False))
              except Exception as e:
                  print('SCRIPT_ERROR',src,repr(e))
          PY
