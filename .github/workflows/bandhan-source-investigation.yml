name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Trace Bandhan source-map portfolio service
        run: |
          python - <<'PY'
          import json,re,urllib.request,ssl

          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger source audit'}
          def get(url,max_bytes=80_000_000):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:
                  return r.geturl(),r.headers.get('content-type',''),r.read(max_bytes)

          js='https://bandhanmutual.com/static/js/main.ce5a3574.js'
          try:
              final,typ,raw=get(js,15_000_000)
              text=raw.decode('utf-8','ignore')
              tail=text[-1200:]
              print('JS',len(raw),tail)
              maps=re.findall(r'sourceMappingURL=([^\s*]+)',tail)
              print('MAP_REF',json.dumps(maps))
          except Exception as e:
              print('JS_ERROR',repr(e));maps=[]

          candidates=[]
          for m in maps or ['main.ce5a3574.js.map']:
              candidates.append('https://bandhanmutual.com/static/js/'+m.rsplit('/',1)[-1])
          for url in candidates:
              try:
                  final,typ,raw=get(url)
                  print('MAP',url,'FINAL',final,'TYPE',typ,'BYTES',len(raw))
                  obj=json.loads(raw)
                  sources=obj.get('sources') or []
                  contents=obj.get('sourcesContent') or []
                  print('SOURCE_COUNT',len(sources),len(contents))
                  needles=[
                    'scheme-portfolios','portfolio-index-etf-disclosures','Latest Portfolio',
                    'latest portfolio','monthly-and-half-yearly','wp-json','cmsnew.bandhanmutual.com',
                    'schemePortfolio','portfolioDisclosure','portfolio'
                  ]
                  seen=0
                  for idx,src in enumerate(sources):
                      body=contents[idx] if idx<len(contents) and contents[idx] else ''
                      if not body:continue
                      hits=[n for n in needles if n.lower() in body.lower()]
                      if not hits:continue
                      print('SOURCE_HIT',idx,src,json.dumps(hits))
                      for n in hits:
                          pos=body.lower().find(n.lower())
                          if pos>=0:
                              print('SOURCE_CONTEXT',n,body[max(0,pos-2500):pos+8000].replace('\n',' ')[:10500])
                      urls=sorted(set(re.findall(r'https?://[^"\'\s<>]+|/[A-Za-z0-9_?&=.%/{}/:-]{4,}',body)))
                      urls=[x for x in urls if re.search(r'api|portfolio|download|cms|scheme|document',x,re.I)]
                      if urls:print('SOURCE_URLS',json.dumps(urls[:300],ensure_ascii=False))
                      seen+=1
                      if seen>=40:break
              except Exception as e:
                  print('MAP_ERROR',url,repr(e))
          PY
