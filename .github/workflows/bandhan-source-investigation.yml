name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Extract Bandhan scheme-portfolio component call sites
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://bandhanmutual.com/static/js/main.ce5a3574.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=40) as r:text=r.read().decode('utf-8','ignore')
          for needle in ['_0x5559e2','_0x304086']:
              pos=[m.start() for m in re.finditer(re.escape(needle),text)]
              print('POSITIONS',needle,pos)
              for n,p in enumerate(pos):
                  ctx=text[max(0,p-3500):p+8000]
                  ctx=re.sub(r'data:image/[^,]+,[A-Za-z0-9+/=]{100,}','[DATA_URI]',ctx)
                  print('CALLSITE',needle,n,ctx.replace('\n',' ')[:11500])
          PY
