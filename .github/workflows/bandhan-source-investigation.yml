name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Locate Bandhan disclosure API calls in live bundle
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://bandhanmutual.com/static/js/main.ce5a3574.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/javascript'})
          with urllib.request.urlopen(req,timeout=40) as r:text=r.read().decode('utf-8','ignore')
          needles=['finance-api/v1/posts/disclosures','posts/disclosures','scheme-portfolios','portfolio-index-etf-disclosures']
          for needle in needles:
              positions=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
              print('NEEDLE',needle,'COUNT',len(positions))
              for pos in positions[:30]:
                  print('CTX',needle,text[max(0,pos-7000):pos+12000].replace('\n',' ')[:19000])
          PY
