name: Bandhan source investigation

on:
  push:
    branches: [backend/bandhan-portfolio-v129]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Bandhan custom Excel download plugin
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://cmsnew.bandhanmutual.com/wp-content/plugins/custom-excel-download/js/custom-excel-download.js?ver=1.0'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/javascript'})
          with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read();print('SCRIPT',r.geturl(),r.headers.get('content-type'),len(raw))
          text=raw.decode('utf-8','ignore')
          print('CONTENT',text[:30000])
          for x in sorted(set(re.findall(r'https?://[^"\'<>\s]+|/[A-Za-z0-9_?&=.%/{}/:-]{4,}',text))):
              if re.search(r'api|ajax|excel|download|post|file|attachment|wp-json',x,re.I):print('URL',x)
          PY
