name: Inspect JM TER disclosure

on:
  push:
    branches: [backend/jm-ter-v133]
    paths: [.github/workflows/inspect-jm-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect JM TER request contract
        run: |
          uv run --frozen python - <<'PY'
          import json,re,urllib.request
          import httpx
          base='https://jmmfapi.jmfinancialmf.com/api/'
          page='https://www.jmfinancialmf.com/Scheme-Expense-Ratio'
          js='https://www.jmfinancialmf.com/static/js/main.d8e32c01.js'

          with httpx.Client(timeout=45,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}) as client:
              for name,body in [
                  ('GetTerPageDropDown',{'IICategory':0}),
                  ('GetTerPageLatest',{'IICategory':0,'IVFundCode':''}),
              ]:
                  r=client.post(base+name,json=body)
                  print('POST_JSON',name,r.status_code,r.headers.get('content-type'),repr(r.text[:1000]))
                  r=client.post(base+name,data=body)
                  print('POST_FORM',name,r.status_code,r.headers.get('content-type'),repr(r.text[:1000]))

          req=urllib.request.Request(js,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              s=r.read().decode('utf-8','ignore')
          for needle in ['function At','const At','var At','At=function','axios.create','Content-Type','application/json','JSON.stringify']:
              print('NEEDLE',needle)
              p=0;n=0
              while True:
                  p=s.find(needle,p)
                  if p<0 or n>=20:break
                  ctx=re.sub(r'\s+',' ',s[max(0,p-2200):p+4000])
                  if 'axios' in ctx.lower() or 'At' in ctx or 'content-type' in ctx.lower():
                      print('CTX',ctx[:6400])
                  p+=len(needle);n+=1
          PY
