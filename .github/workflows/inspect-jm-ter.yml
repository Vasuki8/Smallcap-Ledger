name: Inspect JM TER disclosure

on:
  push:
    branches: [backend/jm-ter-v133]
    paths: [.github/workflows/inspect-jm-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Query JM public TER dropdown and latest rows
        run: |
          uv run --frozen python - <<'PY'
          import json
          from tracker.providers import fetch
          from tracker.jm_portfolios import API_BASE,_decrypt

          def call(name,body):
              raw,_,typ=fetch(API_BASE+name,body=body,archive=False,max_bytes=4*1024*1024)
              print('CALL',name,'TYPE',typ,'RAW_BYTES',len(raw))
              data=_decrypt(raw)
              print('DECRYPTED_TYPE',type(data).__name__,'COUNT',len(data) if isinstance(data,list) else None)
              return data

          drops=call('GetTerPageDropDown',{'IICategory':0})
          print('DROPDOWN')
          for row in drops if isinstance(drops,list) else []:
              if 'small' in json.dumps(row).lower() or 'cap' in json.dumps(row).lower():
                  print('DROP_ROW',json.dumps(row,sort_keys=True,ensure_ascii=False,default=str))

          # First inspect the unfiltered current table exactly as the browser does.
          latest=call('GetTerPageLatest',{'IICategory':0,'IVFundCode':''})
          print('LATEST_MATCHES')
          for row in latest if isinstance(latest,list) else []:
              if 'jm small cap fund' in json.dumps(row).lower():
                  print('TER_ROW',json.dumps(row,sort_keys=True,ensure_ascii=False,default=str))
          PY
