name: Recovery source-change watch validation

on:
  push:
    branches: [backend/recovery-source-change-watch-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Compile and test
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Restore production checkpoint
        run: uv run --frozen python scripts/github_state.py restore
      - name: Verify current blockers remain closed without new evidence
        run: |
          uv run --frozen python - <<'PY'
          from datetime import date
          from tracker import coverage
          from tracker.portfolio_recovery_queue import report

          cov=coverage.report()
          assert cov['counts']['ter']==36,cov['counts']
          assert cov['counts']['base_expense_ratio']==36,cov['counts']
          assert cov['counts']['portfolio_complete']==29,cov['counts']
          axis=next(x for x in cov['funds'] if x['family']=='Axis Small Cap Fund')
          assert axis['portfolio_complete']
          assert axis['portfolio']['positions']>=130
          assert axis['portfolio']['as_of']=='2026-08-31'

          queue=report(today=date(2026,9,25))
          assert queue['summary']['items']==7,queue['summary']
          assert queue['summary']['actionable_now']==0,queue['summary']
          assert queue['summary']['source_changes_detected']==0,queue['summary']
          assert queue['next_recovery_target'] is None,queue['next_recovery_target']
          assert queue['summary']['actions']=={
              'retry_after_source_change':4,
              'requires_more_precise_amc_disclosure':3,
          },queue['summary']['actions']
          for family in (
              'Union Small Cap Fund','Bajaj Finserv Small Cap Fund',
              'Edelweiss Small Cap Fund','ICICI Prudential Small Cap Fund',
          ):
              item=next(x for x in queue['items'] if x['family']==family)
              assert item['action']=='retry_after_source_change',(family,item)
              assert not item['actionable_now'],(family,item)
              watch=item['source_change_watch']
              assert watch is not None,family
              assert not watch['changed'],(family,watch)
              assert watch['reviewed_at'],family
          print('COUNTS',cov['counts'])
          print('QUEUE',queue['summary'])
          for item in queue['items']:
              watch=item.get('source_change_watch')
              print('WATCH',item['family'],item['action'],
                    None if watch is None else {
                        'reviewed_at':watch['reviewed_at'],
                        'changed':watch['changed'],
                        'reason':watch['change_reason'],
                        'latest':watch['latest_watch_evidence_at'],
                    })
          PY
