name: Inspect Invesco TER disclosure

on:
  push:
    branches: [backend/invesco-ter-v132]
    paths: [.github/workflows/inspect-invesco-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace Invesco TER component API
        run: |
          python - <<'PY'
          import re,urllib.parse,urllib.request
          page='https://www.invescomutualfund.com/statutory-disclosures/ter-mutual-fund-since-2026/ter'
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read(); print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl()); return b,r.geturl()
          html,final=fetch(page); text=html.decode('utf-8','ignore')
          scripts=[urllib.parse.urljoin(final,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)]
          print('SCRIPT_COUNT',len(scripts))
          needles=['No disclosures available for the selected year and month','0 results for','ter-mutual-fund-since-2026','Total Expense Ratio','statutory-results-panel']
          for full in scripts:
              try:b,_=fetch(full)
              except Exception as e: print('SCRIPT_ERROR',full,e); continue
              s=b.decode('utf-8','ignore')
              if not any(n.lower() in s.lower() for n in needles): continue
              print('SCRIPT_MATCH',full,'LEN',len(s))
              for needle in needles + ['/api/','fetch(']:
                  p=0;n=0
                  while True:
                      p=s.lower().find(needle.lower(),p)
                      if p<0 or n>=35: break
                      print('CTX',needle,re.sub(r'\s+',' ',s[max(0,p-1800):p+3500])[:5600])
                      p+=len(needle);n+=1
          PY
