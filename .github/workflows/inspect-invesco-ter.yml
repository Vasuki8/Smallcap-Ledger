name: Inspect Invesco TER disclosure

on:
  push:
    branches: [backend/invesco-ter-v132]
    paths: [.github/workflows/inspect-invesco-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Locate Invesco TER API
        run: |
          python - <<'PY'
          import re,urllib.parse,urllib.request
          page='https://www.invescomutualfund.com/statutory-disclosures/ter-mutual-fund-since-2026/ter'
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read();print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl());return b,r.geturl()
          html,final=fetch(page);shtml=html.decode('utf-8','ignore')
          scripts=[urllib.parse.urljoin(final,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',shtml,re.I)]
          print('SCRIPTS',len(scripts))
          for full in scripts:
              try:b,_=fetch(full)
              except Exception as e:print('SCRIPT_ERROR',full,e);continue
              s=b.decode('utf-8','ignore')
              low=s.lower()
              if not any(n in low for n in ['ter-mutual-fund','total expense ratio','expenseratio','expense ratio']):
                  continue
              print('SCRIPT_MATCH',full,'LEN',len(s))
              # Print fetch/API calls near TER component strings.
              for m in re.finditer(r'fetch\(([^)]{1,300})\)',s):
                  ctx=s[max(0,m.start()-1200):m.end()+1600]
                  if re.search(r'ter|expense',ctx,re.I):
                      print('FETCH_CTX',re.sub(r'\s+',' ',ctx)[:3200])
              for needle in ['ter-mutual-fund-since-2026','Total Expense Ratio','ExpenseRatioDisclosure','ExpenseRatio','TERData','/api/']:
                  p=0;n=0
                  while True:
                      p=low.find(needle.lower(),p)
                      if p<0 or n>=20:break
                      print('CTX',needle,re.sub(r'\s+',' ',s[max(0,p-1400):p+2600])[:4200])
                      p+=len(needle);n+=1
          # Look for exact API-looking string literals across the page/bootstrap too.
          joined=shtml
          vals=sorted(set(re.findall(r'["\']([^"\']*(?:api|ter|expense)[^"\']*)["\']',joined,re.I)))
          print('PAGE_STRINGS')
          for v in vals[:250]: print(repr(v[:500]))
          PY
