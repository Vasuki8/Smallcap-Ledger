name: Inspect Invesco TER disclosure

on:
  push:
    branches: [backend/invesco-ter-v132]
    paths: [.github/workflows/inspect-invesco-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Isolate Invesco TER component
        run: |
          python - <<'PY'
          import re,urllib.parse,urllib.request
          page='https://www.invescomutualfund.com/statutory-disclosures/ter-mutual-fund-since-2026/ter'
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:return r.read(),r.geturl()
          html,final=fetch(page);html=html.decode('utf-8','ignore')
          scripts=[urllib.parse.urljoin(final,x) for x in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',html,re.I)]
          terms=[
            'Total Expense Ratio (TER) Since 1st April 2026',
            'Total Expense Ratio Of Mutual Fund Scheme - Till March 31, 2026',
            'Regular Plan - Total TER',
            'Direct Plan - Total TER',
            'Base Expense Ratio (BER)',
            'Brokerage cost',
          ]
          for full in scripts:
              try:b,_=fetch(full)
              except Exception:continue
              s=b.decode('utf-8','ignore')
              for term in terms:
                  p=s.find(term)
                  if p<0:continue
                  print('FOUND',full,term,'AT',p)
                  ctx=s[max(0,p-9000):p+14000]
                  print('CONTEXT_BEGIN')
                  print(re.sub(r'\s+',' ',ctx))
                  print('CONTEXT_END')
          PY
