name: Validate Invesco TER collector

on:
  push:
    branches: [backend/invesco-ter-v132]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python -m compileall -q tracker scripts tests
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Verify live Invesco Small Cap TER disclosure
        run: |
          uv run --frozen python - <<'PY'
          from datetime import date
          from tracker import amc_expenses,db
          db.init()
          source,day,plans,content_hash=amc_expenses._invesco_disclosure(date.today())
          assert source.startswith(amc_expenses.INVESCO_TER_API+'?')
          assert set(plans)=={'Regular','Direct'}
          assert 0 <= plans['Direct']['base_expense_ratio'] <= plans['Direct']['ter'] <= 5
          assert 0 <= plans['Regular']['base_expense_ratio'] <= plans['Regular']['ter'] <= 5
          print('INVESCO_VERIFIED',day,plans)
          print('INVESCO_SOURCE',source)
          print('INVESCO_HASH',content_hash)
          PY
