name: Inspect Invesco TER disclosure

on:
  push:
    branches: [backend/invesco-ter-v132]
    paths: [.github/workflows/inspect-invesco-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Query Invesco public TER API
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          base='https://www.invescomutualfund.com'
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Referer':base+'/statutory-disclosures/ter-mutual-fund-since-2026/ter'}
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read();print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl());return json.loads(b)
          plans=fetch(base+'/api/Common/GetAllPlans')
          print('PLAN_TYPE',type(plans).__name__,'COUNT',len(plans) if isinstance(plans,list) else None)
          for row in plans if isinstance(plans,list) else []:
              if 'small' in json.dumps(row).lower() and 'cap' in json.dumps(row).lower():
                  print('PLAN_ROW',json.dumps(row,ensure_ascii=False,sort_keys=True))
          for month in (9,0):
              q=urllib.parse.urlencode({
                  'title':'Invesco India Small Cap Fund',
                  'fincialYear':2026,
                  'month':month,
              })
              data=fetch(base+'/api/TotalExpenseRatioOfMutualFundSchemePolicy/GetTERExpenseData?'+q)
              print('MONTH',month,'TYPE',type(data).__name__,'COUNT',len(data) if isinstance(data,list) else None)
              if isinstance(data,list):
                  for row in data[-20:]:
                      print('TER_ROW',json.dumps(row,ensure_ascii=False,sort_keys=True,default=str))
              else:
                  print('TER_DATA',json.dumps(data,ensure_ascii=False,sort_keys=True,default=str))
          PY
