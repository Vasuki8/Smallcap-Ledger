name: Inspect Invesco TER disclosure

on:
  push:
    branches: [backend/invesco-ter-v132]
    paths: [.github/workflows/inspect-invesco-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Extract Invesco TER component fetch logic
        run: |
          python - <<'PY'
          import re,urllib.request
          url='https://www.invescomutualfund.com/_next/static/chunks/9240-6f2168c4a7a555d2.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r:s=r.read().decode('utf-8','ignore')
          anchor=s.find('Total Expense Ratio (TER) Since 1st April 2026')
          print('ANCHOR',anchor)
          # Print the nearest named function and all fetch calls between its start and title.
          starts=[]
          for m in re.finditer(r'function\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*\(',s[:anchor]):
              starts.append((m.start(),m.group(1)))
          start,name=starts[-1]
          print('FUNCTION',name,'START',start)
          block=s[start:anchor+3000]
          print('FETCHES')
          for m in re.finditer(r'fetch\((.{0,500}?)\)',block):
              print(re.sub(r'\s+',' ',m.group(0))[:800])
          print('API_LITERALS')
          for v in sorted(set(re.findall(r'["\x27](/api/[^"\x27]+)["\x27]',block))):
              print(v)
          print('KEY_STRINGS')
          vals=sorted(set(re.findall(r'["\x27]([^"\x27]{1,180})["\x27]',block)))
          for v in vals:
              if any(k in v.lower() for k in ['ter','expense','fund','scheme','date','plan','from','to']):
                  print(repr(v))
          print('BLOCK_BEGIN')
          print(re.sub(r'\s+',' ',block[:18000]))
          print('BLOCK_END')
          PY
