name: Inspect Invesco TER disclosure

on:
  push:
    branches: [backend/invesco-ter-v132]
    paths: [.github/workflows/inspect-invesco-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Verify Invesco TER API payload
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          base='https://www.invescomutualfund.com'
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Accept':'application/json, text/plain, */*','Referer':base+'/statutory-disclosures/ter-mutual-fund-since-2026/ter'}
          def get(path):
              url=base+path
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read(); print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl()); return b
          plans=json.loads(get('/api/Common/GetAllPlans'))
          print('PLANS_TYPE',type(plans).__name__,'COUNT',len(plans) if isinstance(plans,list) else None)
          for x in plans if isinstance(plans,list) else []:
              if 'small cap' in json.dumps(x).lower():
                  print('SMALL_PLAN',json.dumps(x,ensure_ascii=False,sort_keys=True))
          for month in [0,6,7,8,9]:
              q=urllib.parse.urlencode({'title':'Invesco India Small Cap Fund','fincialYear':2026,'month':month})
              try:data=json.loads(get('/api/TotalExpenseRatioOfMutualFundSchemePolicy/GetTERExpenseData?'+q))
              except Exception as e:
                  print('API_ERROR',month,type(e).__name__,e);continue
              print('MONTH',month,'TYPE',type(data).__name__,'COUNT',len(data) if isinstance(data,list) else None)
              if isinstance(data,list):
                  for row in data[-5:]:
                      print('ROW',month,json.dumps(row,ensure_ascii=False,sort_keys=True))
              else:
                  print('DATA',month,json.dumps(data,ensure_ascii=False)[:2000])
          # Extract month map from production bundle.
          js=get('/_next/static/chunks/9240-6f2168c4a7a555d2.js').decode('utf-8','ignore')
          anchor=js.find('function J(){')
          pre=js[max(0,anchor-5000):anchor]
          print('MONTH_MAP_CONTEXT',re.sub(r'\s+',' ',pre))
          PY
