name: Inspect Invesco TER disclosure

on:
  push:
    branches: [backend/invesco-ter-v132]
    paths: [.github/workflows/inspect-invesco-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace Invesco statutory TER page
        run: |
          python - <<'PY'
          import re,urllib.parse,urllib.request
          urls=[
            'https://www.invescomutualfund.com/aboutus?tab=Statutory&active=ExpenseRatioDisclosure',
            'https://www.invescomutualfund.com/about-us?tab=Statutory&active=ExpenseRatioDisclosure',
            'https://www.invescomutualfund.com/statutory-disclosures/risk-meter',
          ]
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          seen_scripts=set()
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read();print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl());return b,r.geturl()
          pages=[]
          for u in urls:
              try:
                  b,final=fetch(u)
              except Exception as e:
                  print('PAGE_ERROR',u,type(e).__name__,e);continue
              html=b.decode('utf-8','ignore');pages.append((html,final))
              print('PAGE_TITLE',re.findall(r'<title[^>]*>(.*?)</title>',html,re.I|re.S)[:1])
              for m in re.finditer(r'.{0,220}(?:ExpenseRatioDisclosure|Total Expense Ratio|statutory-disclosures|expense ratio).{0,500}',html,re.I|re.S):
                  print('PAGE_CTX',re.sub(r'\s+',' ',m.group(0))[:900])
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
                  seen_scripts.add(urllib.parse.urljoin(final,src))
          print('SCRIPT_COUNT',len(seen_scripts))
          for full in sorted(seen_scripts):
              try:b,_=fetch(full)
              except Exception as e:
                  print('SCRIPT_ERROR',full,type(e).__name__,e);continue
              s=b.decode('utf-8','ignore')
              if not re.search(r'ExpenseRatioDisclosure|Total Expense Ratio|expense.?ratio|statutory|api/',s,re.I):
                  continue
              print('SCRIPT_MATCH',full,'LEN',len(s))
              for needle in ['ExpenseRatioDisclosure','Total Expense Ratio','expenseRatio','expense-ratio','statutory','api/']:
                  p=0;n=0
                  while True:
                      p=s.lower().find(needle.lower(),p)
                      if p<0 or n>=25:break
                      print('CTX',needle,re.sub(r'\s+',' ',s[max(0,p-1000):p+2200])[:3400])
                      p+=len(needle);n+=1
          PY
