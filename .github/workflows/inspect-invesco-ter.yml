name: Inspect Invesco TER disclosure

on:
  push:
    branches: [backend/invesco-ter-v132]
    paths: [.github/workflows/inspect-invesco-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Extract Invesco TER endpoint candidates
        run: |
          python - <<'PY'
          import re,urllib.parse,urllib.request
          page='https://www.invescomutualfund.com/statutory-disclosures/ter-mutual-fund-since-2026/ter'
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:return r.read(),r.geturl()
          html,final=fetch(page);html=html.decode('utf-8','ignore')
          scripts=[urllib.parse.urljoin(final,x) for x in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',html,re.I)]
          candidates=set(); snippets=[]
          for full in scripts:
              try:b,_=fetch(full)
              except Exception:continue
              s=b.decode('utf-8','ignore')
              if not re.search(r'Total Expense Ratio|ter-mutual-fund|expense.?ratio',s,re.I):continue
              for v in re.findall(r'["\x27](/api/[^"\x27]+)["\x27]',s):
                  candidates.add(v)
              for term in ['Total Expense Ratio','ter-mutual-fund-since-2026','TER since','Base Expense Ratio','BER']:
                  pos=0
                  while True:
                      pos=s.lower().find(term.lower(),pos)
                      if pos<0:break
                      ctx=s[max(0,pos-2500):pos+4000]
                      apis=sorted(set(re.findall(r'/api/[A-Za-z0-9_?=&.:%/+-]+',ctx)))
                      strs=sorted(set(re.findall(r'["\x27]([^"\x27]{1,120})["\x27]',ctx)))
                      interesting=[x for x in strs if 'ter' in x.lower() or 'expense' in x.lower()]
                      if apis or interesting:
                          snippets.append((full,term,apis,interesting[:30]))
                      pos+=len(term)
          print('ALL_API_CANDIDATES')
          for x in sorted(candidates):
              if re.search(r'ter|expense|ratio|disclos',x,re.I): print(x)
          print('TARGET_SNIPPETS')
          seen=set()
          for item in snippets:
              key=(item[0],tuple(item[2]),tuple(item[3]))
              if key in seen:continue
              seen.add(key)
              print('SCRIPT',item[0])
              print('TERM',item[1])
              print('APIS',item[2])
              print('STRINGS',item[3])
          PY
