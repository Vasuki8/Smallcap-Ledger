name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Extract ICICI downloads service calls
        run: |
          python - <<'PY'
          import re,urllib.request
          req=urllib.request.Request('https://www.icicipruamc.com/static/js/index.1t6HhxO5.js',
                                     headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=20) as r:js=r.read().decode('utf-8','replace')
          needles=['APIUrl.downloadData','APIUrl.downloadCategoryData','/nms/v1/downloads/files']
          for needle in needles:
              ms=list(re.finditer(re.escape(needle),js))
              print('NEEDLE',needle,'COUNT',len(ms))
              for m in ms[:20]:
                  i=m.start(); print('CTX',js[max(0,i-5000):i+10000])
          PY
