name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Resolve ICICI downloads API contract
        run: |
          python - <<'PY'
          import re,urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:return r.read().decode('utf-8','replace')
          index=get('https://www.icicipruamc.com/static/js/index.1t6HhxO5.js')
          for needle in ('/news-and-media/downloads','downloadCategoryData','downloadData','OtherSchemeDisclosures',
                         'Monthly Portfolio Disclosures','nms/v1/downloads'):
              start=0;count=0
              while count<18:
                  i=index.find(needle,start)
                  if i<0:break
                  frag=index[max(0,i-4500):i+8500]
                  print('CONTEXT',needle,frag)
                  start=i+len(needle);count+=1
          # Print all static chunk names near the route definition.
          i=index.find('/news-and-media/downloads')
          if i>=0:print('ROUTE_CONTEXT',index[max(0,i-10000):i+16000])
          PY
