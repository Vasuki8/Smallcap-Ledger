name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Trace ICICI portfolio ZIP redirect
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          path='/downloads/Files/Monthly%20Portfolio%20Disclosures/2026/Aug/Monthly-Portfolio-Disclosure-August-2026.zip'
          urls=[
              'https://www.icicipruamc.com'+path,
              'https://archive.icicipruamc.com'+path,
              'https://apimf.icicipruamc.com'+path,
              'https://www.beta.icicipruamc.com'+path,
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with opener.open(req,timeout=20) as r:
                      body=r.read(256)
                      print('RESULT',url,r.status,r.headers.get('Content-Type'),r.headers.get('Location'),len(body),body[:32].hex())
              except urllib.error.HTTPError as e:
                  print('HTTP',url,e.code,e.headers.get('Content-Type'),e.headers.get('Location'))
                  try:print('HTTP_BODY',e.read(400).decode('utf-8','replace'))
                  except:pass
              except Exception as e:
                  print('ERROR',url,repr(e))
          PY
