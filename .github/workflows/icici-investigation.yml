name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Query portfolio-related ICICI statutory files
        run: |
          python - <<'PY'
          import urllib.request,uuid,json,re
          common={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
                  'Content-Type':'application/json','Origin':'https://www.icicipruamc.com',
                  'Referer':'https://www.icicipruamc.com/about-us/statutory-disclosures',
                  'env':'api','baggage':''}
          base='https://apimf.icicipruamc.com'
          def request(url,method='GET',body=None):
              headers=dict(common);headers['requestAPIId']=str(uuid.uuid4())
              data=json.dumps(body).encode() if body is not None else None
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read();print('FETCH',method,url,r.status,r.headers.get('Content-Type'),len(b))
                      return json.loads(b.decode('utf-8','replace'))
              except Exception as e:
                  print('ERROR',method,url,repr(e))
                  if getattr(e,'read',None):
                      try:print('ERROR_BODY',e.read().decode('utf-8','replace')[:30000])
                      except:pass
                  return {}
          trees=[]
          for disclosure in ('','STATUTORY_DISCLOSURES'):
              url=base+'/fds/v1/categories?userType=Investor'
              if disclosure:url+='&disclosureType='+disclosure
              data=request(url)
              rows=((data.get('success') or {}).get('data') or [])
              trees.extend(rows)
          matches=[]
          for cat in trees:
              catblob=json.dumps(cat,ensure_ascii=False)
              for sub in cat.get('subCategory') or []:
                  blob=' '.join([
                    str(cat.get('internalName') or ''),
                    str((cat.get('title') or {}).get('text') or ''),
                    str(sub.get('internalName') or ''),
                    str((sub.get('title') or {}).get('text') or ''),
                  ])
                  if re.search(r'portfolio|monthly|scheme disclosure|holding',blob,re.I):
                      row={'parent_id':cat.get('id'),'parent_title':cat.get('title'),
                           'type':cat.get('type'),'sub':sub}
                      if row not in matches:matches.append(row)
          print('MATCHES',json.dumps(matches,ensure_ascii=False,indent=2)[:120000])

          # Replay exact Financials controller payload for every plausible portfolio subcategory.
          for row in matches:
              sub=row['sub']; sid=sub.get('id')
              title=str((sub.get('title') or {}).get('text') or '')
              if not sid or not re.search(r'portfolio|holding',title+' '+str(sub.get('internalName') or ''),re.I):
                  continue
              filters=[]
              for filt in sub.get('filter') or []:
                  key=str((filt.get('key') or {}).get('code') or '')
                  if key=='FINANCIAL_YEAR':
                      vals=[v.get('code') for v in filt.get('value') or [] if v.get('code')=='2026-2027']
                      if vals:filters.append({key:vals})
              body={'categoryId':sid,'userType':'Investor','fileType':'All',
                    'page':'1','size':'50','filter':filters,'search':''}
              print('REQUEST',title,json.dumps(body,sort_keys=True))
              out=request(base+'/fds/v1/files','POST',body)
              print('FILES',title,json.dumps(out,ensure_ascii=False)[:100000])
          PY
