name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Resolve ICICI disclosure API endpoints
        run: |
          python - <<'PY'
          import re,urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:return r.read().decode('utf-8','replace')
          service=get('https://www.icicipruamc.com/static/js/financialsDisclosuresService.DfjThF0F.js')
          print('SERVICE_FULL',service)
          index=get('https://www.icicipruamc.com/static/js/index.1t6HhxO5.js')
          for needle in ('financialsCategoryData','financialsData','getTrackingDetails','downloadTrackingDetails',
                         'apimf.icicipruamc.com','STATUTORY_DISCLOSURES'):
              start=0;count=0
              while count<12:
                  i=index.find(needle,start)
                  if i<0:break
                  print('INDEX_CONTEXT',needle,index[max(0,i-3000):i+5000])
                  start=i+len(needle);count+=1
          # Locate lazy component/module names that invoke the financials service.
          for m in re.finditer(r'static/js/[^"\']+\.js',index):
              val=m.group(0)
              if any(x in val.lower() for x in ('financial','disclosure','download')):
                  print('MODULE_TOKEN',val)
          PY
