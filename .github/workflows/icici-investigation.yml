name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Map ICICI downloads route to lazy chunk
        run: |
          python - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://www.icicipruamc.com/static/js/index.1t6HhxO5.js',
                                     headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=20) as r:js=r.read().decode('utf-8','replace')
          for needle in ('/news-and-media/downloads','NEWS_MEDIA_DOWNLOADS'):
              positions=[m.start() for m in re.finditer(re.escape(needle),js)]
              print('NEEDLE',needle,'POSITIONS',positions)
              for pos in positions:
                  lo=max(0,pos-25000);hi=min(len(js),pos+25000);frag=js[lo:hi]
                  imports=[]
                  for m in re.finditer(r'import\(["\']\.\/([^"\']+\.js)["\']\)',frag):
                      if m.group(1) not in imports:imports.append(m.group(1))
                  tokens=[]
                  for m in re.finditer(r'static/js/[A-Za-z0-9_.~%+@()\-]+\.js',frag):
                      if m.group(0) not in tokens:tokens.append(m.group(0))
                  print('ROUTE_IMPORTS',imports)
                  print('ROUTE_TOKENS',tokens[-80:])
                  # print concise local route code, whitespace collapsed
                  local=re.sub(r'\s+',' ',js[max(0,pos-5000):pos+8000])
                  print('LOCAL',local)
          PY
