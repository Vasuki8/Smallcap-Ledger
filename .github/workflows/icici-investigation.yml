name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Locate ICICI downloads page chunks and payload
        run: |
          python - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://www.icicipruamc.com/static/js/index.1t6HhxO5.js',
                                     headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=20) as r:js=r.read().decode('utf-8','replace')
          for needle in ('downloadsFormsTypes.9ulBNFmg.js','financialsDisclosuresService.DfjThF0F.js',
                         'news-and-media/downloads','Monthly Portfolio Disclosures'):
              start=0;count=0
              while count<15:
                  i=js.find(needle,start)
                  if i<0:break
                  print('AROUND',needle,js[max(0,i-12000):i+18000])
                  start=i+len(needle);count+=1
          # List download/disclosure-related JS chunk names appearing in the app manifest.
          names=[]
          for m in re.finditer(r'static/js/[A-Za-z0-9_.~%+@()\-]+\.js',js):
              v=m.group(0)
              if any(x in v.lower() for x in ('download','disclos','financial','news','media','literature')):
                  if v not in names:names.append(v)
          print('CHUNKS',names)
          PY
