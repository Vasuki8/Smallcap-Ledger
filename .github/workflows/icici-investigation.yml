name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect ICICI archive public DNS records
        run: |
          python - <<'PY'
          import urllib.request,json
          hosts=['archive.icicipruamc.com','www.archive.icicipruamc.com','archive.icicipruamc.trafficmanager.net']
          for host in hosts:
              for typ in ('A','CNAME'):
                  url=f'https://dns.google/resolve?name={host}&type={typ}'
                  req=urllib.request.Request(url,headers={'User-Agent':'SmallcapLedger/1.0','Accept':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:data=json.load(r)
                      print('DNS',host,typ,json.dumps(data,separators=(',',':'))[:20000])
                  except Exception as e:print('ERROR',host,typ,repr(e))
          PY
