name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Query ICICI public APIs with production headers
        run: |
          python - <<'PY'
          import urllib.request,uuid
          base='https://apimf.icicipruamc.com'
          common={
            'User-Agent':'Mozilla/5.0',
            'Accept':'application/json,text/plain,*/*',
            'Content-Type':'application/json',
            'Origin':'https://www.icicipruamc.com',
            'Referer':'https://www.icicipruamc.com/',
            'env':'api',
            'baggage':'',
          }
          urls=[
            base+'/nms/v1/downloads/categories',
            base+'/nms/v1/downloads/categories?userType=INVESTOR',
            base+'/fds/v1/categories?userType=INVESTOR',
            base+'/fds/v1/categories?userType=INVESTOR&disclosureType=STATUTORY_DISCLOSURES',
            base+'/fds/v1/categories?userType=investor',
          ]
          for url in urls:
              headers=dict(common);headers['requestAPIId']=str(uuid.uuid4())
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      b=r.read()
                      print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),r.geturl())
                      print('BODY',b.decode('utf-8','replace')[:50000])
              except Exception as e:
                  print('ERROR',url,repr(e))
                  if getattr(e,'read',None):
                      try:print('ERROR_BODY',e.read().decode('utf-8','replace')[:30000])
                      except Exception:pass
          PY
