name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect ICICI public API request headers
        run: |
          python - <<'PY'
          import re,urllib.request
          req=urllib.request.Request('https://www.icicipruamc.com/static/js/index.1t6HhxO5.js',
                                     headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=20) as r: js=r.read().decode('utf-8','replace')
          for needle in ('x-api-key','apikey','api-key','subscription-key','Ocp-Apim','channel','portal',
                         'Content-Type','Authorization','x-','REACT_APP_'):
              vals=[]
              for m in re.finditer(re.escape(needle),js,re.I):
                  i=m.start();frag=js[max(0,i-2200):i+5000]
                  if frag not in vals:vals.append(frag)
              print('NEEDLE',needle,'COUNT',len(vals))
              for frag in vals[:20]:print('CTX',frag)
          PY
