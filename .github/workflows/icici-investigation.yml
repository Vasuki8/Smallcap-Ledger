name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Probe valid ICICI monthly portfolio request variants
        run: |
          python - <<'PY'
          import urllib.request,uuid,json,re
          common={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
                  'Content-Type':'application/json','Origin':'https://www.icicipruamc.com',
                  'Referer':'https://www.icicipruamc.com/news-and-media/downloads',
                  'env':'api','baggage':''}
          url='https://apimf.icicipruamc.com/nms/v1/downloads/files'
          sub='26a073d7-08d2-4a95-95fa-f83a4ee51e40'
          variants=[
              {'name':'sub-only','categoryId':sub,'filter':[]},
              {'name':'sub-filter','categoryId':sub,'filter':[{'FINANCIAL_YEAR':['2026-2027']}]},
              {'name':'year-sub-filter','categoryId':'2026-2027,'+sub,'filter':[{'FINANCIAL_YEAR':['2026-2027']}]},
              {'name':'sub-year-filter','categoryId':sub+',2026-2027','filter':[{'FINANCIAL_YEAR':['2026-2027']}]},
              {'name':'sub-year-no-filter','categoryId':sub+',2026-2027','filter':[]},
          ]
          for v in variants:
              body={'categoryId':v['categoryId'],'schemeCategory':'','userType':'Investor',
                    'fileType':'All','page':'1','size':'100','filter':v['filter'],'categoryName':'OTHERS'}
              headers=dict(common);headers['requestAPIId']=str(uuid.uuid4())
              req=urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read();text=b.decode('utf-8','replace')
                      print('VARIANT',v['name'],'STATUS',r.status,'BYTES',len(b),'BODY',text[:100000])
              except Exception as e:
                  print('ERROR',v['name'],repr(e))
                  if getattr(e,'read',None):
                      try:print('ERROR_BODY',v['name'],e.read().decode('utf-8','replace')[:30000])
                      except:pass
          PY
