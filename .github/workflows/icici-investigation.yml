name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect ICICI disclosures service contract
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.parse,hashlib
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          base='https://www.icicipruamc.com/'
          files=[
            'static/js/financialsDisclosuresService.DfjThF0F.js',
            'static/js/downloadsFormsTypes.9ulBNFmg.js',
          ]
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  b=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),hashlib.sha256(b).hexdigest())
                  return b.decode('utf-8','replace')
          for path in files:
              url=urllib.parse.urljoin(base,path)
              try:js=get(url)
              except Exception as e:print('ERROR',url,repr(e));continue
              print('FILE',path)
              for needle in ('portfolio','disclosure','download','OtherScheme','Monthly','api','apimf'):
                  start=0;count=0
                  while count<20:
                      i=js.lower().find(needle.lower(),start)
                      if i<0:break
                      print('CONTEXT',needle,js[max(0,i-1800):i+4000])
                      start=i+len(needle);count+=1
              urls=[]
              for m in re.finditer(r'https?://[^"\'\s)]+|["\'][^"\']{0,220}/(?:api|v1|v2|downloads|disclosures)[^"\']{0,500}["\']',js,re.I):
                  v=m.group(0)
                  if v not in urls:urls.append(v)
              for v in urls[:120]:print('TOKEN',v[:2500])
          PY
