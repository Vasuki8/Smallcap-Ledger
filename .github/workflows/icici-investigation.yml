name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace ICICI monthly portfolio source
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          from html import unescape

          page='https://www.icicipruamc.com/news-and-media/downloads?currentTabFilter=OtherSchemeDisclosures%26%26subCatTabFilter=Monthly%20Portfolio%20Disclosures'
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,application/json,*/*'}
          def get(url,timeout=15):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  b=r.read()
                  print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),r.geturl())
                  return b.decode('utf-8','replace')

          html=get(page)
          for pat in [
              r'https?://[^"\'\s<>]+',
              r'[^"\']{0,200}(?:Monthly Portfolio|OtherSchemeDisclosures|download|api|portfolio)[^"\']{0,500}',
              r'/_next/static/[^"\']+',
          ]:
              vals=[]
              for m in re.finditer(pat,html,re.I):
                  v=unescape(m.group(0))
                  if v not in vals:vals.append(v)
              for v in vals[:150]:print('HTML_TOKEN',v[:2500])

          scripts=[urllib.parse.urljoin(page,unescape(x)) for x in
                   re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)]
          print('SCRIPT_COUNT',len(scripts))
          checked=0
          for url in reversed(scripts):
              if checked>=18:break
              if not re.search(r'\.js(?:\?|$)',url,re.I):continue
              checked+=1
              try:js=get(url,8)
              except Exception as e:
                  print('SCRIPT_ERROR',url,repr(e));continue
              if not re.search(r'portfolio|download|disclosure|other.?scheme',js,re.I):continue
              print('SCRIPT_HIT',url)
              matches=[]
              for pat in [
                  r'https?://[^"\'\s)]+',
                  r'["\'][^"\']{0,300}(?:portfolio|download|disclosure|api|OtherScheme)[^"\']{0,700}["\']',
              ]:
                  for m in re.finditer(pat,js,re.I):
                      v=m.group(0)
                      if v not in matches:matches.append(v)
              for v in matches[:240]:print('JS_TOKEN',v[:3000])
          PY
