name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect exact ICICI Downloads page controller
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://www.icicipruamc.com/static/js/index.Bo6S7uE-.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=20) as r:
              js=r.read().decode('utf-8','replace')
              print('FETCH',r.status,r.headers.get('Content-Type'),len(js))
          print('IMPORT_HEAD',js[:5000])
          for needle in ('fileType','categoryId','subCategory','filter','userType','page:','size:',
                         'DOCUMENTS','downloadData','setAllData','financialYear','FINANCIAL_YEAR'):
              ms=list(re.finditer(re.escape(needle),js,re.I))
              print('NEEDLE',needle,'COUNT',len(ms))
              for m in ms[:20]:
                  i=m.start()
                  print('CTX',needle,js[max(0,i-3000):i+6500])
          PY
