name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Extract ICICI getApiEndpoint implementation
        run: |
          python - <<'PY'
          import re,urllib.request
          req=urllib.request.Request('https://www.icicipruamc.com/static/js/index.1t6HhxO5.js',
                                     headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=20) as r: js=r.read().decode('utf-8','replace')
          for pat in (
              r'getApiEndpoint\s*=',
              r'function\s+getApiEndpoint\b',
              r'getApiEndpoint\b',
              r'REACT_APP_API_ENDPOINT',
              r'REACT_APP_.*API.*ENDPOINT',
          ):
              matches=list(re.finditer(pat,js))
              print('PATTERN',pat,'COUNT',len(matches))
              for m in matches[:12]:
                  i=m.start()
                  print('CTX',js[max(0,i-2200):i+5000])
          PY
