name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Inspect ICICI news-media downloads chunk
        run: |
          python - <<'PY'
          import urllib.request,re,urllib.parse
          base='https://www.icicipruamc.com/'
          seeds=[
            'static/js/newsMedia.Be07XGbb.js',
            'static/js/downloadsFormsTypes.9ulBNFmg.js',
            'static/js/SmallDownload.CCReaEC6.js',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          seen=set()
          def get(path):
              url=urllib.parse.urljoin(base,path)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  text=r.read().decode('utf-8','replace')
                  print('FILE',path,len(text))
                  return text
          queue=list(seeds)
          while queue and len(seen)<12:
              path=queue.pop(0)
              if path in seen:continue
              seen.add(path)
              try:js=get(path)
              except Exception as e:print('ERROR',path,repr(e));continue
              if re.search(r'downloadData|downloads/files|fileType|categoryId|Monthly Portfolio|financialYear|filter',js,re.I):
                  for needle in ('downloadData','downloads/files','fileType','categoryId','financialYear','filter'):
                      start=0;count=0
                      while count<20:
                          i=js.find(needle,start)
                          if i<0:break
                          print('CTX',path,needle,js[max(0,i-3500):i+7000])
                          start=i+len(needle);count+=1
              for m in re.finditer(r'\.\/([A-Za-z0-9_.~%+@()\-]+\.js)',js):
                  dep='static/js/'+m.group(1)
                  if dep not in seen and dep not in queue:queue.append(dep)
          print('SEEN',sorted(seen))
          PY
