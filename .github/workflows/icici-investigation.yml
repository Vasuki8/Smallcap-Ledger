name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Query ICICI public downloads categories
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse
          bases=['https://apimf.icicipruamc.com','https://www.icicipruamc.com']
          usertypes=['','INVESTOR','Investor','investor','I','GUEST','Guest']
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
                   'Origin':'https://www.icicipruamc.com','Referer':'https://www.icicipruamc.com/'}
          for base in bases:
              for user in usertypes:
                  q=('?userType='+urllib.parse.quote(user)) if user else ''
                  url=base+'/nms/v1/downloads/categories'+q
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=15) as r:
                          b=r.read()
                          print('FETCH',url,r.status,r.headers.get('Content-Type'),len(b),r.geturl())
                          print('BODY',url,b.decode('utf-8','replace')[:30000])
                  except Exception as e:
                      print('ERROR',url,repr(e))
          PY
