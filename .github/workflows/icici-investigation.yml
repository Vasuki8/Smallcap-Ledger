name: ICICI portfolio investigation

on:
  push:
    branches: [backend/icici-complete-portfolio-v128]

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Find ICICI downloads payload in route chunks
        run: |
          python - <<'PY'
          import urllib.request,re
          base='https://www.icicipruamc.com/'
          paths=[
            'static/js/index.CK6gFMMX.js','static/js/index.CWTGqtsW.js',
            'static/js/index.CfmbVgFz.js','static/js/index.DkziuyJ0.js',
            'static/js/index.TMb0r7kK.js','static/js/index.ga12eJF9.js',
            'static/js/index.kFumjklZ.js','static/js/newsMedia.Be07XGbb.js',
            'static/js/SmallDownload.CCReaEC6.js',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          for path in paths:
              try:
                  req=urllib.request.Request(base+path,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:js=r.read().decode('utf-8','replace')
              except Exception as e:
                  print('ERROR',path,repr(e));continue
              print('FILE',path,len(js))
              score=sum(bool(re.search(p,js,re.I)) for p in [
                  r'fileType',r'categoryId',r'subCategory',r'financial.?year',
                  r'downloadData',r'download.*files',r'FORMS_SHARE'])
              print('SCORE',score)
              if score<2:continue
              for pat in [r'fileType',r'categoryId',r'subCategory',r'financial.?year',
                          r'pageSize',r'userType',r'FORMS_SHARE']:
                  for n,m in enumerate(re.finditer(pat,js,re.I)):
                      if n>=12:break
                      i=m.start()
                      print('HIT',path,pat,js[max(0,i-1800):i+3500])
          PY
