name: Inspect Canara expense API

on:
  push:
    branches: [backend/amfi-expense-coverage-v130]
    paths: [.github/workflows/inspect-amfi-expenses.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fetch live Canara TER API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://www.canararobeco.com/wp-json/ter/v1/records'
          q=urllib.parse.urlencode({'from_date':'2026-09-22','to_date':'2026-09-24'})
          req=urllib.request.Request(base+'?'+q,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=r.read(); print('FETCH',r.status,len(body),r.headers.get('content-type'),r.geturl())
          data=json.loads(body)
          print('TYPE',type(data).__name__)
          if isinstance(data,dict): print('KEYS',sorted(data.keys()))
          rows=data.get('data',data) if isinstance(data,dict) else data
          print('ROWS',len(rows) if isinstance(rows,list) else 'not-list')
          if isinstance(rows,list):
              for row in rows:
                  if 'small cap' in str(row.get('scheme_name','')).lower():
                      print('SMALL_CAP',json.dumps(row,sort_keys=True))
          PY
