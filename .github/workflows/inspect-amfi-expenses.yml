name: Inspect Canara expense API

on:
  push:
    branches: [backend/amfi-expense-coverage-v130]
    paths: [.github/workflows/inspect-amfi-expenses.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Trace Canara expense page scripts
        run: |
          python - <<'PY'
          import re,urllib.parse,urllib.request
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:
                  body=r.read();print('FETCH',r.status,len(body),r.headers.get('content-type'),r.geturl());return body,r.geturl()
          body,final=fetch('https://www.canararobeco.com/expense-ratio')
          html=body.decode('utf-8','ignore')
          print('HTML',html)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          for src in scripts:
              full=urllib.parse.urljoin(final,src);print('SCRIPT',full)
              try:s=fetch(full)[0].decode('utf-8','ignore')
              except Exception as e:print('SCRIPT_ERROR',e);continue
              if re.search(r'expense|ratio|ter|brokerage|statutory|api',s,re.I):
                  print('SCRIPT_MATCH',full)
                  for m in re.finditer(r'.{0,280}(?:expense|ratio|brokerage|statutory|api).{0,500}',s,re.I|re.S):
                      print(re.sub(r'\s+',' ',m.group(0))[:900])
          PY
