name: Inspect Canara expense API

on:
  push:
    branches: [backend/amfi-expense-coverage-v130]
    paths: [.github/workflows/inspect-amfi-expenses.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Extract Canara expense API strings
        run: |
          python - <<'PY'
          import re,urllib.request
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          u='https://www.canararobeco.com/assets/index-BXrQDEhN.js'
          req=urllib.request.Request(u,headers=UA)
          with urllib.request.urlopen(req,timeout=45) as r:s=r.read().decode('utf-8','ignore')
          print('JS_LEN',len(s))
          strings=set()
          for m in re.finditer(r'(["\'])(.{1,220}?)\1',s):
              v=m.group(2)
              if re.search(r'expense|ratio|brokerage|statutory|historical|ter',v,re.I):
                  strings.add(v)
          print('STRINGS')
          for v in sorted(strings):
              if len(v)<220: print(repr(v))
          for needle in ['expense-ratio','EXPENSE_RATIO','Total Expense Ratio','Historical Expense Ratio','Base Expense Ratio','brokerageCost','statutoryLevies','totalTer','totalTER','Uet=']:
              print('CONTEXT_FOR',needle)
              start=0;n=0
              while True:
                  p=s.find(needle,start)
                  if p<0 or n>=12:break
                  print(s[max(0,p-1400):p+2400])
                  start=p+len(needle);n+=1
          PY
