name: Validate Canara expense collector

on:
  push:
    branches: [backend/amfi-expense-coverage-v130]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python -m compileall -q tracker scripts tests
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Verify current official Canara Small Cap BER/TER
        run: |
          uv run --frozen python - <<'PY'
          import json
          from datetime import date
          from urllib.parse import urlencode
          from tracker import amc_expenses
          from tracker.providers import fetch
          today=date.today()
          start=today.replace(day=max(1,today.day-6))
          url=amc_expenses.CANARA_API+'?'+urlencode({'from_date':start.isoformat(),'to_date':today.isoformat()})
          body,_,_=fetch(url,archive=False,max_bytes=2*1024*1024)
          day,plans=amc_expenses.parse_canara_records(json.loads(body),today)
          assert set(plans)=={'Regular','Direct'}
          assert 0 <= plans['Direct']['base_expense_ratio'] <= plans['Direct']['ter'] <= 5
          assert 0 <= plans['Regular']['base_expense_ratio'] <= plans['Regular']['ter'] <= 5
          print('CANARA_VERIFIED',day,plans)
          PY
