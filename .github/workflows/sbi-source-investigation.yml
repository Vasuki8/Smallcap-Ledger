name: SBI source investigation (read-only)
on:
  push:
    branches: [work/sbi-portfolio-20260924]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Verify code
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Inspect monthly disclosures without publishing
        run: |
          mkdir -p audit
          uv run --frozen python - <<'PY'
          import json,re,traceback
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          from tracker import db,providers,disclosures,amc_reports
          db.init();out=Path('audit');records=[];seen=set()
          endpoint='https://www.sbimf.com/ajaxcall/CMS/GetSchemePortfolioSheets'
          for month in ('August','July'):
              payload={'FundId':0,'PSYear':'2026','PSMonth':month,'PSFrequency':'Monthly'}
              try:
                  providers.can_crawl(endpoint)
                  body,h,_=providers.fetch(endpoint,body=payload,max_bytes=12*1024*1024)
                  filename=month+'-listing.html';(out/filename).write_bytes(body)
                  records.append({'url':endpoint,'payload':payload,'file':filename,'sha256':h,'bytes':len(body)})
                  soup=BeautifulSoup(body,'html.parser')
                  for tr in soup.select('tr'):
                      text=tr.get_text(' ',strip=True)
                      if not re.search(r'small\s*cap',text,re.I):continue
                      print('SBI_SMALLCAP_ROW',str(tr))
                      for a in tr.select('a[href]'):
                          url=urljoin(endpoint,a['href'])
                          if url in seen or not disclosures.official_publication_url(url,'SBI'):continue
                          if not re.search(r'\.xlsx?(?:[?#]|$)',url,re.I):continue
                          seen.add(url);providers.can_crawl(url)
                          data,digest,_=providers.fetch(url,max_bytes=60*1024*1024)
                          name=month+'-portfolio'+Path(urlparse(url).path).suffix
                          (out/name).write_bytes(data)
                          records.append({'url':url,'file':name,'sha256':digest,'bytes':len(data)})
                          try:
                              n=amc_reports.extract(data,'SBI Small Cap Fund',url,digest)
                              print('SBI_PARSE',n,db.rows('SELECT family,as_of,complete,source,hash FROM portfolios'))
                          except Exception:traceback.print_exc()
              except Exception as exc:
                  records.append({'url':endpoint,'payload':payload,'error':str(exc)})
                  traceback.print_exc()
          (out/'sources.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbi-source-investigation
          path: audit/
          retention-days: 3
