name: Validate SBI recovery branch
on:
  push:
    branches: [work/sbi-portfolio-20260924]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - name: Integrate current main without replacing concurrent work
        run: |
          test "$GITHUB_REF_NAME" = 'work/sbi-portfolio-20260924'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          mkdir -p audit
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(Path('.github/sbi-development.patch.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest()=='556e9d5ce936ea0e3b7055a605cf16973451b54178f457868ad13b0105cc6d8c'
          Path('audit/reviewed.patch').write_bytes(raw)
          PY
          git apply --check audit/reviewed.patch
          git apply audit/reviewed.patch
          git diff --check
      - run: uv sync --frozen
      - name: Compile and run complete regression suite
        run: |
          set -o pipefail
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v 2>&1 | tee audit/tests.log
      - name: Validate exact official workbooks in an isolated database
        env:
          SMALLCAP_DATA_DIR: ${{ runner.temp }}/sbi-verification-data
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          from tracker import db
          from scripts.refresh_sbi_portfolios import run
          assert run(), 'SBI live source recovery failed'
          rows=db.rows('''SELECT p.as_of,p.complete,p.hash,p.source,COUNT(h.id) positions,SUM(h.weight) weight
            FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
            WHERE family='SBI Small Cap Fund' GROUP BY p.id ORDER BY p.as_of DESC''')
          print(json.dumps(rows,indent=2))
          Path('audit/official-workbook-validation.json').write_text(json.dumps(rows,indent=2))
          assert [(r['as_of'],r['positions'],r['complete']) for r in rows]==[('2026-08-31',73,1),('2026-07-31',74,1)]
          assert all(abs(r['weight']-100)<0.00001 for r in rows)
          assert rows[0]['hash']=='71b589984c9b3db4bbb1baf7365072e0e6f604cf18ccfc215a1dc9c1d3183b48'
          assert rows[1]['hash']=='b080c169962567f08b34dc4117368dcfb0fe4e49c182a2f60da842682e6dd1c1'
          assert run(), 'Idempotent second run failed'
          PY
      - name: Commit reviewed code to the isolated branch
        run: |
          test "$GITHUB_REF_NAME" = 'work/sbi-portfolio-20260924'
          git restore -- .github/workflows/daily.yml
          git rm .github/sbi-development.patch.b64
          git add README.md docs/HANDOFF.md scripts/refresh_sbi_portfolios.py tests/test_sbi_portfolios.py tracker/amc_discovery.py tracker/amc_reports.py tracker/portfolio_parser.py tracker/sbi_portfolios.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Recover complete SBI monthly portfolios with source-scoped replay and regression tests [skip ci]'
          git rev-parse HEAD > audit/validated-commit.txt
          git archive --format=zip --output=audit/source.zip HEAD tracker scripts tests docs README.md .github pyproject.toml uv.lock requirements.txt .python-version
          git push origin HEAD:work/sbi-portfolio-20260924
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbi-recovery-validation
          path: audit/
          retention-days: 3
