name: Tata v124 validation

on:
  push:
    branches: [backend/tata-complete-portfolio-v124]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile and run complete regression suite
        run: |
          uv run --frozen python -m compileall -q tracker scripts tests
          uv run --frozen python -m unittest discover -s tests -v
      - name: Validate live Tata API and workbook ingestion
        env:
          SMALLCAP_DATA_DIR: /tmp/tata-v124-validation
        run: |
          rm -rf "$SMALLCAP_DATA_DIR"
          uv run --frozen python - <<'PY'
          import json
          from tracker import db,disclosures,amc_discovery
          db.init();disclosures.seed_sources()
          rows=list(amc_discovery.discover('Tata'))
          print('DISCOVERY',json.dumps(rows))
          assert rows and rows[0][0]=='Tata Small Cap Fund'
          assert rows[0][2]=='Portfolio as on 31st August, 2026'
          assert rows[0][1]=='https://betacms.tatamutualfund.com/system/files/2026-09/Monthly%20Portfolio%20as%20on%2031st%20August%202026.xlsx'
          count=amc_discovery.store_report('Tata',*rows[0])
          snap=db.one("""SELECT p.as_of,p.complete,p.hash,p.source,COUNT(h.id) positions,SUM(h.weight) weight
            FROM portfolios p JOIN holdings h ON h.snapshot_id=p.id
            WHERE p.family='Tata Small Cap Fund'
            GROUP BY p.id ORDER BY p.as_of DESC,p.id DESC LIMIT 1""")
          metric=db.one("""SELECT as_of,value,unit,source,hash FROM metrics
            WHERE family='Tata Small Cap Fund' AND metric='aum'
            ORDER BY as_of DESC,id DESC LIMIT 1""")
          print('COUNT',count)
          print('SNAPSHOT',json.dumps(snap))
          print('AUM',json.dumps(metric))
          assert snap['as_of']=='2026-08-31'
          assert snap['complete']==1
          assert snap['positions']==67
          assert abs(snap['weight']-100.0)<0.00001
          assert snap['hash']=='40de15ff002fbfa93a7bbc9e54bbb4f0c547e643cd1b6779dd3bf33011457f37'
          assert metric['as_of']=='2026-08-31'
          assert abs(float(metric['value'])-13093.88375)<0.0001
          PY
