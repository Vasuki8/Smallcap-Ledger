name: Read-only source retention audit
on:
  push:
    branches: [audit/source-retention-20260925]
    paths: ['.github/workflows/source-retention-audit.yml']
permissions:
  contents: write
concurrency:
  group: smallcap-source-retention-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - name: Preserve ambiguous request responses in audit rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit_source_retention.py');s=p.read_text()
          old="    if not item['urls'] or not all(valid_url(u) for u in item['urls']): reasons.append('missing_or_nonportable_source_url')"
          new=old+"\n    if item['kind'] in ('json', 'text'): reasons.append('request_parameters_or_data_semantics_require_review')"
          if new not in s:
              assert s.count(old)==1;s=s.replace(old,new)
          s=s.replace('Only superseded HTML/JavaScript/JSON/plain-text responses with a strictly newer retained version', 'Only superseded HTML/JavaScript responses with a strictly newer retained version')
          marker='JSON/plain-text responses stay under review because request parameters and data semantics are not fully recorded. '
          if marker not in s:s=s.replace('These are distinct response snapshots, not verified byte duplicates.', marker+'These are distinct response snapshots, not verified byte duplicates.')
          p.write_text(s)
          PY
      - name: Install locked dependencies and compile
        run: |
          uv sync --frozen
          uv run --frozen python -m compileall -q tracker scripts tests
      - name: Run all regression and retention-rule tests
        run: |
          if ! uv run --frozen python -m unittest discover -s tests -v > /tmp/retention-tests.log 2>&1; then
            tail -100 /tmp/retention-tests.log
            exit 1
          fi
          tail -5 /tmp/retention-tests.log
      - name: Pin and restore exact closed production checkpoint bytes
        run: |
          mkdir -p /tmp/retention-input
          gh release download tracker-history --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir /tmp/retention-input
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/tracker-history" > /tmp/retention-input/release.json
          RID=$(python -c "import json;print(json.load(open('/tmp/retention-input/release.json'))['id'])")
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RID/assets?per_page=100" > /tmp/retention-input/assets.json
          uv run --frozen python - <<'PY'
          import json,os,shutil,zipfile
          from pathlib import Path
          from scripts import github_state as state
          folder=Path('/tmp/retention-input');m=json.loads((folder/'latest.json').read_text())
          assert m['format']==2
          database=state.download_asset(os.environ['GITHUB_REPOSITORY'],m['database']['asset'],folder)
          assert database.stat().st_size==m['database']['bytes']
          assert state.digest(database)==m['database']['sha256']
          destination=Path('/tmp/retention-db');destination.mkdir()
          with zipfile.ZipFile(database) as z:
              assert z.namelist()==['data/ledger.sqlite3']
              with z.open('data/ledger.sqlite3') as src,(destination/'ledger.sqlite3').open('wb') as out:
                  shutil.copyfileobj(src,out)
          print('Pinned checkpoint',m['database'])
          PY
      - name: Audit every source and measure compressed pack payloads
        run: |
          uv run --frozen python scripts/audit_source_retention.py \
            --database /tmp/retention-db/ledger.sqlite3 \
            --manifest /tmp/retention-input/latest.json \
            --assets /tmp/retention-input/assets.json \
            --repo "$GITHUB_REPOSITORY" --measure-packs --output docs
      - name: Record measured proposal and update handoff on audit branch
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path('docs/SOURCE-RETENTION-SUMMARY.json');r=json.loads(p.read_text())
          r['validation_run_id']=os.environ['GITHUB_RUN_ID']
          r['source_commit']=os.environ['GITHUB_SHA']
          r['tests_passed']=int(re.search(r'Ran (\d+) tests',Path('/tmp/retention-tests.log').read_text()).group(1))
          p.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          report=Path('docs/SOURCE-RETENTION-AUDIT.md')
          report.write_text(report.read_text()+f"\nValidation: {r['tests_passed']} passing tests. Audit run {r['validation_run_id']}. Database SHA-256 before/after: `{r['database_sha256_after']}` (unchanged). All {r['logical_rows']:,} rows remain. All {len(r['verified_packs'])} source packs were downloaded as disposable audit copies and checked against release SHA-256 metadata; archive membership and compressed sizes were verified. No AMC links were live-probed.\n")
          h=Path('docs/HANDOFF.md');old=h.read_text();header='# Smallcap Ledger backend handoff\n'
          assert old.startswith(header)
          g=r['groups'];candidate=g['link_only_candidate']
          section=f"\n## Source-retention audit — NO deletion authorized (2026-09-25 UTC)\n\nThe owner approved classification and a savings report BEFORE any deletion. Read `docs/SOURCE-RETENTION-AUDIT.md`, `docs/SOURCE-RETENTION-SUMMARY.json` and the per-hash CSV/JSON inventory. Audit run **{r['validation_run_id']}**, **{r['tests_passed']} tests**, checked **{r['archive_files']:,} unique originals / {r['archive_raw_bytes']:,} raw bytes**, all **{len(r['verified_packs'])}** immutable source packs, and an unchanged production-checkpoint copy.\n\nProposed link-only candidates: **{candidate['files']} files / {candidate['raw_bytes']:,} raw bytes**, representing **{candidate.get('compressed_payload_bytes',0):,} compressed payload bytes** before ZIP overhead. These are superseded discovery responses, not proven duplicate files or guaranteed recoverable historical bytes. Financial-source hashes and URLs, successful historical extractions, original downloadable reports, latest source copies, ambiguous API responses, and transport/replay dependencies remain protected or under review. **Actual deleted files/bytes: 0.**\n\nDo not implement deletion or retire release/legacy assets without a separate explicit owner approval of the exact scope. The current restore/export/replay paths assume binaries exist; a retention-aware migration and independently verified repack/rollback plan are prerequisites. No production code path, database schema, retention policy, source collector, daily schedule or UI was changed. Resume the prior backend queue only after the owner chooses whether to proceed with the proposal.\n\n"
          h.write_text(header+section+old[len(header):])
          print(json.dumps({k:r[k] for k in ('groups','archive_files','archive_raw_bytes','tests_passed','database_unchanged')},indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_source_retention.py tests/test_source_retention.py docs/SOURCE-RETENTION-* docs/HANDOFF.md
          git commit -m 'Record read-only source retention proposal and measured per-hash savings'
          git push origin HEAD:audit/source-retention-20260925
