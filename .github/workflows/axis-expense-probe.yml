name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Inspect Axis TER page and data transport
        run: |
          uv run --frozen python - <<'PY'
          import json,re,html
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from tracker import db
          from tracker.amc_discovery import read

          db.init()
          page="https://www.axismf.com/servicecenter/navterandothers/totalexpenseratio"
          raw,h,typ=read(page)
          text=raw.decode("utf-8","replace")
          print("PAGE",len(raw),typ,h)
          print("COUNTS",{
              k:len(re.findall(k,text,re.I))
              for k in ("Axis Small Cap Fund","Base Expense Ratio","Total Expense Ratio",
                        "expenseRatio","TER","api","scheme")
          })
          soup=BeautifulSoup(text,"html.parser")
          for tag in soup.find_all(True):
              attrs=" ".join(f"{k}={v}" for k,v in tag.attrs.items())
              body=tag.get_text(" ",strip=True)
              joined=attrs+" "+body
              if re.search(r"Axis Small Cap Fund|Base Expense Ratio|Total Expense Ratio|TER Date|expense ratio",joined,re.I):
                  print("TAG",tag.name,attrs[:1200],body[:1500])

          print("SCRIPT_SRCS")
          for tag in soup.find_all("script",src=True):
              print(urljoin(page,html.unescape(tag["src"])))

          print("NEXT_SNIPS")
          for script in soup.find_all("script"):
              body=script.string or script.get_text("",strip=False) or ""
              if re.search(r"Axis Small Cap Fund|Base Expense Ratio|Total Expense Ratio|expenseRatio|TER",body,re.I):
                  clean=re.sub(r"\s+"," ",body)
                  for pat in ("Axis Small Cap Fund","Base Expense Ratio","Total Expense Ratio","expenseRatio"):
                      pos=clean.lower().find(pat.lower())
                      if pos>=0:
                          print("SNIP",pat,clean[max(0,pos-1500):pos+4000])
          PY
