name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Resolve Axis TER lazy module
        run: |
          uv run --frozen python - <<'PY'
          from tracker import db
          from tracker.amc_discovery import read
          db.init()
          url=("https://www.axismf.com/_next/static/chunks/app/servicecenter/"
               "%5Bservicetype%5D/%5Bservices%5D/page-78aa5dcf4cefc6a2.js")
          raw,_,_=read(url,archive=False)
          print("PAGE_BUNDLE",raw.decode("utf-8","replace"))
          PY
