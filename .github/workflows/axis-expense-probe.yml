name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Resolve Axis TER endpoint and scheme metadata
        run: |
          uv run --frozen python - <<'PY'
          import re,json
          from bs4 import BeautifulSoup
          from tracker import db
          from tracker.amc_discovery import read

          db.init()
          chunk="https://www.axismf.com/_next/static/chunks/2949-d62ba4877ec805c0.js"
          raw,_,_=read(chunk,archive=False)
          text=raw.decode("utf-8","replace")
          for pat in ("GET_EXPENSE_RATIO_DETAILS","SERVICE_URL","EXPENSE_RATIO:{",
                      "EXPENSE_RATIO=","fetchExpenseRatioDetails"):
              print("PATTERN",pat)
              pos=0;shown=0
              while shown<15:
                  i=text.find(pat,pos)
                  if i<0:break
                  print("SNIP",text[max(0,i-7000):min(len(text),i+10000)])
                  pos=i+len(pat);shown+=1

          page="https://www.axismf.com/servicecenter/navterandothers/totalexpenseratio"
          body,_,_=read(page)
          html=body.decode("utf-8","replace")
          for pat in ("schemeDetails","expenseRatioResponse","totalExpenseRatio",
                      "Axis Small Cap Fund","schemeCode","planNames","types"):
              print("HTML_PATTERN",pat)
              low=html.lower();pos=0;shown=0
              while shown<8:
                  i=low.find(pat.lower(),pos)
                  if i<0:break
                  print("HTML_SNIP",html[max(0,i-5000):min(len(html),i+12000)])
                  pos=i+len(pat);shown+=1
          PY
