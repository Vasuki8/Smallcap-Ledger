name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Inspect Axis TER generated workbook
        run: |
          uv run --frozen python - <<'PY'
          import io,json,openpyxl
          from tracker import db
          from tracker.amc_discovery import read
          from tracker.axis_portfolios import cms_token

          db.init()
          endpoint="https://www.axismf.com/cms/expense-ratio-details"
          headers={"Authorization":cms_token(read),"Content-Type":"application/json"}
          payload={"fundType":"Equity","schemeCode":"SC","type":"Total Expense Ratio",
                   "fromDate":"20-09-2026","toDate":"25-09-2026"}
          raw,api_hash,_=read(endpoint,body=payload,headers=headers)
          data=json.loads(raw)
          print("API_HASH",api_hash)
          print("API_STATUS",data.get("status"),data.get("statusCode"))
          url=data["data"]["s3CsvResponse"]["location"]
          print("WORKBOOK_URL",url)
          body,h,typ=read(url)
          print("WORKBOOK",len(body),h,typ,body[:8])
          book=openpyxl.load_workbook(io.BytesIO(body),data_only=True,read_only=True)
          print("SHEETS",book.sheetnames)
          for sheet in book:
              print("SHEET",sheet.title,sheet.max_row,sheet.max_column)
              for i,row in enumerate(sheet.iter_rows(values_only=True),1):
                  print("ROW",i,row)
                  if i>=20:break
          book.close()
          PY
