name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Call Axis TER endpoint with public CMS token
        run: |
          uv run --frozen python - <<'PY'
          import json
          from tracker import db
          from tracker.amc_discovery import read
          from tracker.axis_portfolios import cms_token

          db.init()
          token=cms_token(read)
          headers={"Authorization":token,"Content-Type":"application/json"}
          endpoint="https://www.axismf.com/cms/expense-ratio-details"
          probes=[
              {},
              {"type":"","schemeCode":"ALL","fundType":"","planCode":"",
               "fromDate":"01-09-2026","toDate":"25-09-2026"},
          ]
          for payload in probes:
              try:
                  body,h,typ=read(endpoint,body=payload,headers=headers)
                  print("API_PROBE",json.dumps(payload),len(body),typ,h)
                  print(body.decode("utf-8","replace")[:30000])
              except Exception as e:
                  print("API_ERROR",json.dumps(payload),repr(e))
          PY
