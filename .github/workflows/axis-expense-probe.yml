name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Discover accepted Axis TER request schema
        run: |
          uv run --frozen python - <<'PY'
          import json
          from tracker import db
          from tracker.amc_discovery import read
          from tracker.axis_portfolios import cms_token

          db.init()
          endpoint="https://www.axismf.com/cms/expense-ratio-details"
          headers={"Authorization":cms_token(read),"Content-Type":"application/json"}
          probes=[
              {"fundType":"Equity"},
              {"fundType":"Equity","schemeCode":"SC"},
              {"fundType":"Equity","schemeCode":"SC","fromDate":"01-09-2026","toDate":"25-09-2026"},
              {"fundType":"Equity","schemeCode":"SC","type":"Total Expense Ratio","fromDate":"01-09-2026","toDate":"25-09-2026"},
              {"fundType":"Equity Scheme","schemeCode":"SC","type":"Total Expense Ratio","fromDate":"01-09-2026","toDate":"25-09-2026"},
              {"fundType":"Equity Schemes","schemeCode":"SC","type":"Total Expense Ratio","fromDate":"01-09-2026","toDate":"25-09-2026"},
              {"fundType":"Equity","schemeCode":"ALL","type":"Total Expense Ratio","fromDate":"01-09-2026","toDate":"25-09-2026"},
          ]
          for payload in probes:
              try:
                  body,h,typ=read(endpoint,body=payload,headers=headers)
                  print("PROBE",json.dumps(payload,separators=(",",":")),"=>",
                        body.decode("utf-8","replace")[:20000])
              except Exception as e:
                  print("ERROR",json.dumps(payload,separators=(",",":")),repr(e))
          PY
