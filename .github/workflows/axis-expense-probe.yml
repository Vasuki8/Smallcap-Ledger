name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Inspect Axis TER metadata and endpoint
        run: |
          uv run --frozen python - <<'PY'
          import json,re
          from tracker import db
          from tracker.amc_discovery import read

          db.init()
          page="https://www.axismf.com/servicecenter/navterandothers/totalexpenseratio"
          raw,_,_=read(page)
          text=raw.decode("utf-8","replace")
          for pat in ("expenseRatioResponse","schemeDetails","totalExpenseRatio"):
              low=text.lower();i=low.find(pat.lower())
              print("PAGE_PATTERN",pat,"POS",i)
              if i>=0:
                  snip=text[max(0,i-2500):min(len(text),i+12000)]
                  # Collapse escape noise but preserve raw data keys/values.
                  print("PAGE_SNIP",snip)

          endpoint="https://www.axismf.com/cms/expense-ratio-details"
          probes=[
              {},
              {"type":"","schemeCode":"ALL","fundType":"","planCode":"",
               "fromDate":"01-09-2026","toDate":"25-09-2026"},
          ]
          for payload in probes:
              try:
                  body,h,typ=read(endpoint,body=payload)
                  print("API_PROBE",json.dumps(payload),len(body),typ,h,
                        body.decode("utf-8","replace")[:16000])
              except Exception as e:
                  print("API_ERROR",json.dumps(payload),repr(e))
          PY
