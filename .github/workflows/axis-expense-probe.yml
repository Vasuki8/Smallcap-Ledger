name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Locate Axis TER implementation module
        run: |
          uv run --frozen python - <<'PY'
          import html,re
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from tracker import db
          from tracker.amc_discovery import read

          db.init()
          page="https://www.axismf.com/servicecenter/navterandothers/totalexpenseratio"
          raw,_,_=read(page)
          soup=BeautifulSoup(raw,"html.parser")
          scripts=[urljoin(page,html.unescape(t["src"])) for t in soup.find_all("script",src=True)]
          for url in scripts:
              body,_,_=read(url,archive=False)
              text=body.decode("utf-8","replace")
              for needle in ("36579:function","36579:","TotalExpenseRatioModule"):
                  i=text.find(needle)
                  if i>=0:
                      print("FOUND",needle,url,"BYTES",len(body))
                      print(text[max(0,i-8000):min(len(text),i+30000)])
                      break
          PY
