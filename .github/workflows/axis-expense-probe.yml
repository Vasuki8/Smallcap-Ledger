name: Axis expense CMS probe

on:
  push:
    branches: [backend/axis-expense-recovery-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMALLCAP_NO_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Trace Axis TER browser API
        run: |
          uv run --frozen python - <<'PY'
          import re,html
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from tracker import db
          from tracker.amc_discovery import read

          db.init()
          page="https://www.axismf.com/servicecenter/navterandothers/totalexpenseratio"
          raw,_,_=read(page)
          soup=BeautifulSoup(raw,"html.parser")
          scripts=[]
          for tag in soup.find_all("script",src=True):
              url=urljoin(page,html.unescape(tag["src"]))
              if url not in scripts:scripts.append(url)
          print("SCRIPT_COUNT",len(scripts))
          needles=(
              "totalexpenseratio","expenseRatio","expense-ratio","baseExpense",
              "baseTer","totalTer","terData","downloadTer","getTer","/cms/",
              "expense ratio","fromDate","toDate","planOption"
          )
          for url in scripts:
              try:
                  body,_,_=read(url,archive=False)
              except Exception as e:
                  print("SCRIPT_ERROR",url,repr(e));continue
              text=body.decode("utf-8","replace")
              low=text.lower()
              matched=[n for n in needles if n.lower() in low]
              if not matched:continue
              print("MATCHED",url,matched,"BYTES",len(body))
              for needle in matched:
                  pos=0;shown=0
                  while shown<10:
                      i=low.find(needle.lower(),pos)
                      if i<0:break
                      snippet=re.sub(r"\s+"," ",text[max(0,i-1000):min(len(text),i+2500)])
                      print("SNIP",needle,snippet)
                      pos=i+len(needle);shown+=1
          PY
