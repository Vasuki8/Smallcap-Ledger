name: Execute approved branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/approved-branch-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: approved-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate approved branch set
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/delete_audited_branches.py
          --audit docs/BRANCH-CLEANUP-AUDIT.json
          --expected-count 299
      - name: Delete exact audited merged-tip branches
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_BRANCH_CLEANUP: DELETE_AUDITED_MERGED_TIPS_299
        run: >-
          python scripts/delete_audited_branches.py
          --audit docs/BRANCH-CLEANUP-AUDIT.json
          --expected-count 299
          --apply
