name: Storage cleanup validation
on:
  push:
    branches: [maintenance/storage-cleanup-20260925]
    paths: ['.github/workflows/storage-audit.yml']
permissions:
  contents: write
concurrency:
  group: smallcap-storage-audit
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
      SMALLCAP_NO_SCHEDULER: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - name: Prepare code integration on maintenance branch
        run: |
          python - <<'PY'
          from pathlib import Path
          def change(path, old, new):
              p=Path(path);text=p.read_text()
              if old in text:
                  assert text.count(old)==1, (path,old)
                  p.write_text(text.replace(old,new))
              else:
                  assert new in text, (path,'expected integration anchor missing')
          change('tracker/db.py','observed_at TEXT NOT NULL, PRIMARY KEY(code,date));','observed_at TEXT NOT NULL, PRIMARY KEY(code,date)) WITHOUT ROWID;')
          change('tracker/db.py','UNIQUE(code,date,value,source));','PRIMARY KEY(code,date,value,source)) WITHOUT ROWID;')
          change('tracker/db.py','PRIMARY KEY(name,date));','PRIMARY KEY(name,date)) WITHOUT ROWID;')
          change('tracker/db.py','UNIQUE(name,date,value,source));','PRIMARY KEY(name,date,value,source)) WITHOUT ROWID;')
          change('scripts/record_build.py',"git('add','deployment/update-status.json','COVERAGE-AS-OF.json','COVERAGE-AS-OF.md')","git('add','deployment','COVERAGE-AS-OF.json','COVERAGE-AS-OF.md')")
          assert 'scripts/compact_database.py --apply --report deployment/storage-layout-v1.json' in Path('.github/workflows/daily.yml').read_text()
          PY
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Compile Python
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: Restore a production database copy
        run: uv run --frozen python scripts/github_state.py restore
      - name: Run full regression suite
        run: |
          set -o pipefail
          uv run --frozen python -m unittest discover -s tests -v 2>&1 | tee /tmp/storage-tests.log
      - name: Verify production-copy compaction and checkpoint round trip
        run: |
          uv run --frozen python - <<'PY'
          import json, sqlite3, pathlib, re, os
          from scripts import compact_database as cleanup, github_state as state
          from tracker import db
          before=state.pack_database(pathlib.Path('/tmp/storage-before.zip'))
          report=cleanup.compact_database(True)
          assert report['all_logical_rows_unchanged']
          assert report['after_bytes']<report['before_bytes'],report
          assert len(report['tables_changed'])==4,report
          second=cleanup.compact_database(True)
          assert second['tables_changed']==[] and second['bytes_saved']==0,second
          after=state.pack_database(pathlib.Path('/tmp/storage-after.zip'))
          restored=pathlib.Path('/tmp/storage-roundtrip')
          state._restore_database_only(pathlib.Path('/tmp/storage-after.zip'),restored,after)
          with sqlite3.connect(restored/'ledger.sqlite3') as c:
              assert cleanup.table_fingerprints(c)==report['preserved_tables']
          report['checkpoint_before']=before
          report['checkpoint_after']=after
          report['checkpoint_roundtrip_verified']=True
          report['idempotence_verified']=True
          report['validation_run_id']=os.environ['GITHUB_RUN_ID']
          report['tests_passed']=int(re.search(r'Ran (\d+) tests',pathlib.Path('/tmp/storage-tests.log').read_text()).group(1))
          pathlib.Path('docs/STORAGE-VALIDATION.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Export and validate website from compacted copy
        run: |
          uv run --frozen python scripts/export_site.py
          uv run --frozen python scripts/validate_site.py site
      - name: Record tested integration and handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/STORAGE-VALIDATION.json');r=json.loads(p.read_text())
          coverage=json.loads(Path('site/data/coverage.json').read_text())
          r['site_validation_passed']=True;r['coverage_counts']=coverage['counts']
          p.write_text(json.dumps(r,indent=2)+'\n')
          report=f'''# Smallcap Ledger storage cleanup\n\n## Validation status\n\nValidated on a restored production copy in GitHub Actions run {r['validation_run_id']}. Production publication is pending.\n\n- SQLite database: {r['before_bytes']:,} to {r['after_bytes']:,} bytes; saved {r['bytes_saved']:,} bytes.\n- Compressed database checkpoint: {r['checkpoint_before']['bytes']:,} to {r['checkpoint_after']['bytes']:,} bytes.\n- {r['tests_passed']} regression tests passed, including 14 new migration tests.\n- Every logical row in all {len(r['preserved_tables'])} tables remained identical, verified by sorted-content SHA-256 fingerprints.\n- Integrity, foreign-key checks, idempotence, checkpoint restore and generated-site/download checks passed.\n\n## Scope\n\nThe four NAV/benchmark current and observation tables use composite primary-key WITHOUT ROWID storage. Current values, alternate observations/corrections, reporting and observation dates, metrics, holdings, source hashes, original binaries and all fund plans remain. New databases use the same compact layout. Unknown schemas and dependencies fail closed. The daily pipeline applies this before tests/export/publication and retains its prior checkpoint for rollback. First production migration evidence is recorded in deployment/storage-layout-v1.json.\n\n## Unperformed archive retirement\n\nThe read-only audit identified unreferenced legacy release asset state-35791406887-1.zip, 1,087,514,828 bytes. It has NOT been deleted or replaced. The legacy-archive cleanup tool action was blocked; no space saving from it is claimed. Its exact database snapshot and every unique source must be preserved and verified before any retirement. No source-retention policy or fund-universe scope has changed.\n\nSee docs/STORAGE-AUDIT.json and docs/STORAGE-VALIDATION.json for the machine-readable evidence.\n'''
          Path('docs/STORAGE-CLEANUP.md').write_text(report)
          handoff=Path('docs/HANDOFF.md');old=handoff.read_text()
          header='# Smallcap Ledger backend handoff\n'
          assert old.startswith(header)
          section=f'''\n## Database cleanup (2026-09-25 UTC)\n\n**Read `docs/STORAGE-CLEANUP.md` for the current merge, production verification and cleanup status.** This is the storage batch's completion/handoff record; the validation evidence is in `docs/STORAGE-VALIDATION.json`.\n\nThe owner requested unnecessary/redundant database storage cleanup. The four NAV/benchmark tables were migrated to composite-primary-key `WITHOUT ROWID` storage on a production copy. All {r['tests_passed']} tests, all-table content equality, integrity/foreign-key checks, idempotence, checkpoint restore and generated-site validation passed. Measured database size: **{r['before_bytes']:,} to {r['after_bytes']:,} bytes**; checkpoint ZIP **{r['checkpoint_before']['bytes']:,} to {r['checkpoint_after']['bytes']:,} bytes**. No logical record or original source was removed.\n\nThe legacy cumulative ZIP `state-35791406887-1.zip` (**1,087,514,828 bytes**) remains untouched: its retirement action was blocked, so do not claim this storage was reclaimed. Source-retention policy and fund scope are unchanged. After storage publication is verified, resume the previously documented portfolio source-recovery task below.\n\n'''
          handoff.write_text(header+section+old[len(header):])
          readme=Path('README.md');text=readme.read_text()
          addition='''\n\n## Lossless database storage cleanup\n\nNAV and benchmark tables use composite primary-key storage without redundant rowid indexes. This removes physical duplication, not financial records: current values, alternate observations/corrections, dates and sources all remain. `python scripts/compact_database.py` reports a plan; `--apply` performs a transactional migration, checks fingerprints of every logical table, validates foreign keys/integrity and compacts free pages. Unknown schemas, dependent views, custom indexes/triggers and incoming foreign keys fail closed. The normal daily pipeline runs this before tests and publication, retaining its previous durable checkpoint. No source binary is deleted. The first production result is recorded in `deployment/storage-layout-v1.json`. See `docs/STORAGE-CLEANUP.md` for measured results and deployment status.\n'''
          if '## Lossless database storage cleanup' not in text:readme.write_text(text+addition)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracker/db.py scripts/record_build.py docs/STORAGE-VALIDATION.json docs/STORAGE-CLEANUP.md docs/HANDOFF.md README.md
          git commit -m 'Integrate and record verified lossless database compaction'
          git push origin HEAD:maintenance/storage-cleanup-20260925
