name: Storage cleanup audit
on:
  push:
    branches: [maintenance/storage-cleanup-20260925]
    paths: ['.github/workflows/storage-audit.yml']
permissions:
  contents: write
concurrency:
  group: smallcap-storage-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Restore database read-only for audit
        run: python scripts/github_state.py restore
      - name: Audit stored records and release assets
        run: |
          mkdir -p /tmp/storage-audit
          gh release download tracker-history --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir /tmp/storage-audit
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/383859254/assets?per_page=100" > /tmp/storage-audit/assets.json
          python - <<'PY'
          import json, sqlite3, pathlib, subprocess
          from tracker import db
          p=pathlib.Path('/tmp/storage-audit')
          manifest=json.loads((p/'latest.json').read_text())
          assets=[a for page in json.loads((p/'assets.json').read_text()) for a in page]
          c=sqlite3.connect('file:data/ledger.sqlite3?mode=ro',uri=True)
          c.row_factory=sqlite3.Row
          def rows(sql): return [dict(r) for r in c.execute(sql)]
          def refs(m):
              if not m:return set()
              if m.get('format',1)==1:return {m['asset']}
              return {m['database']['asset'],*[x['asset'] for x in m['source_packs']]}
          active=refs(manifest);previous=refs(manifest.get('previous'))
          report={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'database_bytes':pathlib.Path('data/ledger.sqlite3').stat().st_size,
            'integrity':c.execute('PRAGMA integrity_check').fetchone()[0],
            'foreign_key_violations':rows('PRAGMA foreign_key_check'),
            'page_count':c.execute('PRAGMA page_count').fetchone()[0],
            'freelist_count':c.execute('PRAGMA freelist_count').fetchone()[0],
            'tables':{},'database_objects':rows('SELECT name,SUM(pgsize) bytes,COUNT(*) pages FROM dbstat GROUP BY name ORDER BY bytes DESC'),
            'archive_media':rows('SELECT media_type,COUNT(*) files,SUM(bytes) bytes FROM archives GROUP BY media_type ORDER BY bytes DESC'),
            'fetch_status':rows('SELECT status,COUNT(*) rows FROM fetches GROUP BY status'),
            'fetch_duplicates':rows('SELECT COUNT(*) groups,SUM(n-1) extra_rows FROM (SELECT COUNT(*) n FROM fetches GROUP BY url,fetched_at,status,hash,detail HAVING COUNT(*)>1)'),
            'largest_archives':rows('SELECT a.hash,a.bytes,a.media_type,(SELECT f.url FROM fetches f WHERE f.hash=a.hash ORDER BY f.id DESC LIMIT 1) url FROM archives a ORDER BY a.bytes DESC LIMIT 25'),
            'release':{'assets':len(assets),'bytes':sum(a['size'] for a in assets),'active_bytes':sum(a['size'] for a in assets if a['name'] in active),'previous_only_bytes':sum(a['size'] for a in assets if a['name'] in previous-active),'unreferenced_assets':[{'name':a['name'],'bytes':a['size'],'id':a['id']} for a in assets if a['name'] not in active|previous|{'latest.json'}]},
            'manifest':{'format':manifest.get('format'),'created_at':manifest.get('created_at'),'database':manifest.get('database'),'source_packs':len(manifest.get('source_packs',[])),'previous_database':(manifest.get('previous') or {}).get('database')},
            'source_files':subprocess.check_output(['git','ls-files','scripts','tests','tracker'],text=True).splitlines()}
          for name, in c.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"):
              report['tables'][name]=c.execute('SELECT COUNT(*) FROM "'+name+'"').fetchone()[0]
          report['unreferenced_archive_records']=rows('''SELECT COUNT(*) files,SUM(bytes) bytes FROM archives a WHERE NOT EXISTS(SELECT 1 FROM metrics m WHERE m.hash=a.hash) AND NOT EXISTS(SELECT 1 FROM portfolios p WHERE p.hash=a.hash) AND NOT EXISTS(SELECT 1 FROM document_versions v WHERE v.hash=a.hash)''')
          report['rowid_usage']=subprocess.run(['git','grep','-n','-i','rowid','--','tracker','scripts','tests'],text=True,capture_output=True).stdout
          pathlib.Path('docs/STORAGE-AUDIT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Record audit on maintenance branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/STORAGE-AUDIT.json
          git commit -m 'Record read-only storage audit'
          git push origin HEAD:maintenance/storage-cleanup-20260925
