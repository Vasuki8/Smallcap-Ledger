name: Inspect Mahindra TER disclosure

on:
  push:
    branches: [backend/mahindra-ter-v134]
    paths: [.github/workflows/inspect-mahindra-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Trace Mahindra public website response decoder
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.mahindramanulife.com/assets/index-C3oiuZih.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              s=r.read().decode('utf-8','ignore')
              print('FETCH',r.status,len(s),r.geturl())

          for needle in [
              'investorapi.mahindramanulife.com/api/v1/web',
              'getClient("website")',
              'payload',
              'decrypt',
              'AES.decrypt',
              'VITE_AES',
              'VITE_ENCRYPT',
              'parseResponse',
          ]:
              print('NEEDLE',needle)
              p=0;n=0
              while True:
                  p=s.find(needle,p)
                  if p<0 or n>=30:break
                  ctx=re.sub(r'\s+',' ',s[max(0,p-3000):p+6000])
                  if needle in ('payload','decrypt') and not any(k in ctx.lower() for k in ('axios','interceptor','decrypt','payload','website')):
                      p+=len(needle);n+=1;continue
                  print('CTX',ctx[:9200])
                  p+=len(needle);n+=1
          PY
