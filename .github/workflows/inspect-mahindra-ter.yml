name: Inspect Mahindra TER disclosure

on:
  push:
    branches: [backend/mahindra-ter-v134]
    paths: [.github/workflows/inspect-mahindra-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Decode Mahindra public downloads tree
        run: |
          python - <<'PY'
          import base64,json,re,subprocess,urllib.request
          url='https://investorapi.mahindramanulife.com/api/v1/web/preLogin/downloads'
          key=b'mahindra2024mahindra2024mahindra'
          iv=b'hasnainsheikh202'
          print('KEY_LEN',len(key),'IV_LEN',len(iv))
          req=urllib.request.Request(url,headers={
              'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0',
              'Accept':'application/json, text/plain, */*',
              'Origin':'https://www.mahindramanulife.com',
              'Referer':'https://www.mahindramanulife.com/downloads',
          })
          with urllib.request.urlopen(req,timeout=60) as r:
              raw=r.read(); print('FETCH',r.status,len(raw),r.headers.get('content-type'),r.geturl())
          outer=json.loads(raw)
          cipher=base64.b64decode(outer['payload'],validate=True)
          p=subprocess.run([
              'openssl','enc','-d','-aes-256-cbc',
              '-K',key.hex(),'-iv',iv.hex()
          ],input=cipher,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
          print('OPENSSL',p.returncode,len(p.stdout),p.stderr.decode(errors='replace'))
          data=json.loads(p.stdout.decode('utf-8'))
          print('TOP',type(data).__name__,sorted(data) if isinstance(data,dict) else None)
          if isinstance(data,dict):
              print('STATUS',data.get('status'),data.get('message'))
              root=data.get('data')
          else: root=data
          print('ROOT',type(root).__name__,len(root) if isinstance(root,list) else None)

          def summary_file(f):
              return {k:f.get(k) for k in ('id','title','fileName','fileUrl','redirectUrl','fileExtension','fileSize','createdAt') if k in f}
          def walk(node,path=()):
              if isinstance(node,list):
                  for x in node: walk(x,path)
              elif isinstance(node,dict):
                  title=str(node.get('categoryName') or '')
                  new=path+((title,) if title else ())
                  if title and re.search(r'Total Expense Ratio|Expense Ratio',title,re.I):
                      print('CATEGORY_PATH',' > '.join(new),'ID',node.get('categoryId'))
                      print('CATEGORY_FILES',json.dumps([summary_file(f) for f in node.get('files',[])],ensure_ascii=False,sort_keys=True,default=str))
                      print('SUBCATEGORY_NAMES',[x.get('categoryName') for x in node.get('subcategories',[]) if isinstance(x,dict)])
                  for f in node.get('files',[]) if isinstance(node.get('files'),list) else []:
                      blob=json.dumps(f,ensure_ascii=False,default=str)
                      if re.search(r'Total Expense Ratio|\bTER\b|expense ratio',blob,re.I):
                          print('FILE_MATCH',' > '.join(new),json.dumps(summary_file(f),ensure_ascii=False,sort_keys=True,default=str))
                  for child in node.get('subcategories',[]) if isinstance(node.get('subcategories'),list) else []:
                      walk(child,new)
          walk(root)
          PY
