name: Inspect Mahindra TER disclosure

on:
  push:
    branches: [backend/mahindra-ter-v134]
    paths: [.github/workflows/inspect-mahindra-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Locate Mahindra downloads API endpoint
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://www.mahindramanulife.com/assets/index-C3oiuZih.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              s=r.read().decode('utf-8','ignore')
              print('FETCH',r.status,len(s),r.headers.get('content-type'),r.geturl())

          for needle in [
              'getDownloadsStructure',
              'DOWNLOADS',
              'downloadsStructure',
              'GET_DOWNLOADS',
              'downloads/categories',
              'preLogin/downloads',
          ]:
              print('NEEDLE',needle)
              p=0;n=0
              while True:
                  p=s.find(needle,p)
                  if p<0 or n>=35:break
                  print('CTX',re.sub(r'\s+',' ',s[max(0,p-3000):p+5200])[:8400])
                  p+=len(needle);n+=1

          print('ABS_URLS')
          urls=sorted(set(re.findall(r'https?://[^"\'\\ ]+',s)))
          for v in urls:
              if 'mahindra' in v.lower() or 'api' in v.lower():
                  print('URL',v[:600])
          PY
