name: Inspect Mahindra TER disclosure

on:
  push:
    branches: [backend/mahindra-ter-v134]
    paths: [.github/workflows/inspect-mahindra-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Mahindra downloads repository chunk
        run: |
          python - <<'PY'
          import re, urllib.request
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          urls=[
            'https://www.mahindramanulife.com/assets/downloadsRepository-Cinh6--v.js',
            'https://www.mahindramanulife.com/assets/Downloads-8hMqhREb.js',
            'https://www.mahindramanulife.com/assets/Downloads-i4zF7O7o.js',
          ]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers=UA)
                  with urllib.request.urlopen(req,timeout=45) as r:
                      b=r.read()
                      print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl())
              except Exception as e:
                  print('ERROR',url,type(e).__name__,e);continue
              s=b.decode('utf-8','ignore')
              print('FILE',url,'LEN',len(s))
              for needle in [
                  'Total Expense Ratio',
                  'mandatory-disclosures',
                  'getDownloads',
                  'download',
                  'Disclosure',
                  '/api/',
                  'ENDPOINTS',
              ]:
                  p=0;n=0
                  while True:
                      p=s.lower().find(needle.lower(),p)
                      if p<0 or n>=40:break
                      print('CTX',needle,re.sub(r'\s+',' ',s[max(0,p-1800):p+3800])[:5800])
                      p+=len(needle);n+=1
              print('LITERALS')
              vals=set(re.findall(r'["\']([^"\']{2,260})["\']',s))
              for v in sorted(vals):
                  if re.search(r'(download|disclos|expense|ratio|mandatory|api|category|subcategory|document)',v,re.I):
                      print('LITERAL',v[:400])
          PY
