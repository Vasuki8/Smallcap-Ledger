name: Inspect Mahindra TER disclosure

on:
  push:
    branches: [backend/mahindra-ter-v134]
    paths: [.github/workflows/inspect-mahindra-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect exact Mahindra TER workbooks
        run: |
          uv run --frozen python - <<'PY'
          import io,json,re,urllib.request,hashlib
          import openpyxl

          urls=[
            'https://www.mahindramanulife.com/uploads/download/6d61db84-f11d-4987-b7a6-929a71d43967.xlsx',
            'https://www.mahindramanulife.com/uploads/download/8e0a5334-dcf7-44c0-a22b-8cc6883d3a82.xlsx',
          ]
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Referer':'https://www.mahindramanulife.com/downloads'}
          for url in urls:
              print('SOURCE',url)
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read()
                  print('FETCH',r.status,len(body),r.headers.get('content-type'),r.geturl())
              print('SHA256',hashlib.sha256(body).hexdigest(),'MAGIC',body[:8])
              wb=openpyxl.load_workbook(io.BytesIO(body),data_only=True,read_only=True)
              print('SHEETS',wb.sheetnames)
              for ws in wb.worksheets:
                  print('SHEET',ws.title,ws.max_row,ws.max_column)
                  matches=[]
                  for i,row in enumerate(ws.iter_rows(values_only=True),1):
                      vals=[None if v is None else str(v) for v in row]
                      joined=' | '.join(v or '' for v in vals)
                      if i<=12 or re.search(r'Mahindra\s+Manulife\s+Small\s+Cap\s+Fund|Small\s+Cap\s+Fund',joined,re.I):
                          matches.append((i,vals))
                  for i,vals in matches[:80]:
                      print('ROW',i,json.dumps(vals,ensure_ascii=False))
              wb.close()
          PY
