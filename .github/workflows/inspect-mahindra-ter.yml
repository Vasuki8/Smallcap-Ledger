name: Inspect Mahindra TER disclosure

on:
  push:
    branches: [backend/mahindra-ter-v134]
    paths: [.github/workflows/inspect-mahindra-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Narrow Mahindra downloads service routes
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          page='https://www.mahindramanulife.com/downloads'
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'}
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read()
                  print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl())
                  return b,r.geturl()
          html,final=fetch(page)
          text=html.decode('utf-8','ignore')
          scripts=[urllib.parse.urljoin(final,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)]
          print('SCRIPTS',scripts)
          for full in scripts:
              if '/assets/' not in full: continue
              b,_=fetch(full); s=b.decode('utf-8','ignore')
              if not re.search(r'mandatory-disclosures|Total Expense Ratio',s,re.I): continue
              print('TARGET_SCRIPT',full,'LEN',len(s))
              for needle in [
                  'mandatory-disclosures',
                  'Total Expense Ratio of Mutual Fund Schemes',
                  'Total Expense Ratio',
                  'Mandatory Disclosures',
              ]:
                  p=0;n=0
                  while True:
                      p=s.lower().find(needle.lower(),p)
                      if p<0 or n>=40: break
                      ctx=re.sub(r'\s+',' ',s[max(0,p-3500):p+6500])
                      print('KEYWORD_CTX',needle,ctx[:10000])
                      p+=len(needle);n+=1

              print('URLISH')
              literals=set()
              for m in re.finditer(r'["\']([^"\']{3,300})["\']',s):
                  v=m.group(1)
                  if re.search(r'(download|disclos|expense|ratio|\bter\b|mandatory)',v,re.I):
                      literals.add(v)
              for v in sorted(literals):
                  print('LITERAL',v[:500])
          PY
