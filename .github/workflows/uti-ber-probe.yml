name: UTI BER source probe

on:
  push:
    branches: [investigate/uti-ber-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Inspect UTI official YTD TER workbook
        shell: bash
        run: |
          uv run --frozen python - <<'PY'
          import io, json, urllib.request
          import openpyxl

          API="https://www.utimf.com/api/page/get-ytd-ter-disc-page-data"
          UA="Mozilla/5.0"
          def get(url,limit=12_000_000):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read(limit+1)
                  print("FETCH",r.status,len(raw),r.geturl(),r.headers.get("content-type"))
                  if len(raw)>limit: raise RuntimeError("too large")
                  return raw

          meta=json.loads(get(API).decode())
          files=[]
          for item in meta.get("field_component") or []:
              data=(item or {}).get("data") or {}
              link=(data.get("link") or {}).get("url")
              if data.get("file_name") and link:
                  files.append((data["file_name"],link))
          print("FILES",files)
          for name,url in files:
              raw=get(url)
              print("FILE",name,url,len(raw))
              wb=openpyxl.load_workbook(io.BytesIO(raw),data_only=True,read_only=True)
              print("SHEETS",wb.sheetnames)
              for ws in wb.worksheets:
                  print("SHEET",ws.title,ws.max_row,ws.max_column)
                  for i,row in enumerate(ws.iter_rows(values_only=True),1):
                      vals=["" if v is None else str(v) for v in row]
                      if i<=10: print("ROW",i,vals[:25])
                      joined=" | ".join(vals).lower()
                      if "small cap" in joined or "smallcap" in joined:
                          print("SMALLCAP_ROW",i,vals)
              wb.close()
          PY
