name: UTI BER source probe

on:
  push:
    branches: [investigate/uti-ber-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Extract UTI TER component request shape
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          URL="https://www.utimf.com/main.4ae2d0c3fb6b241f.js"
          req=urllib.request.Request(URL,headers={"User-Agent":"Mozilla/5.0","Accept":"application/javascript"})
          with urllib.request.urlopen(req,timeout=30) as r:
              text=r.read(8_000_000).decode("utf-8","replace")
          low=text.lower()
          for needle in (".getterfiledetails(", "getterfiledetails(", ".getytdterfile(", ".getterfile("):
              start=0
              for n in range(20):
                  i=low.find(needle,start)
                  if i<0: break
                  print("USE",needle,n+1,re.sub(r"\s+"," ",text[max(0,i-3500):min(len(text),i+9000)]))
                  start=i+len(needle)
          for token in ("schemeName", "schemeCode", "fromDate", "toDate", "terDate"):
              start=0
              shown=0
              while shown<20:
                  i=text.find(token,start)
                  if i<0: break
                  nearby=text[max(0,i-1800):min(len(text),i+3500)]
                  if "getTER" in nearby or "getTer" in nearby or "TER" in nearby:
                      print("FIELD",token,shown+1,re.sub(r"\s+"," ",nearby)); shown+=1
                  start=i+len(token)
          PY
