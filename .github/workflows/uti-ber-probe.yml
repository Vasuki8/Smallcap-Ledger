name: UTI BER source probe

on:
  push:
    branches: [investigate/uti-ber-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe UTI public getTerData validation contract
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error

          URL="https://prod-api-investor.utimf.com/api/v1/scheduler/getTerData"
          UA="Mozilla/5.0"
          payloads=[
              {},
              {"schemeCode":"751"},
              {"SchemeCode":"751"},
              {"portfolio":"751"},
              {"Portfolio":"751"},
              {"schemeCode":"751","fromDate":"2026-09-01","toDate":"2026-09-25"},
              {"SchemeCode":"751","FromDate":"2026-09-01","ToDate":"2026-09-25"},
              {"portfolio":"751","fromDate":"2026-09-01","toDate":"2026-09-25"},
          ]
          for payload in payloads:
              raw=json.dumps(payload,separators=(",",":")).encode()
              req=urllib.request.Request(URL,data=raw,headers={
                  "User-Agent":UA,
                  "Accept":"application/json, text/plain, */*",
                  "Content-Type":"application/json",
                  "Origin":"https://www.utimf.com",
                  "Referer":"https://www.utimf.com/",
              },method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read(2_000_000).decode("utf-8","replace")
                      print("POST",payload,"STATUS",r.status,"BODY",body[:50000])
              except urllib.error.HTTPError as e:
                  body=e.read(2_000_000).decode("utf-8","replace")
                  print("HTTP_ERROR",payload,e.code,body[:50000])
              except Exception as e:
                  print("ERROR",payload,repr(e))
          PY
