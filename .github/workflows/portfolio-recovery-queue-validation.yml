name: Portfolio recovery queue validation

on:
  push:
    branches: [backend/portfolio-recovery-queue-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SMALLCAP_NO_SCHEDULER: '1'
      SMALLCAP_ARCHIVE_FORMAT: '2'
      SMALLCAP_DATABASE_ONLY_RESTORE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Compile
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: Run regression suite
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Restore production checkpoint
        run: uv run --frozen python scripts/github_state.py restore
      - name: Verify production recovery queue
        run: |
          uv run --frozen python - <<'PY'
          from datetime import date
          from tracker.portfolio_recovery_queue import report, markdown

          queue=report(today=date(2026,9,25))
          assert queue['summary']['items']==8,queue['summary']
          assert queue['summary']['actionable_now']==1,queue['summary']
          assert queue['summary']['stale_partial']==1,queue['summary']
          assert queue['summary']['missing']==1,queue['summary']
          assert queue['summary']['actions']=={
              'search_fuller_first_party_disclosure':1,
              'retry_after_source_change':4,
              'requires_more_precise_amc_disclosure':3,
          },queue['summary']['actions']
          assert queue['next_recovery_target']['family']=='Axis Small Cap Fund',queue['next_recovery_target']

          items={x['family']:x for x in queue['items']}
          assert items['Bajaj Finserv Small Cap Fund']['state']=='partial_stale'
          assert items['Union Small Cap Fund']['state']=='missing'
          for family,item in items.items():
              assert item['source_url'],family
              assert item['limitation'] and item['limitation']['code'],family
              evidence=item['evidence']
              assert evidence['latest_fetch'] or evidence['latest_source_page_check'],(family,evidence)
              assert item['retry_condition'],family
          for family in ('Union Small Cap Fund','ICICI Prudential Small Cap Fund',
                         'Edelweiss Small Cap Fund','Bajaj Finserv Small Cap Fund'):
              assert items[family]['action']=='retry_after_source_change',family
              assert not items[family]['actionable_now'],family
          for family in ('Bandhan Small Cap Fund','Sundaram Small Cap Fund','UTI Small Cap Fund'):
              assert items[family]['action']=='requires_more_precise_amc_disclosure',family
              assert not items[family]['actionable_now'],family

          rendered=markdown(queue)
          assert '# Portfolio recovery queue' in rendered
          assert '**Axis Small Cap Fund**' in rendered
          print('SUMMARY',queue['summary'])
          print('NEXT',queue['next_recovery_target'])
          for item in queue['items']:
              print('QUEUE',item['rank'],item['family'],item['state'],item['action'],
                    item['limitation']['code'],item['source_url'],
                    item['evidence']['latest_evidence_at'])
          PY
