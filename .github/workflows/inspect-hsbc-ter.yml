name: Inspect HSBC detailed TER workbook

on:
  push:
    branches: [backend/hsbc-ter-v131]
    paths: [.github/workflows/inspect-hsbc-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Trace CAMS download application
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          UA={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Referer':'https://www.assetmanagement.hsbc.co.in/'}
          base='https://digital.camsonline.com/dnlresult/hsbc_ter_report.xlsx'
          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read();print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl());return b,r.geturl()
          html,final=fetch(base)
          text=html.decode('utf-8','ignore')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)
          print('SCRIPTS',scripts)
          for src in scripts:
              full=urllib.parse.urljoin(final,src)
              b,_=fetch(full);s=b.decode('utf-8','ignore')
              if not re.search(r'dnlresult|download|xlsx|result|fileName|filename|api',s,re.I):continue
              print('SCRIPT_MATCH',full,'LEN',len(s))
              for needle in ['dnlresult','hsbc_ter_report','xlsx','download','fileName','filename','api/']:
                  p=0;n=0
                  while True:
                      p=s.lower().find(needle.lower(),p)
                      if p<0 or n>=20:break
                      print('CTX',needle,re.sub(r'\s+',' ',s[max(0,p-1000):p+1800])[:3000])
                      p+=len(needle);n+=1
          PY
