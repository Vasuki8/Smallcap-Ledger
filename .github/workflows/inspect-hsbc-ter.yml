name: Inspect HSBC detailed TER workbook

on:
  push:
    branches: [backend/hsbc-ter-v131]
    paths: [.github/workflows/inspect-hsbc-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Extract CAMS service implementation
        run: |
          python - <<'PY'
          import re,urllib.request
          req=urllib.request.Request('https://digital.camsonline.com/main.d08d2e9edfe7391e.js',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=45) as r:s=r.read().decode('utf-8','ignore')
          patterns=[
              r'getservicedata\s*\([^)]*\)\s*\{.{0,3500}',
              r'getservicedata2\s*\([^)]*\)\s*\{.{0,3500}',
              r'geterror\s*\([^)]*\)\s*\{.{0,2500}',
          ]
          for pat in patterns:
              print('PATTERN',pat)
              matches=list(re.finditer(pat,s,re.S))
              print('COUNT',len(matches))
              for i,m in enumerate(matches[:12],1):
                  print('MATCH',i,re.sub(r'\s+',' ',m.group(0))[:5000])
          # Print literal strings near the exact service implementation.
          for m in re.finditer(r'getservicedata\s*\(',s):
              block=s[max(0,m.start()-5000):m.start()+5000]
              if any(x in block for x in ['HttpClient','http.post','.post(']):
                  print('LIKELY_SERVICE',re.sub(r'\s+',' ',block)[:10000])
          PY
