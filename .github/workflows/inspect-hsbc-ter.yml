name: Inspect HSBC detailed TER workbook

on:
  push:
    branches: [backend/hsbc-ter-v131]
    paths: [.github/workflows/inspect-hsbc-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Locate CAMS service endpoint
        run: |
          python - <<'PY'
          import re,urllib.request
          url='https://digital.camsonline.com/main.d08d2e9edfe7391e.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r:s=r.read().decode('utf-8','ignore')
          for needle in ['getservicedata(', 'GET_UPD_MB_RESULT', '/api/', 'api/v1', 'serviceurl', 'baseUrl', 'baseurl']:
              print('NEEDLE',needle)
              p=0;n=0
              while True:
                  p=s.find(needle,p)
                  if p<0 or n>=35:break
                  print(re.sub(r'\s+',' ',s[max(0,p-1800):p+2600])[:4600])
                  p+=len(needle);n+=1
          print('URL_STRINGS')
          vals=set(re.findall(r'https?://[^"\'\\ ]+',s))
          for v in sorted(vals):
              if 'cams' in v.lower() or 'api' in v.lower():
                  print(v[:500])
          PY
