name: Validate HSBC detailed TER collector

on:
  push:
    branches: [backend/hsbc-ter-v131]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python -m compileall -q tracker scripts tests
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Verify live AMC-linked HSBC TER workbook
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          from datetime import date
          from tracker import amc_expenses
          workbook=amc_expenses._hsbc_workbook()
          day,plans=amc_expenses.parse_hsbc_workbook(workbook,date.today())
          assert set(plans)=={'Regular','Direct'}
          assert 0 <= plans['Direct']['base_expense_ratio'] <= plans['Direct']['ter'] <= 5
          assert 0 <= plans['Regular']['base_expense_ratio'] <= plans['Regular']['ter'] <= 5
          print('HSBC_VERIFIED',day,plans)
          print('HSBC_WORKBOOK_BYTES',len(workbook))
          print('HSBC_WORKBOOK_SHA256',hashlib.sha256(workbook).hexdigest())
          PY
