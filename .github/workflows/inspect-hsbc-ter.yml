name: Inspect HSBC August expense block

on:
  push:
    branches: [backend/hsbc-ter-v131]
    paths: [.github/workflows/inspect-hsbc-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - name: Inspect exact official HSBC August factsheet
        run: |
          uv run --frozen python - <<'PY'
          import io,re,urllib.request
          from pypdf import PdfReader

          url='https://www.assetmanagement.hsbc.co.in/-/media/Files/attachments/india/mutual-funds/factsheet/the-asset-august-2026.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              body=r.read();print('PDF',r.status,len(body),r.headers.get('content-type'),r.geturl())
          reader=PdfReader(io.BytesIO(body))
          print('PAGES',len(reader.pages),'ENCRYPTED',reader.is_encrypted)
          for i,page in enumerate(reader.pages):
              text=page.extract_text() or ''
              if re.search(r'HSBC\s+Small\s+Cap\s+Fund',text,re.I):
                  print('PAGE',i+1,'DEFAULT_LEN',len(text))
                  flat=re.sub(r'\s+',' ',text)
                  for needle in ['Expense Ratio','Total Expense Ratio','Base Expense Ratio','Month End Total Expense Ratios','Regular','Direct']:
                      p=flat.lower().find(needle.lower())
                      print('NEEDLE',needle,p)
                      if p>=0:print('CTX',flat[max(0,p-900):p+2600])
                  layout=page.extract_text(extraction_mode='layout') or ''
                  print('LAYOUT_LEN',len(layout))
                  for needle in ['Expense Ratio','Total Expense Ratio','Base Expense Ratio','Month End Total Expense Ratios']:
                      p=layout.lower().find(needle.lower())
                      if p>=0:
                          print('LAYOUT_CTX',needle)
                          print(layout[max(0,p-1200):p+4000])
          PY
