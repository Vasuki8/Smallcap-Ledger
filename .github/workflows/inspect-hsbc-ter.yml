name: Inspect HSBC detailed TER workbook

on:
  push:
    branches: [backend/hsbc-ter-v131]
    paths: [.github/workflows/inspect-hsbc-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect CAMS public config and crypto
        run: |
          python - <<'PY'
          import re,urllib.request
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read();print('FETCH',r.status,len(b),r.headers.get('content-type'),r.geturl());return b
          cfg=fetch('https://digital.camsonline.com/assets/url.txt').decode('utf-8','ignore')
          print('URL_CONFIG',cfg)
          s=fetch('https://digital.camsonline.com/main.d08d2e9edfe7391e.js').decode('utf-8','ignore')
          for needle in ['encryption(e,n)', 'encryption(', 'Decryption(', 'Encrypt', 'CryptoJS', 'AES.encrypt', 'AES.decrypt']:
              print('NEEDLE',needle)
              p=0;n=0
              while True:
                  p=s.find(needle,p)
                  if p<0 or n>=20:break
                  block=re.sub(r'\s+',' ',s[max(0,p-1800):p+3200])
                  if any(x in block for x in ['AES','Crypto','encryption','Decryption']):
                      print('CTX',block[:5200])
                  p+=len(needle);n+=1
          PY
