name: Inspect HSBC detailed TER workbook

on:
  push:
    branches: [backend/hsbc-ter-v131]
    paths: [.github/workflows/inspect-hsbc-ter.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect CAMS HSBC TER intermediary
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          url='https://digital.camsonline.com/dnlresult/hsbc_ter_report.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Smallcap-Ledger/1.0','Referer':'https://www.assetmanagement.hsbc.co.in/'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=r.read(); final=r.geturl()
              print('FETCH',r.status,len(body),r.headers.get('content-type'),final)
              print('HEADERS',dict(r.headers))
          html=body.decode('utf-8','ignore')
          print('HTML_BEGIN')
          print(html)
          print('HTML_END')
          for pat in [
              r'https?://[^"\'<> ]+',
              r'[^"\'<> ]+\.xlsx(?:\?[^"\'<> ]*)?',
              r'(?:href|src|url|action)\s*[:=]\s*["\']([^"\']+)'
          ]:
              print('PATTERN',pat)
              for m in re.finditer(pat,html,re.I):
                  print(m.group(0))
          PY
