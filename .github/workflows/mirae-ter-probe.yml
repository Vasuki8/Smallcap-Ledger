name: Mirae TER validation

on:
  push:
    branches: [investigate/mirae-ter-20260925]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Compile
        run: uv run --frozen python -m compileall -q tracker scripts tests
      - name: Run regression suite
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Validate live Mirae first-party TER route
        run: |
          uv run --frozen python - <<'PY'
          from datetime import date
          from tracker import amc_expenses, db
          db.init()
          source, day, plans, content_hash = amc_expenses._mirae_disclosure(date.today())
          assert source.startswith("https://www.miraeassetmf.co.in/DailyUploads/TotalExpenseRatio/")
          assert day <= date.today().isoformat()
          assert plans["Regular"]["ter"] >= plans["Regular"]["base_expense_ratio"]
          assert plans["Direct"]["ter"] >= plans["Direct"]["base_expense_ratio"]
          assert content_hash
          print("MIRAE_SOURCE", source)
          print("MIRAE_DAY", day)
          print("MIRAE_REGULAR", plans["Regular"])
          print("MIRAE_DIRECT", plans["Direct"])
          print("MIRAE_HASH", content_hash)
          PY
