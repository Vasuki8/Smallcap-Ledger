name: Mirae TER public-source probe

on:
  push:
    branches: [investigate/mirae-ter-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Mirae public TER download service
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request

          BASE="https://www.miraeassetmf.co.in"
          PAGE=BASE+"/downloads/statutory-disclosure/total-expense-ratio"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

          def post(method, payload):
              url=BASE+"/AjaxService/"+method
              raw=json.dumps(payload,separators=(",",":")).encode()
              req=urllib.request.Request(url,data=raw,headers={
                  "User-Agent":UA,
                  "Accept":"application/json, text/javascript, */*; q=0.01",
                  "Content-Type":"application/json;charset=utf-8",
                  "Origin":BASE,
                  "Referer":PAGE,
                  "X-Requested-With":"XMLHttpRequest",
              },method="POST")
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=r.read(5_000_000)
                  print("POST",method,r.status,len(data),r.geturl(),r.headers.get("content-type"))
                  obj=json.loads(data)
                  print(method,json.dumps(obj,indent=2,ensure_ascii=False)[:100000])
                  return obj

          post("GetDownloadsYears",{"request":{"modulename":"TotalExpenseRatio"}})
          post("GetDownloadsData",{"request":{
              "modulename":"TotalExpenseRatio",
              "title":"",
              "fromdate":"2026-01-01",
              "todate":"2026-12-31",
              "pgno":1,
              "pgsize":100,
          }})
          post("GetTERNoticeDownloads",{})
          PY
