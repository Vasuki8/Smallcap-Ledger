name: Mirae TER public-source probe

on:
  push:
    branches: [investigate/mirae-ter-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public Mirae TER page and browser scripts
        shell: bash
        run: |
          python - <<'PY'
          import html, re, urllib.parse, urllib.request

          PAGE = "https://www.miraeassetmf.co.in/downloads/statutory-disclosure/total-expense-ratio"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

          def get(url, limit=8_000_000):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read(limit + 1)
                  print("FETCH", r.status, len(data), r.geturl(), r.headers.get("content-type"))
                  if len(data) > limit:
                      raise RuntimeError("response too large")
                  return data.decode("utf-8", "replace")

          page = get(PAGE)
          print("PAGE_TERMS")
          for term in ("expense", "ratio", "publish", "search", "ajax", "api", "service", "sitefinity"):
              hits=[m.start() for m in re.finditer(term, page, re.I)]
              print(term, len(hits), hits[:15])

          print("FORM_AND_INPUT_SNIPPETS")
          for m in re.finditer(r"<(?:form|input|button)[^>]{0,1000}>", page, re.I|re.S):
              s=re.sub(r"\s+"," ",m.group(0))
              if re.search(r"ter|expense|publish|search|date|title",s,re.I):
                  print(html.unescape(s[:1800]))

          scripts=[]
          for m in re.finditer(r"<script[^>]+src=[\"']([^\"']+)", page, re.I):
              src=html.unescape(m.group(1))
              scripts.append(urllib.parse.urljoin(PAGE,src))
          print("SCRIPTS", len(scripts))
          for s in scripts:
              print("SCRIPT", s)

          needles=("totalexpense","total-expense","expense ratio","publishdate","publish date",
                   "searchtotal","statutory","ajax","api/","service","sitefinity","sfapi")
          for s in scripts:
              if urllib.parse.urlparse(s).hostname not in {
                  "www.miraeassetmf.co.in","miraeassetmf.co.in"
              }:
                  continue
              try:
                  text=get(s, 6_000_000)
              except Exception as e:
                  print("SCRIPT_ERROR", s, repr(e))
                  continue
              low=text.lower()
              matched=[n for n in needles if n in low]
              if not matched:
                  continue
              print("MATCHED_SCRIPT", s, matched)
              for n in matched:
                  start=0
                  shown=0
                  while shown < 8:
                      i=low.find(n,start)
                      if i<0: break
                      a=max(0,i-500); b=min(len(text),i+1000)
                      print("SNIP",n, re.sub(r"\s+"," ",text[a:b]))
                      start=i+len(n); shown+=1
          PY
