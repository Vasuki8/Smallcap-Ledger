name: Mirae TER public-source probe

on:
  push:
    branches: [investigate/mirae-ter-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Mirae public TER service contract
        shell: bash
        run: |
          python - <<'PY'
          import html, re, urllib.parse, urllib.request

          PAGE = "https://www.miraeassetmf.co.in/downloads/statutory-disclosure/total-expense-ratio"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

          def get(url, limit=10_000_000):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read(limit + 1)
                  print("FETCH", r.status, len(data), r.geturl(), r.headers.get("content-type"))
                  if len(data) > limit:
                      raise RuntimeError("response too large")
                  return data.decode("utf-8", "replace")

          page=get(PAGE)
          urls=[]
          for m in re.finditer(r"<script[^>]+src=[\"']([^\"']+)",page,re.I):
              urls.append(urllib.parse.urljoin(PAGE,html.unescape(m.group(1))))
          for u in urls:
              if urllib.parse.urlparse(u).hostname not in {"www.miraeassetmf.co.in","miraeassetmf.co.in"}:
                  continue
              try:
                  text=get(u)
              except Exception as e:
                  print("ERROR",u,repr(e)); continue
              for needle in (
                  "GetDownloadsDataAsync","GetDownloadsYearsAsync","GetTERNoticeDownloads",
                  "AjaxService","GetDownloadsData","TotalExpenseRatio"
              ):
                  start=0
                  shown=0
                  low=text.lower(); token=needle.lower()
                  while shown<12:
                      i=low.find(token,start)
                      if i<0: break
                      a=max(0,i-1000); b=min(len(text),i+2200)
                      print("CONTEXT",u,needle,re.sub(r"\s+"," ",text[a:b]))
                      start=i+len(token); shown+=1

          print("PAGE_AJAXSERVICE_CONTEXT")
          for needle in ("AjaxService","GetDownloadsDataAsync","GetTERNoticeDownloads"):
              start=0
              while True:
                  i=page.lower().find(needle.lower(),start)
                  if i<0: break
                  print("PAGE_CONTEXT",needle,re.sub(r"\s+"," ",page[max(0,i-1200):min(len(page),i+2400)]))
                  start=i+len(needle)
          PY
